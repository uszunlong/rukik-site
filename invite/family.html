<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邀请您加入家庭空间｜Rukik</title>
<meta name="description" content="家人邀请您进入同一个 Rukik 家庭空间，共享家庭记忆、目标与提醒。">
<link rel="canonical" href="https://rukik.com/invite/family">
<link rel="icon" type="image/png" href="/assets/seal.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rukik">
<meta property="og:title" content="邀请您加入家庭空间">
<meta property="og:description" content="家人邀请您进入同一个 Rukik 家庭空间，共享家庭记忆、目标与提醒。">
<meta property="og:image" content="https://rukik.com/assets/og-share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://rukik.com/invite/family">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="邀请您加入家庭空间">
<meta name="twitter:description" content="家人邀请您进入同一个 Rukik 家庭空间，共享家庭记忆、目标与提醒。">
<meta name="twitter:image" content="https://rukik.com/assets/og-share.png">
<style>
  :root { --ivory:#FAF7F1; --navy:#142235; --gold:#B58A58; --gray:#8A8378; --line:#E5DED2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ivory); color:var(--navy); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:56px 24px 64px; text-align:center; }
  img.seal { width:104px; height:104px; border-radius:22px; }
  .from { margin-top:26px; color:var(--gold); font-size:14px; letter-spacing:1px; }
  h1 { font-size:27px; line-height:1.5; margin:14px 0 6px; }
  .tagline { color:var(--gold); font-size:17px; letter-spacing:2px; margin-bottom:12px; }
  p.desc { color:#5c574f; line-height:1.9; font-size:15.5px; }
  .codebox { margin:30px auto 8px; max-width:420px; border:1px solid var(--line); border-radius:14px; background:#fff; padding:18px 16px; }
  .codebox .label { font-size:12px; color:var(--gray); letter-spacing:2px; margin-bottom:8px; }
  .codebox .code { font-size:26px; font-weight:700; letter-spacing:4px; color:var(--navy); }
  .codebox .hint { font-size:12.5px; color:var(--gray); margin-top:8px; line-height:1.7; }
  .steps { margin:22px auto 0; max-width:420px; text-align:left; color:#5c574f; font-size:14.5px; line-height:2; }
  .btn { display:inline-block; background:var(--navy); color:#fff; text-decoration:none; border:none; cursor:pointer;
         padding:13px 32px; border-radius:999px; font-size:15.5px; margin:6px 4px; }
  .btn.gold { background:var(--gold); }
  .btn.ghost { background:transparent; color:var(--navy); border:1px solid var(--navy); }
  .row { margin-top:22px; }
  .foot { margin-top:52px; color:var(--gray); font-size:11px; letter-spacing:.4px; }
  .foot .b { color:var(--navy); font-weight:700; letter-spacing:2px; font-size:13px; margin-bottom:5px; }
  .missing { color:var(--gray); padding:60px 0; line-height:2; }
</style>
</head>
<body>
<div class="wrap">
  <img class="seal" src="/assets/seal.png" alt="Rukik">
  <div id="app">
    <div class="missing">正在为您打开邀请…</div>
  </div>
  <div class="foot">
    <div class="b">R U K I K</div>
    Know You · Anticipate You · Support You · Empower You
  </div>
</div>
<script>
var APP_STORE_URL = "https://apps.apple.com/us/app/rukik/id6824554988";
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
var params = new URLSearchParams(location.search);
var code = (params.get("f") || params.get("code") || "").toUpperCase();
var app = document.getElementById("app");

function deepLink(){
  return "rukik://share/join?code=" + encodeURIComponent(code);
}

function render(){
  if (!code) {
    app.innerHTML = '<div class="missing">邀请链接不完整。<br><a href="https://rukik.com/">前往了解 Rukik</a></div>';
    return;
  }
  app.innerHTML =
    '<div class="from">家人邀请您加入他的家庭空间</div>' +
    '<h1>邀请加入家庭空间</h1>' +
    '<div class="tagline">一家人，一个空间</div>' +
    '<p class="desc">加入后，您和全家共享同一个 Rukik 家庭空间：<br>家庭记忆、目标与提醒都会同步。</p>' +
    '<div class="codebox"><div class="label">家庭邀请码</div>' +
    '<div class="code">' + esc(code) + '</div>' +
    '<div class="hint">请保存好这个码，加入时要用。</div></div>' +
    '<div class="steps">加入只要三步：<br>1. 下载并打开 Rukik，注册登录<br>2. 进入「我的家庭」，点「加入他的家庭空间」<br>3. 输入上面的家庭邀请码</div>' +
    '<div class="row">' +
    '<button class="btn gold" id="copyBtn">复制邀请码</button>' +
    '<a class="btn" id="openBtn" href="' + deepLink() + '">打开 Rukik 加入</a>' +
    '</div><div class="row">' +
    '<a class="btn ghost" id="storeBtn" href="' + APP_STORE_URL + '">前往 App Store 下载</a>' +
    '</div>';
  document.getElementById("copyBtn").addEventListener("click", function(){
    var btn = this;
    function done(){ btn.textContent = "已复制"; setTimeout(function(){ btn.textContent = "复制邀请码"; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done).catch(done);
    } else { done(); }
  });
}
render();
</script>
</body>
</html>
