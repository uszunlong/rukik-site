<style>
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#F7F3EC; color:#202020; }

         padding:13px 36px; border-radius:999px; font-size:16px; margin-top:30px; }

</style>

<body>
<div class="wrap">
  <img class="seal" src="/assets/seal.png" alt="Rukik">
  <h1>Rukik</h1>
  <div class="slogan">AI懂很多，但 Rukik 更懂您。</div>
  <p class="desc">懂您的生活，也成就更专业的您。<br><br>慢慢了解您，记住您在意的人和事，<br>在需要的时候，替您多想一步。</p>
  <a class="btn" id="openApp" href="https://apps.apple.com/us/app/rukik/id6824554988">打开 Rukik</a>

</div>
<script>
// CTA「打开 Rukik」：移动端先尝试以 rukik:// 唤起 App，未唤起则延时跳 App Store；
// 桌面端直接前往 App Store（按钮文案随之改为「在 App Store 下载」）。站点未托管 AASA，暂不走 Universal Link。
(function () {
  var STORE = "https://apps.apple.com/us/app/rukik/id6824554988";
  var btn = document.getElementById("openApp");
  var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || "");
  if (!mobile) { btn.textContent = "在 App Store 下载"; return; }
  btn.addEventListener("click", function (e) {
    e.preventDefault();
    var start = Date.now();
    var timer = setTimeout(function () {
      if (!document.hidden && Date.now() - start < 2500) location.href = STORE;
    }, 1200);
    window.addEventListener("pagehide", function () { clearTimeout(timer); }, { once: true });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) clearTimeout(timer);
    });
    location.href = "rukik://";
  });
})();
</script>
