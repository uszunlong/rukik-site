<script>
(function(){
  var B={"slug": "bf019fdcde12", "fn": "https://yzgzgtrqrmarfjftgbwt.supabase.co/functions/v1/listing-webchat", "anon": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6Z3pndHJxcm1hcmZqZnRnYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTkzNjksImV4cCI6MjEwNzg3NTM2OX0.SORkmMkYrorMPHdDBwgyG8bRIJRi7hhhLHKe5mvQCnc"};
  function post(body){ try { return fetch(B.fn, {method:'POST', keepalive:true,
    headers:{'apikey':B.anon,'Content-Type':'application/json'}, body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(d){return {status:r.status,data:d}})}); } catch(e) { return Promise.reject(e); } }
  // 浏览计数：同浏览器同房源用 session_ref 去重（服务端再按 60 秒窗兜底）
  try {
    var rk='rk_ref_'+B.slug, refv=sessionStorage.getItem(rk);
    if(!refv) { refv='w'+Math.random().toString(36).slice(2)+Date.now().toString(36); sessionStorage.setItem(rk, refv); }
    post({action:'view', slug:B.slug, session_ref:refv}).catch(function(){});
  } catch(e) {}
  // 画廊页码计数（无画廊页面自动跳过）
  document.querySelectorAll('.gal2').forEach(function(g){
    var t=g.querySelector('.track'), cn=g.querySelector('.gcount');
    if(!t||!cn) return;
    t.addEventListener('scroll', function(){
      var n=t.children.length, i=Math.round(t.scrollLeft/Math.max(t.clientWidth,1));
      cn.textContent=(Math.min(Math.max(i,0),n-1)+1)+'/'+n;
    }, {passive:true});
  });
  var cfg=window.RK_CFG; if(!cfg) return;
  var $=function(id){return document.getElementById(id)};
  // 键盘感知（微信内置浏览器 vh 不随键盘变）：用 visualViewport 把遮罩钉在
  // 可见视口内——键盘弹起时面板底部恰在键盘上方并切 .kb 压缩底部留白，
  // 收起后自动恢复；--rk-vh 供面板 max-height 同步收缩，消息区随之让位。
  function rkFit(){ var vv=window.visualViewport, m=$('rkMask'); if(!vv||!m) return;
    m.style.top=vv.offsetTop+'px'; m.style.height=vv.height+'px';
    document.documentElement.style.setProperty('--rk-vh', vv.height+'px');
    var kb=(window.innerHeight-vv.height)>80, p=m.querySelector('.ask-panel');
    if(p) p.classList.toggle('kb', kb);
    if(!m.hidden) { var g=$('rkMsgs'); if(g) g.scrollTop=g.scrollHeight; } }
  if(window.visualViewport) { window.visualViewport.addEventListener('resize', rkFit);
    window.visualViewport.addEventListener('scroll', rkFit); }
  window.addEventListener('orientationchange', function(){ setTimeout(rkFit, 300); });
  var tokKey='rk_sess_'+cfg.slug, tok=null;
  try { tok=sessionStorage.getItem(tokKey); } catch(e) {}
  var sending=false, replies=0, leadShown=false;
  // 轻量 Markdown 渲染：AI 回复是 Markdown 源码（## / ** / - 列表），原样
  // textContent 会把标记当普通文字露出。先转义 HTML 再做标记替换（访客与
  // AI 文本都不可信），只支持加粗/标题/有序无序列表/分段，不引任何库。
  function rkMd(t){ var s=String(t==null?'':t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    function inl(x){ return x.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
    var lines=s.split(/\r?\n/), out=[], list=0;
    function closeList(){ if(list===1) out.push('</ul>'); if(list===2) out.push('</ol>'); list=0; }
    lines.forEach(function(ln){ var m;
      if(m=ln.match(/^\s*[-*•]\s+(.*)$/)){ if(list!==1){ closeList(); out.push('<ul class="md-ul">'); list=1; }
        out.push('<li>'+inl(m[1])+'</li>'); return; }
      if(m=ln.match(/^\s*\d{1,2}[.、)]\s+(.*)$/)){ if(list!==2){ closeList(); out.push('<ol class="md-ol">'); list=2; }
        out.push('<li>'+inl(m[1])+'</li>'); return; }
      closeList();
      if(m=ln.match(/^\s*#{1,6}\s+(.*)$/)){ out.push('<div class="md-h">'+inl(m[1])+'</div>'); return; }
      if(/^\s*(-{3,}|={3,})\s*$/.test(ln)){ out.push('<div>&nbsp;</div>'); return; }
      ln=ln.replace(/^\s*>\s?/,'');
      out.push('<div>'+(ln.trim()?inl(ln):'&nbsp;')+'</div>'); });
    closeList(); return out.join(''); }
  function bubble(text, me, wait){ var d=document.createElement('div');
    d.className='msg '+(me?'me':'ai')+(wait?' wait':'');
    if(me) d.textContent=text; else d.innerHTML=rkMd(text);
    $('rkMsgs').appendChild(d); $('rkMsgs').scrollTop=$('rkMsgs').scrollHeight; return d; }
  function ensureSession(){ if(tok) return Promise.resolve(tok);
    return post({action:'start', slug:cfg.slug}).then(function(r){
      if(r.status===200 && r.data.session_token) { tok=r.data.session_token;
        try { sessionStorage.setItem(tokKey, tok); } catch(e) {}
        $('rkSub').textContent=(cfg.agent?cfg.agent+' 的 AI 团队':'AI 团队')+' · 在线';
        return tok; }
      throw new Error('start_failed'); }); }
  function openPanel(){ $('rkMask').hidden=false; rkFit();
    // 问候语是固定文案、已随模板预渲染在消息区，点开即在；这里只预热会话
    // （回填副标题/令牌），不再等建会话往返。预热失败静默——发送时自会
    // 重试并在等待行上给出失败提示。
    ensureSession().catch(function(){}); }
  function showLead(){ leadShown=true; $('rkLead').hidden=false; }
  function send(){ var v=$('rkInput').value.trim(); if(!v||sending) return;
    sending=true; bubble(v, true); $('rkInput').value='';
    // 真实等待态：只表示「等待中」这一个真实状态，不编造进度阶段；
    // 回复到达即移除，网络失败则原地变可点击重试的失败行。
    var wait=bubble('正在为您核对这套房的信息…', false, true);
    ensureSession().then(function(t){ return post({action:'chat', session_token:t, message:v}); })
    .then(function(r){ sending=false; if(wait) wait.remove();
      if(r.status===200 && r.data.reply) { bubble(r.data.reply, false); replies++;
        if(replies>=2 && !leadShown) showLead(); }
      else if(r.data && r.data.error==='round_limit') { bubble('这次先聊到这儿——想继续了解，直接请经纪人联系您吧。', false); showLead(); }
      else if(r.status===401) { tok=null; try { sessionStorage.removeItem(tokKey); } catch(e) {}
        bubble('会话过期了，请关掉面板重新打开。', false); }
      else bubble('这个问题我暂时答不上来，换个问法试试，或者请经纪人直接联系您。', false); })
    .catch(function(){ sending=false;
      if(wait) { wait.classList.remove('wait'); wait.classList.add('waitfail');
        wait.textContent='发送失败，网络有点问题。点这里重试。';
        wait.addEventListener('click', function(){ wait.remove(); $('rkInput').value=v; send(); }); }
      else bubble('网络有点问题，请稍后再试。', false); }); }
  $('rkAskOpen').addEventListener('click', openPanel);
  // 快捷咨询模板卡片（V1.0）：点击把完整问句填入输入框并直接发送，
  // 与手动输入走同一条 send() 链路（等待态/失败重试/轮次上限全复用）；
  // 房源上下文由服务端按 listing 注入，问句本身不带地址价格。
  document.querySelectorAll('.qcard').forEach(function(b){
    b.addEventListener('click', function(){ var q=b.getAttribute('data-q');
      if(!q || sending) return; $('rkInput').value=q; send(); }); });
  var rkQT=$('rkQuickToggle'), rkQM=$('rkQuickMore');
  if(rkQT && rkQM) rkQT.addEventListener('click', function(){ var open=rkQM.hidden;
    rkQM.hidden=!open; rkQT.textContent=open?'收起 ▴':'展开更多问题 ▾'; });
  $('rkClose').addEventListener('click', function(){ $('rkMask').hidden=true; });
  $('rkSend').addEventListener('click', send);
  $('rkInput').addEventListener('keydown', function(e){ if(e.key==='Enter') send(); });
  $('rkLeadOpen').addEventListener('click', showLead);
  $('rkLeadBtn').addEventListener('click', function(){
    var contact=$('rkLeadContact').value.trim();
    if(!contact) { $('rkLeadMsg').textContent='请先填写手机号或邮箱。'; return; }
    if(!$('rkLeadConsent').checked) { $('rkLeadMsg').textContent='请先勾选同意，经纪人才能联系您。'; return; }
    ensureSession().then(function(t){ return post({action:'lead', session_token:t,
      customer_name:$('rkLeadName').value.trim(), contact:contact, consent:true}); })
    .then(function(r){ if(r.status===200 && r.data.ok) {
        $('rkLead').innerHTML='<div style="font-weight:700">已提交 ✓</div><p class="note">经纪人会就这套房尽快与您联系，请留意来电与消息。</p>'; }
      else $('rkLeadMsg').textContent='提交没成功，请稍后再试。'; })
    .catch(function(){ $('rkLeadMsg').textContent='网络有点问题，请稍后再试。'; }); });
  $('rkSubBtn').addEventListener('click', function(){
    var contact=$('rkSubContact').value.trim();
    if(!contact) { $('rkSubMsg').textContent='请先填写手机号或邮箱。'; return; }
    if(!$('rkSubConsent').checked) { $('rkSubMsg').textContent='请先勾选同意，我们才能通知您。'; return; }
    ensureSession().then(function(t){ return post({action:'subscribe', session_token:t, contact:contact, consent:true}); })
    .then(function(r){ $('rkSubMsg').textContent=(r.status===200 && r.data.ok)
      ? '已订阅。这套房状态变化时会通知您。' : '订阅没成功，请稍后再试。'; })
    .catch(function(){ $('rkSubMsg').textContent='网络有点问题，请稍后再试。'; }); });
})();
