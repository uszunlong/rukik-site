<!-- ============================================================
  Rukik 专业人士落地页 · 网页直接咨询聊天区（可复用片段）
  用法（给某位专业人士生成 /p/{id}/index.html 时套用）：
    1. 把下面 <style> 里的 .chat 相关样式并入页面 <style>。
    2. 把 .chat 的 HTML 块放进页面正文（建议放在介绍卡片之后、下载按钮之前）。
    3. 把 <script> 块放在 </body> 之前。
    4. 替换两处占位符：
       __PROFESSIONAL_ID__  → 该专业人士在 professionals 表的 id
       __SUPABASE_ANON_KEY__ → Rukik Supabase 项目的 anon key（公开客户端 key，可出现在网页）
  规则（构建 16 起）：
    - 咨询必须先注册/登录（邮箱验证码，与 App 同一账号体系），未登录只显示注册卡。
    - 网页端最多 3 轮（客户端计数 + 后端 pro-chat 服务端兜底 + 服务端要求登录态），
      满 3 轮后禁用输入并显示下载 App 引导卡。
    - 回复为流式逐段显示。
  ============================================================ -->

<style>
  .chat { background:#fff; border-radius:16px; padding:20px; margin-top:28px; text-align:left; box-shadow:0 2px 12px rgba(20,34,53,.06); }
  .chat-title { font-size:16px; font-weight:600; color:#142235; margin-bottom:12px; text-align:center; }
  .msgs { display:flex; flex-direction:column; gap:10px; max-height:420px; overflow-y:auto; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:#142235; color:#F7F3EC; border-bottom-right-radius:4px; }
  .msg.ai { align-self:flex-start; background:#F7F3EC; color:#202020; border-bottom-left-radius:4px; }
  .chat-row { display:flex; gap:8px; margin-top:14px; }
  .chat-row input { flex:1; border:1px solid #e3ddd2; border-radius:999px; padding:11px 16px; font-size:15px; outline:none; background:#fff; color:#202020; }
  .chat-row input:disabled { background:#f1ede4; color:#8B857D; }
  .chat-row button { background:#B58A58; color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:15px; cursor:pointer; }
  .chat-row button:disabled { opacity:.55; cursor:default; }
  .chat-note { margin-top:10px; font-size:12px; color:#8B857D; text-align:center; }
  .dl { margin-top:16px; background:#F7F3EC; border-radius:12px; padding:16px; text-align:center; font-size:14px; line-height:1.8; color:#44403a; }
  .dl .btn { margin-top:10px; }
  .auth-hint { font-size:14px; line-height:1.7; color:#44403a; text-align:center; margin:0 0 14px; }
  .auth-row { display:flex; gap:8px; margin-top:10px; }
  .auth-row input { flex:1; border:1px solid #e3ddd2; border-radius:999px; padding:11px 16px; font-size:15px; outline:none; background:#fff; color:#202020; min-width:0; }
  .auth-row button { background:#142235; color:#F7F3EC; border:none; border-radius:999px; padding:11px 18px; font-size:15px; cursor:pointer; white-space:nowrap; }
  .auth-row button:disabled { opacity:.55; cursor:default; }
  .auth-msg { margin-top:10px; font-size:13px; line-height:1.6; color:#8B857D; text-align:center; min-height:18px; }
  .auth-bar { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#8B857D; margin-bottom:10px; }
  .auth-bar button { background:none; border:none; color:#B58A58; font-size:12px; cursor:pointer; padding:0; }
</style>

<div class="chat">
  <div id="authBox">
    <div class="chat-title">注册后即可向我的 AI 助理提问</div>
    <p class="auth-hint">用邮箱注册一次，网页和 Rukik App 都能登录咨询。复杂问题还可以直接联系我本人。</p>
    <div class="auth-row">
      <input id="authName" type="text" placeholder="你的称呼（选填）" maxlength="40" autocomplete="name">
    </div>
    <div class="auth-row">
      <input id="authEmail" type="email" placeholder="邮箱地址" maxlength="120" autocomplete="email">
      <button id="authSendCode" type="button">发送验证码</button>
    </div>
    <div class="auth-row" id="authCodeRow" hidden>
      <input id="authCode" type="text" inputmode="numeric" placeholder="邮箱收到的验证码" maxlength="10" autocomplete="one-time-code">
      <button id="authVerify" type="button">验证并登录</button>
    </div>
    <div class="auth-msg" id="authMsg">正在准备登录…</div>
  </div>
  <div id="chatBox" hidden>
    <div class="auth-bar"><span id="authBarText"></span><button id="authLogout" type="button">退出登录</button></div>
    <div class="chat-title">直接向我的 AI 助理提问</div>
    <div class="msgs" id="chatMsgs"></div>
    <div class="chat-row">
      <input id="chatInput" type="text" placeholder="输入你的问题……" maxlength="2000" autocomplete="off">
      <button id="chatSend" type="button">发送</button>
    </div>
    <div class="chat-note">网页端可免费咨询 3 轮 · AI 回答仅供参考，不构成正式专业意见</div>
    <div class="dl" id="chatDownload" hidden>
      网页端的 3 轮免费咨询已用完。下载 Rukik App，可以继续不限轮次地咨询，需要时还能把问题转给我本人跟进。<br>
      <a class="btn" href="https://apps.apple.com/app/id6824554988">下载 Rukik App 继续咨询</a>
    </div>
  </div>
</div>

<script>
  // 看门狗：登录模块（type=module）若因网络等原因没能启动，给出兜底提示，避免页面静默无反应
  setTimeout(function () {
    if (!window.__rukikChatReady) {
      var m = document.getElementById('authMsg');
      if (m && !document.getElementById('authBox').hidden) {
        m.textContent = '登录组件加载较慢，请刷新页面重试，或下载 Rukik App 咨询。';
      }
    }
  }, 8000);
</script>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  var SUPABASE_URL = 'https://yzgzgtrqrmarfjftgbwt.supabase.co';
  var API_URL = SUPABASE_URL + '/functions/v1/pro-chat';
  var ANON_KEY = '__SUPABASE_ANON_KEY__';
  var PROFESSIONAL_ID = '__PROFESSIONAL_ID__';
  var MAX_ROUNDS = 3;

  var authBox = document.getElementById('authBox');
  var chatBox = document.getElementById('chatBox');
  var nameEl = document.getElementById('authName');
  var emailEl = document.getElementById('authEmail');
  var sendCodeBtn = document.getElementById('authSendCode');
  var codeRow = document.getElementById('authCodeRow');
  var codeEl = document.getElementById('authCode');
  var verifyBtn = document.getElementById('authVerify');
  var authMsg = document.getElementById('authMsg');
  var authBarText = document.getElementById('authBarText');
  var logoutBtn = document.getElementById('authLogout');
  var msgsEl = document.getElementById('chatMsgs');
  var inputEl = document.getElementById('chatInput');
  var sendBtn = document.getElementById('chatSend');
  var dlEl = document.getElementById('chatDownload');
  if (!authBox || !chatBox || !msgsEl || !inputEl || !sendBtn) { /* 页面结构不完整则不启动 */ }
  else {
    window.__rukikChatReady = true;
    var sb = createClient(SUPABASE_URL, ANON_KEY);
    var session = null;
    var history = [];
    var rounds = 0;
    var busy = false;

    function renderAuth() {
      var logged = !!session;
      authBox.hidden = logged;
      chatBox.hidden = !logged;
      if (logged) {
        authBarText.textContent = '已登录：' + ((session.user && session.user.email) || '');
        if (authMsg) authMsg.textContent = '';
      }
    }

    sb.auth.getSession().then(function (res) {
      session = (res && res.data && res.data.session) || null;
      if (authMsg && !session) authMsg.textContent = '';
      renderAuth();
    }).catch(function () { renderAuth(); });
    sb.auth.onAuthStateChange(function (_event, s) {
      session = s;
      renderAuth();
    });

    sendCodeBtn.addEventListener('click', async function () {
      var email = (emailEl.value || '').trim();
      if (!email) { authMsg.textContent = '请先填写邮箱地址。'; return; }
      sendCodeBtn.disabled = true;
      authMsg.textContent = '正在发送验证码…';
      try {
        var r = await sb.auth.signInWithOtp({ email: email });
        if (r.error) { authMsg.textContent = '发送失败，请检查邮箱地址后重试。'; }
        else {
          codeRow.hidden = false;
          authMsg.textContent = '验证码已发送到你的邮箱，请查收（也可能在垃圾邮件里），然后填入验证码登录。';
          codeEl.focus();
        }
      } catch (e) {
        authMsg.textContent = '发送失败，请检查网络后重试。';
      } finally {
        sendCodeBtn.disabled = false;
      }
    });

    verifyBtn.addEventListener('click', async function () {
      var email = (emailEl.value || '').trim();
      var token = (codeEl.value || '').trim();
      if (!email) { authMsg.textContent = '请先填写邮箱地址。'; return; }
      if (!token) { authMsg.textContent = '请填写邮箱里收到的验证码。'; return; }
      verifyBtn.disabled = true;
      authMsg.textContent = '正在验证…';
      try {
        var r = await sb.auth.verifyOtp({ email: email, token: token, type: 'email' });
        if (r.error) {
          authMsg.textContent = '验证失败：验证码不正确或已过期，请重新发送。';
        } else {
          session = (r.data && r.data.session) || null;
          var name = (nameEl.value || '').trim();
          if (name) {
            try { await sb.auth.updateUser({ data: { name: name } }); } catch (e) { /* 称呼保存失败不阻塞登录 */ }
          }
          renderAuth();
          if (inputEl) inputEl.focus();
        }
      } catch (e) {
        authMsg.textContent = '验证失败，请检查网络后重试。';
      } finally {
        verifyBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener('click', async function () {
      try { await sb.auth.signOut(); } catch (e) { /* 忽略 */ }
      session = null;
      history = [];
      rounds = 0;
      msgsEl.innerHTML = '';
      renderAuth();
    });

    function addMsg(role, text) {
      var div = document.createElement('div');
      div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
      div.textContent = text;
      msgsEl.appendChild(div);
      msgsEl.scrollTop = msgsEl.scrollHeight;
      return div;
    }

    function lockWithGuide() {
      inputEl.disabled = true;
      sendBtn.disabled = true;
      inputEl.placeholder = '网页咨询已达 3 轮上限';
      if (dlEl) dlEl.hidden = false;
    }

    function friendlyError(code) {
      if (code === 'not_configured') return '助理正在开通中，暂时还不能回答。请稍后再来，或点下方按钮在 Rukik App 里联系我本人。';
      if (code === 'round_limit') { lockWithGuide(); return '网页端的 3 轮免费咨询已用完，下载 Rukik App 可以继续咨询。'; }
      if (code === 'login_required') return '登录已过期，请重新登录后再咨询。';
      return '暂时无法回答，请检查网络后重试。';
    }

    async function send() {
      if (busy) return;
      if (!session) { renderAuth(); return; }
      if (rounds >= MAX_ROUNDS) { lockWithGuide(); return; }
      var text = inputEl.value.trim();
      if (!text) return;
      busy = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      addMsg('user', text);
      history.push({ role: 'user', content: text });
      var thinking = addMsg('ai', '正在思考…');
      var reply = '';
      try {
        var tokenRes = await sb.auth.getSession();
        var accessToken = (tokenRes && tokenRes.data && tokenRes.data.session && tokenRes.data.session.access_token) || (session && session.access_token) || '';
        var res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': ANON_KEY,
            'Authorization': 'Bearer ' + accessToken
          },
          body: JSON.stringify({ professional_id: PROFESSIONAL_ID, mode: 'web', stream: true, messages: history })
        });
        if (!res.ok) {
          var errData = {};
          try { errData = await res.json(); } catch (e) { /* 非 JSON 响应按通用错误处理 */ }
          history.pop();
          if ((errData.error || '') === 'login_required') {
            try { await sb.auth.signOut(); } catch (e) { /* 忽略 */ }
            session = null;
            renderAuth();
          }
          thinking.textContent = friendlyError(errData.error || '');
        } else if (res.body && typeof res.body.getReader === 'function' && (res.headers.get('Content-Type') || '').indexOf('event-stream') >= 0) {
          // 流式接收：逐段追加显示，不再等整段生成完
          var reader = res.body.getReader();
          var decoder = new TextDecoder('utf-8');
          var buffer = '';
          for (;;) {
            var chunk = await reader.read();
            if (chunk.done) break;
            buffer += decoder.decode(chunk.value, { stream: true });
            var lines = buffer.split('\n');
            buffer = lines.pop();
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i].trim();
              if (line.indexOf('data:') !== 0) continue;
              var payload = line.slice(5).trim();
              if (payload === '[DONE]') continue;
              try {
                var delta = JSON.parse(payload).choices[0].delta.content || '';
                if (delta) {
                  reply += delta;
                  thinking.textContent = reply;
                  msgsEl.scrollTop = msgsEl.scrollHeight;
                }
              } catch (e) { /* 非数据行忽略 */ }
            }
          }
          if (!reply) {
            history.pop();
            thinking.textContent = friendlyError('');
          } else {
            history.push({ role: 'assistant', content: reply });
            rounds += 1;
            if (rounds >= MAX_ROUNDS) lockWithGuide();
          }
        } else {
          var data = {};
          try { data = await res.json(); } catch (e) { /* 非 JSON 响应按通用错误处理 */ }
          if (!data.reply) {
            history.pop();
            thinking.textContent = friendlyError(data.error || '');
          } else {
            thinking.textContent = data.reply;
            history.push({ role: 'assistant', content: data.reply });
            rounds += 1;
            if (rounds >= MAX_ROUNDS) lockWithGuide();
          }
        }
      } catch (e) {
        if (reply) {
          // 已流出部分内容后断线：保留已显示的部分作为本轮回答
          history.push({ role: 'assistant', content: reply });
          rounds += 1;
          if (rounds >= MAX_ROUNDS) lockWithGuide();
        } else {
          history.pop();
          thinking.textContent = friendlyError('');
        }
      } finally {
        busy = false;
        if (rounds < MAX_ROUNDS && session) { sendBtn.disabled = false; inputEl.focus(); }
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  }
</script>
