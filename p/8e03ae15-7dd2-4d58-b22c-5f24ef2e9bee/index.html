<style>
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#F7F3EC; color:#202020; }
  .wrap { max-width:640px; margin:0 auto; padding:56px 24px; text-align:center; }

  .btn { display:inline-block; margin-top:24px; background:#B58A58; color:#fff; text-decoration:none; padding:13px 30px; border-radius:999px; font-size:16px; }

  .chat { background:#fff; border-radius:16px; padding:20px; margin-top:28px; text-align:left; box-shadow:0 2px 12px rgba(20,34,53,.06); }
  .chat-title { font-size:16px; font-weight:600; color:#142235; margin-bottom:12px; text-align:center; }
  .msgs { display:flex; flex-direction:column; gap:10px; max-height:420px; overflow-y:auto; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:#142235; color:#F7F3EC; border-bottom-right-radius:4px; }
  .msg.ai { align-self:flex-start; background:#F7F3EC; color:#202020; border-bottom-left-radius:4px; }
  .chat-row { display:flex; gap:8px; margin-top:14px; }
  .chat-row input { flex:1; border:1px solid #e3ddd2; border-radius:999px; padding:11px 16px; font-size:15px; outline:none; background:#fff; color:#202020; }
  .chat-row input:disabled { background:#f1ede4; color:#8B857D; }
  .chat-row button { background:#B58A58; color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:15px; cursor:pointer; }
  .chat-row button:disabled { opacity:.55; cursor:default; }
  .chat-note { margin-top:10px; font-size:12px; color:#8B857D; text-align:center; }
  .dl { margin-top:16px; background:#F7F3EC; border-radius:12px; padding:16px; text-align:center; font-size:14px; line-height:1.8; color:#44403a; }

<body>
<div class="wrap">
  <img class="avatar" src="/assets/avatar.jpg" alt="mengqi Huang">
  <h1>mengqi Huang</h1>
  <div class="role">律师 · 美国</div>
  <div class="line">有法律问题，先问问我的24小时专业助理！</div>
  <div class="card">
    这是我本人训练的专业 AI 助理，装着我的经验、判断和说话方式。它 24 小时在线：你先把问题问它，能答的它当场答，需要我本人的，它会转给我跟进。
  </div>
  <div class="chat">
    <div class="chat-title">直接向我的 AI 助理提问</div>
    <div class="msgs" id="chatMsgs"></div>
    <div class="chat-row">
      <input id="chatInput" type="text" placeholder="输入你的问题……" maxlength="2000" autocomplete="off">
      <button id="chatSend" type="button">发送</button>
    </div>
    <div class="chat-note">网页端可免费咨询 3 轮 · AI 回答仅供参考，不构成正式专业意见</div>
    <div class="dl" id="chatDownload" hidden>
      网页端的 3 轮免费咨询已用完。下载 Rukik App，可以继续不限轮次地咨询，需要时还能把问题转给我本人跟进。<br>
      <a class="btn" href="https://apps.apple.com/app/id6824554988">下载 Rukik App 继续咨询</a>
    </div>
  </div>
  <a class="btn" href="https://apps.apple.com/app/id6824554988">在 Rukik 里向我提问</a>
  <div class="co"><img src="/assets/seal.png" alt=""> mengqi Huang × Rukik 家办</div>
  <div class="foot">家业长青 · 传承有道</div>
</div>
<script>
(function () {
  var API_URL = 'https://yzgzgtrqrmarfjftgbwt.supabase.co/functions/v1/pro-chat';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6Z3pndHJxcm1hcmZqZnRnYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTkzNjksImV4cCI6MjEwNzg3NTM2OX0.SORkmMkYrorMPHdDBwgyG8bRIJRi7hhhLHKe5mvQCnc';
  var PROFESSIONAL_ID = '8e03ae15-7dd2-4d58-b22c-5f24ef2e9bee';
  var MAX_ROUNDS = 3;

  var msgsEl = document.getElementById('chatMsgs');
  var inputEl = document.getElementById('chatInput');
  var sendBtn = document.getElementById('chatSend');
  var dlEl = document.getElementById('chatDownload');
  if (!msgsEl || !inputEl || !sendBtn) return;

  var history = [];
  var rounds = 0;
  var busy = false;

  function addMsg(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    div.textContent = text;
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return div;
  }

  function lockWithGuide() {
    inputEl.disabled = true;
    sendBtn.disabled = true;
    inputEl.placeholder = '网页咨询已达 3 轮上限';
    if (dlEl) dlEl.hidden = false;
  }

  function friendlyError(code) {
    if (code === 'not_configured') return '助理正在开通中，暂时还不能回答。请稍后再来，或点下方按钮在 Rukik App 里联系我本人。';
    if (code === 'round_limit') { lockWithGuide(); return '网页端的 3 轮免费咨询已用完，下载 Rukik App 可以继续咨询。'; }
    return '暂时无法回答，请检查网络后重试。';
  }

  async function send() {
    if (busy) return;
    if (rounds >= MAX_ROUNDS) { lockWithGuide(); return; }
    var text = inputEl.value.trim();
    if (!text) return;
    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    var thinking = addMsg('ai', '正在思考…');
    var reply = '';
    try {
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + ANON_KEY
        },
        body: JSON.stringify({ professional_id: PROFESSIONAL_ID, mode: 'web', stream: true, messages: history })
      });
      if (!res.ok) {
        var errData = {};
        try { errData = await res.json(); } catch (e) { /* 非 JSON 响应按通用错误处理 */ }
        history.pop();
        thinking.textContent = friendlyError(errData.error || '');
      } else if (res.body && typeof res.body.getReader === 'function' && (res.headers.get('Content-Type') || '').indexOf('event-stream') >= 0) {
        // 流式接收：逐段追加显示，不再等整段生成完
        var reader = res.body.getReader();
        var decoder = new TextDecoder('utf-8');
        var buffer = '';
        for (;;) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          var lines = buffer.split('\n');
          buffer = lines.pop();
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.indexOf('data:') !== 0) continue;
            var payload = line.slice(5).trim();
            if (payload === '[DONE]') continue;
            try {
              var delta = JSON.parse(payload).choices[0].delta.content || '';
              if (delta) {
                reply += delta;
                thinking.textContent = reply;
                msgsEl.scrollTop = msgsEl.scrollHeight;
              }
            } catch (e) { /* 非数据行忽略 */ }
          }
        }
        if (!reply) {
          history.pop();
          thinking.textContent = friendlyError('');
        } else {
          history.push({ role: 'assistant', content: reply });
          rounds += 1;
          if (rounds >= MAX_ROUNDS) lockWithGuide();
        }
      } else {
        var data = {};
        try { data = await res.json(); } catch (e) { /* 非 JSON 响应按通用错误处理 */ }
        if (!data.reply) {
          history.pop();
          thinking.textContent = friendlyError(data.error || '');
        } else {
          thinking.textContent = data.reply;
          history.push({ role: 'assistant', content: data.reply });
          rounds += 1;
          if (rounds >= MAX_ROUNDS) lockWithGuide();
        }
      }
    } catch (e) {
      if (reply) {
        // 已流出部分内容后断线：保留已显示的部分作为本轮回答
        history.push({ role: 'assistant', content: reply });
        rounds += 1;
        if (rounds >= MAX_ROUNDS) lockWithGuide();
      } else {
        history.pop();
        thinking.textContent = friendlyError('');
      }
    } finally {
      busy = false;
      if (rounds < MAX_ROUNDS) { sendBtn.disabled = false; inputEl.focus(); }
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
})();
</script>
</body>
</html>
