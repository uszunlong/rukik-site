<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUKIK Golf 主办方工作台</title>
<style>
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f8f2; color:#17301c; }
  header { background:#0b1f14; color:#fff; padding:18px 22px; }
  header .brand { color:#9fd08a; letter-spacing:2px; font-size:12px; }
  header h1 { margin:4px 0 0; font-size:21px; }
  main { max-width:820px; margin:0 auto; padding:18px 18px 50px; }
  .card { background:#fff; border-radius:14px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 4px rgba(20,50,25,.06); }
  .counts { display:flex; gap:12px; flex-wrap:wrap; }
  .count { flex:1; min-width:110px; background:#eef6ea; border-radius:12px; padding:12px; text-align:center; }
  .count b { display:block; font-size:26px; }
  .count span { color:#5c7260; font-size:13px; }
  button { background:#1d7a3a; color:#fff; border:0; border-radius:10px; padding:11px 18px; font-size:15px; cursor:pointer; }
  button.ghost { background:#eef6ea; color:#1d7a3a; }
  button.warn { background:#a16207; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px; border:1px solid #cfdcc9; border-radius:9px; margin:5px 0 11px; font-size:15px; }
  label { font-size:13px; color:#5c7260; }
  .row { display:flex; gap:10px; flex-wrap:wrap; } .row > div { flex:1; min-width:150px; }
  .evt { padding:10px 0; border-bottom:1px solid #e5eee1; cursor:pointer; }
  .evt b { font-size:16px; } .evt span { color:#5c7260; font-size:13px; margin-left:8px; }
  .todo { background:#fff8e1; border:1px solid #f0dfa0; border-radius:10px; padding:10px 12px; margin:8px 0; font-size:14px; }
  details { margin-top:10px; } summary { cursor:pointer; color:#1d7a3a; font-size:15px; padding:6px 0; }
  .err { color:#b91c1c; font-size:14px; } .ok { color:#1d7a3a; font-size:14px; }
  pre { background:#0b1f14; color:#cfe6c8; padding:12px; border-radius:10px; overflow:auto; font-size:12px; max-height:300px; }
  a { color:#1d7a3a; }
</style>
</head>
<body>
<header>
  <div class="brand">RUKIK GOLF · 专业赛事管家</div>
  <h1>主办方工作台</h1>
</header>
<main>
  <div class="card" id="loginCard">
    <h3 style="margin-top:0">登录（RUKIK 账号）</h3>
    <label>邮箱</label><input id="email" type="email" autocomplete="username">
    <label>密码</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">登录</button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <h3 style="margin-top:0">我的赛事</h3>
      <div id="eventList"></div>
      <details>
        <summary>＋ 快速创建赛事（5 项必填）</summary>
        <label>赛事名称 *</label><input id="fTitle">
        <div class="row">
          <div><label>球场 *</label><select id="fCourse"></select></div>
          <div><label>日期 *</label><input id="fDate" type="date"></div>
        </div>
        <div class="row">
          <div><label>赛制 *</label><select id="fFormat">
            <option value="stroke">个人比杆赛</option><option value="net_stroke">净杆赛</option>
            <option value="stableford">Stableford 积分赛</option><option value="scramble">Scramble 团队赛</option>
            <option value="best_ball">Best Ball</option><option value="match_play">比洞赛</option>
            <option value="team_points">企业团队积分赛</option>
          </select></div>
          <div><label>人数上限 *</label><input id="fCap" type="number" value="40"></div>
        </div>
        <button id="createBtn">创建草稿</button>
        <p class="ok" id="createMsg"></p>
      </details>
    </div>

    <div class="card" id="dash" style="display:none">
      <h3 style="margin-top:0" id="dashTitle">赛事进度</h3>
      <div class="counts">
        <div class="count"><b id="cReg">–</b><span>已报名</span></div>
        <div class="count"><b id="cIn">–</b><span>已签到</span></div>
        <div class="count"><b id="cPend">–</b><span>待处理</span></div>
      </div>
      <div id="todos"></div>
      <p style="margin-top:14px">
        <button id="primaryBtn">下一步</button>
        <button class="ghost" id="boardBtn">大屏排行榜</button>
        <button class="ghost" id="shareBtn">公开赛事页</button>
      </p>
      <p class="ok" id="dashMsg"></p>
      <details>
        <summary>高级管理（分组 / 记分卡 / 奖项 / 报表 / 赞助 / 公告）</summary>
        <div class="row">
          <div><label>分组方式</label><select id="pMethod"><option value="handicap_balance">差点平衡</option><option value="random">随机</option><option value="team">按团队</option><option value="org">按组织</option></select></div>
          <div><label>每组人数</label><input id="pSize" type="number" value="4"></div>
        </div>
        <p>
          <button class="ghost" id="pairBtn">生成分组</button>
          <button class="ghost" id="snapBtn">生成差点快照</button>
          <button class="ghost" id="cardsBtn">生成记分卡</button>
          <button class="ghost" id="pubBtn">发布排行榜</button>
          <button class="ghost" id="awardBtn">计算奖项</button>
          <button class="ghost" id="reportBtn">运营报表</button>
        </p>
        <label>发布公告</label><input id="annTitle" placeholder="公告标题"><textarea id="annBody" rows="2" placeholder="公告内容"></textarea>
        <button class="ghost" id="annBtn">发布公告</button>
        <label>添加赞助商</label><input id="spName" placeholder="赞助商名称"><input id="spLogo" placeholder="Logo 图片地址（可选）">
        <button class="ghost" id="spBtn">添加赞助商</button>
        <pre id="out" style="display:none"></pre>
      </details>
    </div>
  </div>
  <p style="color:#5c7260;font-size:13px">成绩由确定性规则引擎计算并经确认流程锁定；本工作台只做组织与发布，不直接改分。</p>
</main>
<script>
var SB = 'https://yzgzgtrqrmarfjftgbwt.supabase.co';
var API = SB + '/functions/v1/golf-api';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6Z3pndHJxcm1hcmZqZnRnYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTkzNjksImV4cCI6MjEwNzg3NTM2OX0.SORkmMkYrorMPHdDBwgyG8bRIJRi7hhhLHKe5mvQCnc';
var token = sessionStorage.getItem('golf_token') || '';
var currentEvent = null, currentRound = null;
function headers() { return { 'Content-Type': 'application/json', 'apikey': ANON, 'Authorization': 'Bearer ' + (token || ANON) }; }
function call(action, body) {
  return fetch(API, { method: 'POST', headers: headers(), body: JSON.stringify(Object.assign({ action: action }, body || {})) }).then(function (r) { return r.json(); });
}
function show(obj) { var o = document.getElementById('out'); o.style.display = 'block'; o.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 1); }
document.getElementById('loginBtn').onclick = function () {
  var email = document.getElementById('email').value, pw = document.getElementById('password').value;
  fetch(SB + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': ANON }, body: JSON.stringify({ email: email, password: pw }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (!d.access_token) { document.getElementById('loginErr').textContent = '登录失败，请检查邮箱与密码'; return; }
      token = d.access_token; sessionStorage.setItem('golf_token', token); init();
    });
};
function init() {
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  call('course_list', {}).then(function (d) {
    document.getElementById('fCourse').innerHTML = (d.courses || []).map(function (c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
  });
  loadEvents();
}
function loadEvents() {
  call('event_list', { scope: 'mine' }).then(function (d) {
    var list = (d.organized || []).concat(d.joined || []);
    document.getElementById('eventList').innerHTML = list.length ? list.map(function (e) {
      return '<div class="evt" data-id="' + e.id + '"><b>' + e.title + '</b><span>' + e.status + ' · ' + (e.starts_at ? String(e.starts_at).slice(0, 10) : '') + '</span></div>';
    }).join('') : '<p style="color:#5c7260">暂无赛事，先创建一个。</p>';
    Array.prototype.forEach.call(document.querySelectorAll('.evt'), function (el) {
      el.onclick = function () { openEvent(el.getAttribute('data-id')); };
    });
  });
}
function openEvent(id) {
  call('event_get', { event_id: id }).then(function (d) {
    currentEvent = d.event; currentRound = (d.rounds || [])[0];
    document.getElementById('dash').style.display = 'block';
    document.getElementById('dashTitle').textContent = d.event.title + ' · 赛事进度';
    refreshDash();
  });
}
function refreshDash() {
  if (!currentEvent) return;
  call('registrations_list', { event_id: currentEvent.id }).then(function (d) {
    var regs = d.registrations || [];
    var reg = regs.filter(function (r) { return r.status === 'registered'; }).length;
    var ci = regs.filter(function (r) { return r.status === 'checked_in'; }).length;
    document.getElementById('cReg').textContent = reg + ci;
    document.getElementById('cIn').textContent = ci;
    return call('event_report', { event_id: currentEvent.id }).then(function (r) {
      var pend = 0, todos = [];
      if (r.report) {
        var sc = r.report.scoring.by_status || {};
        pend = (sc.submitted || 0) + (sc.verified || 0);
        if ((sc.submitted || 0) > 0) todos.push('有 ' + sc.submitted + ' 张记分卡已提交、等待球员核对');
        if ((sc.verified || 0) > 0) todos.push('有 ' + sc.verified + ' 张记分卡已核对、等待管理员锁定为正式成绩');
        if (currentEvent.status === 'draft') todos.push('赛事还是草稿，确认信息后点「发布赛事」开放报名');
      }
      document.getElementById('cPend').textContent = pend;
      document.getElementById('todos').innerHTML = todos.map(function (t) { return '<div class="todo">RUKIK 替您想到：' + t + '</div>'; }).join('');
      var pb = document.getElementById('primaryBtn');
      if (currentEvent.status === 'draft') { pb.textContent = '发布赛事'; pb.onclick = function () { updateStatus('published'); }; }
      else if (currentEvent.status === 'published') { pb.textContent = '开始比赛'; pb.onclick = function () { updateStatus('in_progress'); }; }
      else { pb.textContent = '刷新进度'; pb.onclick = refreshDash; }
    });
  });
}
function updateStatus(s) {
  call('event_update', { event_id: currentEvent.id, status: s }).then(function (d) {
    if (d.event) { currentEvent = d.event; document.getElementById('dashMsg').textContent = '状态已更新为 ' + s; refreshDash(); }
    else show(d);
  });
}
document.getElementById('createBtn').onclick = function () {
  call('event_create', {
    title: document.getElementById('fTitle').value, course_id: document.getElementById('fCourse').value,
    starts_at: document.getElementById('fDate').value + 'T09:00:00', play_dates: [document.getElementById('fDate').value],
    format: document.getElementById('fFormat').value, capacity: Number(document.getElementById('fCap').value || 40)
  }).then(function (d) {
    if (d.event) { document.getElementById('createMsg').textContent = '已创建草稿：' + d.event.title; loadEvents(); }
    else show(d);
  });
};
document.getElementById('boardBtn').onclick = function () { if (currentEvent) window.open('/golf/board/?e=' + currentEvent.id, '_blank'); };
document.getElementById('shareBtn').onclick = function () { if (currentEvent) window.open('/golf/event/?e=' + currentEvent.id, '_blank'); };
document.getElementById('pairBtn').onclick = function () { call('pairings_generate', { event_id: currentEvent.id, round_id: currentRound.id, method: document.getElementById('pMethod').value, group_size: Number(document.getElementById('pSize').value || 4) }).then(show); };
document.getElementById('snapBtn').onclick = function () { call('handicap_snapshot_all', { event_id: currentEvent.id, round_id: currentRound.id }).then(show); };
document.getElementById('cardsBtn').onclick = function () { call('scorecard_ensure', { event_id: currentEvent.id, round_id: currentRound.id }).then(show); };
document.getElementById('pubBtn').onclick = function () { call('leaderboard_publish', { event_id: currentEvent.id }).then(show); };
document.getElementById('awardBtn').onclick = function () { call('awards_compute', { event_id: currentEvent.id }).then(show); };
document.getElementById('reportBtn').onclick = function () { call('event_report', { event_id: currentEvent.id }).then(show); };
document.getElementById('annBtn').onclick = function () { call('announcement_create', { event_id: currentEvent.id, title: document.getElementById('annTitle').value, body: document.getElementById('annBody').value }).then(show); };
document.getElementById('spBtn').onclick = function () { call('sponsor_create', { event_id: currentEvent.id, name: document.getElementById('spName').value, logo_url: document.getElementById('spLogo').value || null, placements: ['event_page', 'big_screen'] }).then(show); };
if (token) init();
</script>
</body>
</html>
