<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUKIK Golf 主办方工作台</title>
<style>
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f8f2; color:#17301c; }
  header { background:#0b1f14; color:#fff; padding:18px 22px; }
  header .brand { color:#9fd08a; letter-spacing:2px; font-size:12px; }
  header h1 { margin:4px 0 0; font-size:21px; }
  main { max-width:820px; margin:0 auto; padding:18px 18px 50px; }
  .card { background:#fff; border-radius:14px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 4px rgba(20,50,25,.06); }
  .counts { display:flex; gap:12px; flex-wrap:wrap; }
  .count { flex:1; min-width:110px; background:#eef6ea; border-radius:12px; padding:12px; text-align:center; }
  .count b { display:block; font-size:26px; }
  .count span { color:#5c7260; font-size:13px; }
  button { background:#1d7a3a; color:#fff; border:0; border-radius:10px; padding:11px 18px; font-size:15px; cursor:pointer; }
  button.ghost { background:#eef6ea; color:#1d7a3a; }
  button.warn { background:#a16207; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px; border:1px solid #cfdcc9; border-radius:9px; margin:5px 0 11px; font-size:15px; }
  label { font-size:13px; color:#5c7260; }
  .row { display:flex; gap:10px; flex-wrap:wrap; } .row > div { flex:1; min-width:150px; }
  .evt { padding:10px 0; border-bottom:1px solid #e5eee1; cursor:pointer; }
  .evt b { font-size:16px; } .evt span { color:#5c7260; font-size:13px; margin-left:8px; }
  .todo { background:#fff8e1; border:1px solid #f0dfa0; border-radius:10px; padding:10px 12px; margin:8px 0; font-size:14px; }
  details { margin-top:10px; } summary { cursor:pointer; color:#1d7a3a; font-size:15px; padding:6px 0; }
  .err { color:#b91c1c; font-size:14px; } .ok { color:#1d7a3a; font-size:14px; }
  pre { background:#0b1f14; color:#cfe6c8; padding:12px; border-radius:10px; overflow:auto; font-size:12px; max-height:300px; }
  a { color:#1d7a3a; }
</style>
</head>
<body>
<header>
  <div class="brand">RUKIK GOLF · 专业赛事管家</div>
  <h1>主办方工作台</h1>
</header>
<main>
  <div class="card" id="loginCard">
    <h3 style="margin-top:0">登录（RUKIK 账号）</h3>
    <label>邮箱</label><input id="email" type="email" autocomplete="username">
    <label>密码</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">登录</button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <h3 style="margin-top:0">我的赛事</h3>
      <div id="eventList"></div>
      <details>
        <summary>＋ 快速创建赛事（5 项必填）</summary>
        <label>赛事名称 *</label><input id="fTitle">
        <div class="row">
          <div><label>球场 *（可搜全美 1.4 万家球场库）</label>
            <input id="fCourseQ" placeholder="输入球场名搜索，如 Friendly Hills" autocomplete="off">
            <div id="fCourseResults" style="display:none;border:1px solid #d8e2d8;border-radius:8px;max-height:220px;overflow:auto;background:#fff"></div>
            <select id="fCourse" style="margin-top:6px"></select>
            <div id="fCourseInfo" style="font-size:12px;color:#5c7260;margin-top:4px"></div>
          </div>
          <div><label>日期 *</label><input id="fDate" type="date">
            <label style="margin-top:8px">默认发球台</label><select id="fTee"></select>
          </div>
        </div>
        <div class="row">
          <div><label>赛制 *</label><select id="fFormat">
            <option value="stroke">个人比杆赛</option><option value="net_stroke">净杆赛</option>
            <option value="stableford">Stableford 积分赛</option><option value="scramble">Scramble 团队赛</option>
            <option value="best_ball">Best Ball</option><option value="match_play">比洞赛</option>
            <option value="team_points">企业团队积分赛</option>
          </select></div>
          <div><label>人数上限 *</label><input id="fCap" type="number" value="40"></div>
        </div>
        <button id="createBtn">创建草稿</button>
        <p class="ok" id="createMsg"></p>
      </details>
    </div>

    <div class="card" id="dash" style="display:none">
      <h3 style="margin-top:0" id="dashTitle">赛事进度</h3>
      <div class="counts">
        <div class="count"><b id="cReg">–</b><span>已报名</span></div>
        <div class="count"><b id="cIn">–</b><span>已签到</span></div>
        <div class="count"><b id="cReview">–</b><span>待审核报名</span></div>
        <div class="count"><b id="cPend">–</b><span>记分卡待确认</span></div>
      </div>
      <div id="todos"></div>
      <div id="regSection" style="margin-top:16px">
        <h4 style="margin:6px 0">报名名单</h4>
        <div id="regList"></div>
        <p class="ok" id="regMsg"></p>
      </div>
      <div id="scoreSection" style="margin-top:16px">
        <h4 style="margin:6px 0">参赛成绩</h4>
        <div id="scoreList"></div>
        <p class="ok" id="scoreMsg"></p>
        <p style="color:#5c7260;font-size:13px">成绩更正不在本台直接改杆数：请在记分端按原流程更正（覆盖已有成绩必须填写原因），每次更正都会自动留下审计记录；锁定成绩须先由主办方解锁并注明原因。</p>
      </div>
      <p style="margin-top:14px">
        <button id="primaryBtn">下一步</button>
        <button class="ghost" id="boardBtn">大屏排行榜</button>
        <button class="ghost" id="shareBtn">公开赛事页</button>
      </p>
      <p class="ok" id="dashMsg"></p>
      <details>
        <summary>高级管理（分组 / 记分卡 / 奖项 / 报表 / 赞助 / 公告）</summary>
        <div class="row">
          <div><label>分组方式</label><select id="pMethod"><option value="handicap_balance">差点平衡</option><option value="random">随机</option><option value="team">按团队</option><option value="org">按组织</option></select></div>
          <div><label>每组人数</label><input id="pSize" type="number" value="4"></div>
        </div>
        <p>
          <button class="ghost" id="pairBtn">生成分组</button>
          <button class="ghost" id="snapBtn">生成差点快照</button>
          <button class="ghost" id="cardsBtn">生成记分卡</button>
          <button class="ghost" id="pubBtn">发布排行榜</button>
          <button class="ghost" id="awardBtn">计算奖项</button>
          <button class="ghost" id="reportBtn">运营报表</button>
        </p>
        <label>发布公告</label><input id="annTitle" placeholder="公告标题"><textarea id="annBody" rows="2" placeholder="公告内容"></textarea>
        <button class="ghost" id="annBtn">发布公告</button>
        <label>添加赞助商</label><input id="spName" placeholder="赞助商名称"><input id="spLogo" placeholder="Logo 图片地址（可选）">
        <button class="ghost" id="spBtn">添加赞助商</button>
        <div id="orgCard" style="margin-top:14px">
        <label>机构（主办必填；协办/赞助有才展示，同步活动页统一维护）</label>
        <div id="orgRows"></div>
        <button class="ghost" id="orgAdd" type="button">＋ 添加机构</button>
        <button class="ghost" id="orgSave" type="button">保存机构</button>
        <span id="orgMsg" style="font-size:13px;color:#5c7260"></span>
      </div>
      <div id="knowCard" style="margin-top:14px">
        <label>补充赛事知识（海报、组织方、日程、分组、成绩已自动同步给 AI 球童；这里只补原本没有的信息。AI 球童只引用「已发布」条目，草稿不对外）</label>
        <div id="knowList"></div>
        <div class="row">
          <div><label>类别</label><select id="kKind"><option value="banquet">晚宴安排</option><option value="rules">比赛规则</option><option value="awards">奖项说明</option><option value="sponsor">赞助商介绍</option><option value="notice">特殊通知</option><option value="other">其他</option></select></div>
          <div><label>标题 *</label><input id="kTitle" placeholder="如：颁奖晚宴安排"></div>
        </div>
        <label>内容 *</label><textarea id="kBody" rows="4" placeholder="直接输入或粘贴赛事说明；也可上传 PDF 自动提取文字后在此核对修改"></textarea>
        <label>上传文件补充（PDF 自动提取文字；图片 / Word 暂不支持自动解析，会记录文件名，请把要点填入上方内容）</label>
        <input type="file" id="kFile" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg">
        <label style="display:block;font-size:14px;color:#17301c"><input type="checkbox" id="kKey" style="width:auto;margin-right:6px">关键信息（涉及时间 / 地点 / 规则变更——发布后将通过赛事关怀提醒已报名球员）</label>
        <p>
          <button class="ghost" id="kSave" type="button">保存草稿</button>
          <button class="ghost" id="kReset" type="button">清空表单</button>
          <span id="kMsg" style="font-size:13px;color:#5c7260"></span>
        </p>
      </div>
      <pre id="out" style="display:none"></pre>
      </details>
    </div>
  </div>
  <p style="color:#5c7260;font-size:13px">成绩由确定性规则引擎计算并经确认流程锁定；本工作台只做组织与发布，不直接改分。</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
var SB = 'https://yzgzgtrqrmarfjftgbwt.supabase.co';
var API = SB + '/functions/v1/golf-api';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6Z3pndHJxcm1hcmZqZnRnYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTkzNjksImV4cCI6MjEwNzg3NTM2OX0.SORkmMkYrorMPHdDBwgyG8bRIJRi7hhhLHKe5mvQCnc';
var token = sessionStorage.getItem('golf_token') || '';
var currentEvent = null, currentRound = null;
function headers() { return { 'Content-Type': 'application/json', 'apikey': ANON, 'Authorization': 'Bearer ' + (token || ANON) }; }
function call(action, body) {
  return fetch(API, { method: 'POST', headers: headers(), body: JSON.stringify(Object.assign({ action: action }, body || {})) }).then(function (r) { return r.json(); });
}
function show(obj) { var o = document.getElementById('out'); o.style.display = 'block'; o.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 1); }
document.getElementById('loginBtn').onclick = function () {
  var email = document.getElementById('email').value, pw = document.getElementById('password').value;
  fetch(SB + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': ANON }, body: JSON.stringify({ email: email, password: pw }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (!d.access_token) { document.getElementById('loginErr').textContent = '登录失败，请检查邮箱与密码'; return; }
      token = d.access_token; sessionStorage.setItem('golf_token', token); init();
    });
};
function init() {
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  call('course_list', {}).then(function (d) {
    document.getElementById('fCourse').innerHTML = (d.courses || []).map(function (c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
  });
  loadEvents();
}
function loadEvents() {
  call('event_list', { scope: 'mine' }).then(function (d) {
    /* [去重] organized 与 joined 有重叠：主办方本人报名参赛时同一赛事会同时出现在两组里，
       直接 concat 会渲染两次。按 id 去重，主办身份优先保留在前。 */
    var seen = {};
    var list = (d.organized || []).concat(d.joined || []).filter(function (e) { if (seen[e.id]) return false; seen[e.id] = 1; return true; });
    document.getElementById('eventList').innerHTML = list.length ? list.map(function (e) {
      return '<div class="evt" data-id="' + e.id + '"><b>' + e.title + '</b><span>' + e.status + ' · ' + (e.starts_at ? String(e.starts_at).slice(0, 10) : '') + '</span></div>';
    }).join('') : '<p style="color:#5c7260">暂无赛事，先创建一个。</p>';
    Array.prototype.forEach.call(document.querySelectorAll('.evt'), function (el) {
      el.onclick = function () { openEvent(el.getAttribute('data-id')); };
    });
    /* [线P] ?e= 深链：赛事页/App 的「管理本场」入口直达对应赛事（仅限本人主办的赛事） */
    var want = new URLSearchParams(location.search).get('e');
    if (want && !loadEvents._deepLinked && (d.organized || []).some(function (e) { return e.id === want; })) {
      loadEvents._deepLinked = true;
      openEvent(want);
    }
  });
}
function openEvent(id) {
  call('event_get', { event_id: id }).then(function (d) {
    currentEvent = d.event; currentRound = (d.rounds || [])[0];
    document.getElementById('dash').style.display = 'block';
    document.getElementById('dashTitle').textContent = d.event.title + ' · 赛事进度';
    refreshDash(); loadOrgs(); loadKnowledge();
  });
}
var ORG_TYPES = ['主办', '联合主办', '承办', '协办', '冠名赞助', '赞助商', '合作伙伴'];
function orgRowHtml(o) {
  var opts = ORG_TYPES.map(function (t) { return '<option' + (t === (o.type || '合作伙伴') ? ' selected' : '') + '>' + t + '</option>'; }).join('');
  return '<div class="orgrow" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0">' +
    '<select class="o-type">' + opts + '</select>' +
    '<input class="o-name" placeholder="机构名称" value="' + String(o.name || '').replace(/"/g, '&quot;') + '" style="flex:2;min-width:150px">' +
    '<input class="o-logo" placeholder="Logo 地址（可选）" value="' + String(o.logo_url || '').replace(/"/g, '&quot;') + '" style="flex:2;min-width:150px">' +
    '<input class="o-web" placeholder="官网（可选）" value="' + String(o.website || '').replace(/"/g, '&quot;') + '" style="flex:2;min-width:150px">' +
    '<input class="o-intro" placeholder="简介（可选）" value="' + String(o.intro || '').replace(/"/g, '&quot;') + '" style="flex:3;min-width:180px">' +
    '<button class="ghost o-del" type="button">删除</button></div>';
}
function loadOrgs() {
  if (!currentEvent) return;
  call('orgs_get', { event_id: currentEvent.id }).then(function (d) {
    var box = document.getElementById('orgRows');
    if (!d.linked) { box.innerHTML = '<p style="color:#8c2f2f;font-size:13px">本赛事尚未关联活动页，机构维护不可用。</p>'; return; }
    box.innerHTML = (d.organizations || []).map(orgRowHtml).join('');
    bindOrgDel();
  });
}
function bindOrgDel() {
  Array.prototype.forEach.call(document.querySelectorAll('.o-del'), function (b) { b.onclick = function () { b.closest('.orgrow').remove(); }; });
}
document.getElementById('orgAdd').onclick = function () {
  var box = document.getElementById('orgRows');
  box.insertAdjacentHTML('beforeend', orgRowHtml({}));
  bindOrgDel();
};
document.getElementById('orgSave').onclick = function () {
  var rows = Array.prototype.map.call(document.querySelectorAll('.orgrow'), function (r) {
    return { type: r.querySelector('.o-type').value, name: r.querySelector('.o-name').value.trim(), logo_url: r.querySelector('.o-logo').value.trim() || null, website: r.querySelector('.o-web').value.trim() || null, intro: r.querySelector('.o-intro').value.trim() || null };
  }).filter(function (o) { return o.name; });
  call('orgs_update', { event_id: currentEvent.id, organizations: rows }).then(function (d) {
    document.getElementById('orgMsg').textContent = d.ok ? '已保存，赛事页刷新即可见。' : ('保存失败：' + (d.message || d.error || '未知错误'));
    if (d.ok) loadOrgs();
  });
};
var knowEditingId = null, knowSource = { type: 'text', name: null };
function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function knowKindName(k) { return { rules: '比赛规则', banquet: '晚宴安排', awards: '奖项说明', sponsor: '赞助商介绍', notice: '特殊通知', other: '其他' }[k] || '其他'; }
function kMsg(t) { document.getElementById('kMsg').textContent = t || ''; }
function loadKnowledge() {
  if (!currentEvent) return;
  call('knowledge_list', { event_id: currentEvent.id }).then(function (d) {
    var box = document.getElementById('knowList');
    var rows = d.knowledge || [];
    if (d.error) { box.innerHTML = '<p class="err">知识列表加载失败：' + escapeHtml(d.error) + '</p>'; return; }
    box.innerHTML = rows.length ? rows.map(function (r) {
      var badge = r.status === 'published' ? '<span style="color:#1d7a3a">已发布</span>' : '<span style="color:#a16207">草稿</span>';
      return '<div style="border:1px solid #e5eee1;border-radius:9px;padding:8px 10px;margin:6px 0"><b>' + escapeHtml(r.title) + '</b> ' +
        '<span style="color:#5c7260;font-size:13px">' + knowKindName(r.kind) + (r.is_key_fact ? ' · 关键信息' : '') + ' · ' + badge + (r.source_name ? ' · 来源文件：' + escapeHtml(r.source_name) : '') + '</span><br>' +
        '<span style="font-size:13px;color:#5c7260">' + escapeHtml(String(r.body || '').slice(0, 120)) + '</span><br>' +
        '<button class="ghost k-edit" data-id="' + r.id + '" type="button">编辑</button> ' +
        (r.status === 'published' ? '<button class="ghost k-unpub" data-id="' + r.id + '" type="button">撤下</button> ' : '<button class="ghost k-pub" data-id="' + r.id + '" type="button">发布</button> ') +
        '<button class="ghost k-del" data-id="' + r.id + '" type="button">删除</button></div>';
    }).join('') : '<p style="color:#5c7260;font-size:13px">暂无补充资料。</p>';
    bindKnowButtons(rows);
  });
}
function bindKnowButtons(rows) {
  function find(id) { for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i]; return null; }
  Array.prototype.forEach.call(document.querySelectorAll('.k-edit'), function (b) { b.onclick = function () {
    var r = find(b.getAttribute('data-id')); if (!r) return;
    knowEditingId = r.id; knowSource = { type: r.source_type || 'text', name: r.source_name || null };
    document.getElementById('kKind').value = r.kind; document.getElementById('kTitle').value = r.title;
    document.getElementById('kBody').value = r.body || ''; document.getElementById('kKey').checked = !!r.is_key_fact;
    kMsg('正在编辑：' + r.title + '（保存后仍保持当前发布状态）');
  }; });
  Array.prototype.forEach.call(document.querySelectorAll('.k-pub'), function (b) { b.onclick = function () {
    call('knowledge_publish', { event_id: currentEvent.id, id: b.getAttribute('data-id') }).then(function (d) { kMsg(d.ok ? '已发布，AI 球童现在可以引用这条资料。' : ('发布失败：' + (d.error || '未知错误'))); if (d.ok) loadKnowledge(); });
  }; });
  Array.prototype.forEach.call(document.querySelectorAll('.k-unpub'), function (b) { b.onclick = function () {
    call('knowledge_unpublish', { event_id: currentEvent.id, id: b.getAttribute('data-id') }).then(function (d) { kMsg(d.ok ? '已撤下，回到草稿。' : ('撤下失败：' + (d.error || '未知错误'))); if (d.ok) loadKnowledge(); });
  }; });
  Array.prototype.forEach.call(document.querySelectorAll('.k-del'), function (b) { b.onclick = function () {
    if (!confirm('确定删除这条赛事知识？删除后 AI 球童不再引用。')) return;
    call('knowledge_delete', { event_id: currentEvent.id, id: b.getAttribute('data-id') }).then(function (d) { kMsg(d.ok ? '已删除。' : ('删除失败：' + (d.error || '未知错误'))); if (d.ok) loadKnowledge(); });
  }; });
}
function resetKnowForm() {
  knowEditingId = null; knowSource = { type: 'text', name: null };
  document.getElementById('kTitle').value = ''; document.getElementById('kBody').value = '';
  document.getElementById('kKey').checked = false; document.getElementById('kFile').value = '';
}
/* [线P] 报名名单区：姓名/状态/球队/分组全量渲染（此前 registrations_list 只被用来数计数，
   主办方看不见谁报了名）；pending 行带通过/拒绝；待审核数进计数区与待办提示区 */
var REG_STATUS_TXT = { registered: '已生效', checked_in: '已签到', pending: '待审核', waitlisted: '候补', rejected: '未通过', withdrawn: '已退出', no_show: '未到场', cancelled: '已取消' };
function renderRegList(regs, teams, pairings) {
  var box = document.getElementById('regList');
  if (!box) return;
  var teamName = {};
  (teams || []).forEach(function (t) { teamName[t.id] = t.name; });
  var groupOf = {};
  (pairings || []).forEach(function (p) { (p.golf_pairing_players || []).forEach(function (pp) { groupOf[pp.player_id] = p.group_no; }); });
  if (!regs.length) { box.innerHTML = '<p style="color:#5c7260;font-size:14px">暂无报名。</p>'; return; }
  box.innerHTML = regs.map(function (r) {
    var p = r.golf_players || {};
    var stColor = r.status === 'pending' ? '#a16207' : r.status === 'rejected' ? '#b91c1c' : '#1d7a3a';
    var btns = r.status === 'pending'
      ? ' <button class="ghost rv-ok" data-id="' + r.id + '" type="button">通过</button> <button class="ghost rv-no" data-id="' + r.id + '" type="button">拒绝</button>' : '';
    return '<div style="padding:8px 0;border-bottom:1px solid #e5eee1;font-size:14px"><b>' + escapeHtml(p.display_name || '（未命名）') + '</b>' +
      ' <span style="color:' + stColor + '">' + (REG_STATUS_TXT[r.status] || r.status) + '</span>' +
      '<span style="color:#5c7260"> · 球队：' + escapeHtml(r.team_id ? (teamName[r.team_id] || '—') : '—') +
      ' · 分组：' + (groupOf[r.player_id] ? '第 ' + groupOf[r.player_id] + ' 组' : '未分组') +
      (p.org_name ? ' · ' + escapeHtml(p.org_name) : '') + (p.division ? ' · ' + escapeHtml(p.division) : '') + '</span>' + btns + '</div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.rv-ok'), function (b) { b.onclick = function () { reviewReg(b.getAttribute('data-id'), 'approve'); }; });
  Array.prototype.forEach.call(box.querySelectorAll('.rv-no'), function (b) { b.onclick = function () { reviewReg(b.getAttribute('data-id'), 'reject'); }; });
}
function reviewReg(regId, decision) {
  call('registration_review', { event_id: currentEvent.id, registration_id: regId, decision: decision }).then(function (d) {
    var m = document.getElementById('regMsg');
    if (d.ok) { m.textContent = decision === 'approve' ? '已通过该报名，报名正式生效。' : '已拒绝该报名。'; refreshDash(); }
    else m.textContent = '审核失败：' + (d.error || '未知错误');
  });
}
/* [线Y] 参赛成绩区：主办方只读总览——全员成绩表，点球员展开逐洞（Par 行＋杆数行，未打洞显示 —）。
   数据来自 scorecards_staff_list（requireStaff）；本工作台不直接改分，此处无任何改分控件。 */
var CARD_STATUS_TXT = { not_started: '未开始', in_progress: '进行中', submitted: '已提交', verified: '已核对', locked: '正式成绩', disputed: '有异议' };
function renderScoreSection(d) {
  var box = document.getElementById('scoreList');
  if (!box) return;
  if (!d || !d.ok) { box.innerHTML = '<p style="color:#5c7260;font-size:14px">成绩加载失败，请刷新重试。</p>'; return; }
  var cards = d.cards || [];
  if (!cards.length) { box.innerHTML = '<p style="color:#5c7260;font-size:14px">暂无记分卡（尚未生成记分卡或无人开赛）。</p>'; return; }
  var disputed = cards.filter(function (c) { return c.status === 'disputed'; }).length;
  var notice = disputed ? '<div style="background:#fdf2f2;border:1px solid #f0caca;color:#b91c1c;border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:6px">有 ' + disputed + ' 张记分卡被标记异议，请逐张展开核对成绩后处理。</div>' : '';
  box.innerHTML = notice + cards.map(function (c, i) {
    var name = c.subject_type === 'team' ? (c.team_name || '团队卡') + '（团队卡）' : (c.player_name || '（未命名）');
    var par = c.to_par == null ? '—' : (c.to_par > 0 ? '+' + c.to_par : '' + c.to_par);
    var stColor = c.status === 'disputed' ? '#b91c1c' : '#5c7260';
    /* 确认流处理（走既有 certify，全程留痕）：submitted/disputed 可核对通过，verified 可锁定，locked 仅主办方可解锁（必填原因） */
    var acts = '';
    if (c.status === 'submitted') acts = ' <button class="ghost sc-act" data-step="referee_review" data-card="' + c.id + '" type="button">确认核对</button>';
    else if (c.status === 'disputed') acts = ' <button class="ghost sc-act" data-step="referee_review" data-card="' + c.id + '" type="button">异议核对通过</button>';
    else if (c.status === 'verified') acts = ' <button class="ghost sc-act" data-step="admin_lock" data-card="' + c.id + '" type="button">锁定为正式成绩</button>';
    else if (c.status === 'locked') acts = ' <button class="ghost sc-act" data-step="admin_unlock" data-card="' + c.id + '" type="button">解锁</button>';
    var head = '<div class="sc-row" data-i="' + i + '" style="padding:8px 0;border-bottom:1px solid #e5eee1;font-size:14px;cursor:pointer"><b>' + escapeHtml(name) + '</b>' +
      ' <span style="color:' + stColor + '">' + (c.subject_type === 'team' ? '' : '队伍：' + escapeHtml(c.team_name || '—') + ' · ') +
      '状态：' + (CARD_STATUS_TXT[c.status] || c.status) +
      ' · 已打 ' + (c.thru || 0) + ' 洞 · 总杆：' + (c.gross_total == null ? '—' : c.gross_total) +
      ' · 相对标准杆：' + par + (c.group_no ? ' · 第 ' + c.group_no + ' 组' : '') + '</span> <span style="color:#1d7a3a">逐洞 ▾</span>' + acts + '</div>';
    var holes = c.holes || [];
    var detail = '<div class="sc-detail" id="scDetail' + i + '" style="display:none;padding:6px 0 10px;overflow-x:auto"><table style="border-collapse:collapse;font-size:13px">' +
      '<tr><th style="padding:2px 6px;text-align:left">洞</th>' + holes.map(function (h) { return '<td style="padding:2px 6px;text-align:center">' + h.hole + '</td>'; }).join('') + '</tr>' +
      '<tr><th style="padding:2px 6px;text-align:left">Par</th>' + holes.map(function (h) { return '<td style="padding:2px 6px;text-align:center;color:#5c7260">' + (h.par == null ? '—' : h.par) + '</td>'; }).join('') + '</tr>' +
      '<tr><th style="padding:2px 6px;text-align:left">杆数</th>' + holes.map(function (h) { return '<td style="padding:2px 6px;text-align:center"><b>' + (h.strokes == null ? '—' : h.strokes) + '</b></td>'; }).join('') + '</tr></table></div>';
    return head + detail;
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.sc-row'), function (row) {
    row.onclick = function () {
      var det = document.getElementById('scDetail' + row.getAttribute('data-i'));
      if (det) det.style.display = det.style.display === 'none' ? 'block' : 'none';
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll('.sc-act'), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      handleCardAction(b.getAttribute('data-step'), b.getAttribute('data-card'));
    };
  });
}
function handleCardAction(step, cardId) {
  var m = document.getElementById('scoreMsg');
  var body = { scorecard_id: cardId, step: step };
  if (step === 'referee_review') body.decision = 'approve';
  if (step === 'admin_unlock') {
    var note = prompt('解锁将把该记分卡退回「已核对」以便更正，必须填写原因（记入审计）：');
    if (!note) { if (m) m.textContent = '已取消解锁（未填写原因）。'; return; }
    body.note = note;
  }
  if (step === 'admin_lock' && !confirm('锁定后成绩即为正式成绩，球员端不能再更正。确定锁定？')) return;
  call('certify', body).then(function (d) {
    if (d.ok) {
      if (m) m.textContent = '已处理，成绩状态已更新。';
      refreshDash(); /* 计数区与成绩区一并刷新（refreshDash 内含成绩重拉） */
    } else if (m) m.textContent = '处理失败：' + (d.error || '未知错误');
  });
}
function refreshDash() {
  if (!currentEvent) return;
  call('scorecards_staff_list', { event_id: currentEvent.id }).then(renderScoreSection).catch(function () { renderScoreSection(null); });
  Promise.all([
    call('registrations_list', { event_id: currentEvent.id }),
    call('event_get', { event_id: currentEvent.id }),
    call('event_report', { event_id: currentEvent.id })
  ]).then(function (rs) {
    var d = rs[0], eg = rs[1], r = rs[2];
    var regs = d.registrations || [];
    var reg = regs.filter(function (x) { return x.status === 'registered'; }).length;
    var ci = regs.filter(function (x) { return x.status === 'checked_in'; }).length;
    var pendReg = regs.filter(function (x) { return x.status === 'pending'; }).length;
    document.getElementById('cReg').textContent = reg + ci;
    document.getElementById('cIn').textContent = ci;
    document.getElementById('cReview').textContent = pendReg;
    renderRegList(regs, d.teams || [], eg.pairings || []);
    var pend = 0, todos = [];
    if (pendReg > 0) todos.push('有 ' + pendReg + ' 条报名待审核，请在下方「报名名单」中通过或拒绝');
    if (currentEvent.status === 'in_progress') todos.push('比赛进行中；收尾时点上方「结束比赛」，赛事页将切换为回忆馆');
    if (r.report) {
      var sc = r.report.scoring.by_status || {};
      pend = (sc.submitted || 0) + (sc.verified || 0);
      if ((sc.submitted || 0) > 0) todos.push('有 ' + sc.submitted + ' 张记分卡已提交、等待球员核对');
      if ((sc.verified || 0) > 0) todos.push('有 ' + sc.verified + ' 张记分卡已核对、等待管理员锁定为正式成绩');
      if (currentEvent.status === 'draft') todos.push('赛事还是草稿，确认信息后点「发布赛事」开放报名');
    }
    document.getElementById('cPend').textContent = pend;
    document.getElementById('todos').innerHTML = todos.map(function (t) { return '<div class="todo">RUKIK 替您想到：' + t + '</div>'; }).join('');
    var pb = document.getElementById('primaryBtn');
    if (currentEvent.status === 'draft') { pb.textContent = '发布赛事'; pb.onclick = function () { updateStatus('published'); }; }
    else if (currentEvent.status === 'published') { pb.textContent = '开始比赛'; pb.onclick = function () { updateStatus('in_progress'); }; }
    else if (currentEvent.status === 'in_progress') { pb.textContent = '结束比赛'; pb.onclick = finishEvent; }
    else if (currentEvent.status === 'completed') { pb.textContent = '打开赛事页（回忆馆）'; pb.onclick = function () { window.open('../event.html?e=' + encodeURIComponent(currentEvent.id), '_blank'); }; }
    else { pb.textContent = '刷新进度'; pb.onclick = refreshDash; }
  });
}
function updateStatus(s) {
  call('event_update', { event_id: currentEvent.id, status: s }).then(function (d) {
    if (d.event) { currentEvent = d.event; document.getElementById('dashMsg').textContent = '状态已更新为 ' + s; refreshDash(); }
    else show(d);
  });
}
// [线X 补齐 2026-11-11] 结束比赛：与 App「结束比赛（切换回忆馆）」同口径——同一 event_update 动作、
// 同一 requireStaff 权限、同一状态机（in_progress → completed），不另造结束逻辑。
function finishEvent() {
  if (!confirm('确定结束比赛吗？结束后赛事页将切换为回忆馆，记分到此为止。')) return;
  call('event_update', { event_id: currentEvent.id, status: 'completed' }).then(function (d) {
    if (d.event) {
      currentEvent = d.event;
      document.getElementById('dashMsg').innerHTML = '比赛已结束，赛事页已切换为回忆馆：<a href="../event.html?e=' + encodeURIComponent(currentEvent.id) + '" target="_blank">打开赛事页（回忆馆）</a>';
      refreshDash();
    } else show(d);
  });
}
var courseSearchTimer = null;
document.getElementById('fCourseQ').addEventListener('input', function () {
  var qv = this.value.trim();
  var box = document.getElementById('fCourseResults');
  clearTimeout(courseSearchTimer);
  if (qv.length < 2) { box.style.display = 'none'; return; }
  courseSearchTimer = setTimeout(function () {
    call('course_search', { q: qv, limit: 10 }).then(function (d) {
      var list = d.courses || [];
      if (!list.length) { box.innerHTML = '<div style="padding:8px;color:#888">未找到，可换关键词或用下方已有球场。</div>'; box.style.display = 'block'; return; }
      box.innerHTML = list.map(function (c, i) {
        var tier = c.completeness.tier === 'L3' ? '发球台详情全' : c.completeness.tier === 'L2' ? '记分卡 Par/SI' : '仅位置';
        var trust = c.completeness.trust === 'lead' ? ' · 资料待核实' : (c.completeness.suspect ? ' · 部分数据待核实' : '');
        return '<div class="csr" data-i="' + i + '" style="padding:8px;cursor:pointer;border-bottom:1px solid #eef2ee"><b>' + c.name + '</b><br><span style="font-size:12px;color:#5c7260">' + (c.city || '') + (c.state ? ', ' + c.state : '') + ' · ' + tier + (c.completeness.total_par ? ' · Par ' + c.completeness.total_par : '') + trust + '</span></div>';
      }).join('');
      box.style.display = 'block';
      Array.prototype.forEach.call(box.querySelectorAll('.csr'), function (el) {
        el.onclick = function () { pickCourse(list[Number(el.getAttribute('data-i'))]); box.style.display = 'none'; };
      });
    });
  }, 300);
});
function pickCourse(c) {
  var sel = document.getElementById('fCourse');
  if (!Array.prototype.some.call(sel.options, function (o) { return o.value === c.id; })) {
    var opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.name; sel.appendChild(opt);
  }
  sel.value = c.id;
  document.getElementById('fCourseQ').value = c.name;
  call('course_get', { course_id: c.id }).then(function (d) {
    var tees = (d.tees || []).slice().sort(function (a, b) { return (b.total_yards || 0) - (a.total_yards || 0); });
    document.getElementById('fTee').innerHTML = tees.map(function (t) { return '<option value="' + t.id + '">' + t.name + (t.slope ? '（Slope ' + t.slope + '）' : '（无 Slope/码数）') + '</option>'; }).join('') || '<option value="">（该场暂无发球台资料）</option>';
    var tierTxt = c.completeness.tier === 'L3' ? '发球台详情完整' : c.completeness.tier === 'L2' ? '记分卡 Par/差点指数已备，暂无发球台码数' : '仅有位置资料，逐洞资料待补充';
    document.getElementById('fCourseInfo').textContent = '已带入：' + (c.address || '') + ' · ' + tierTxt + (c.completeness.trust === 'lead' ? ' · 线索级资料，待核实' : '') + ' · 选中后自动带入地址/坐标/Par/发球台，记分与 18 洞预览直接可用（有资料范围内）。';
  });
}

document.getElementById('kSave').onclick = function () {
  if (!currentEvent) return;

    if (d.ok) { kMsg(knowEditingId ? '已保存修改。' : '已保存为草稿，确认无误后点「发布」，AI 球童才会引用。'); resetKnowForm(); loadKnowledge(); }
    else kMsg('保存失败：' + (d.error || '未知错误'));

document.getElementById('kFile').addEventListener('change', function () {
  var f = this.files[0]; if (!f) return;
  var ext = (f.name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') {
    knowSource = { type: 'pdf', name: f.name };
    kMsg('正在提取 PDF 文字…');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    f.arrayBuffer().then(function (buf) { return pdfjsLib.getDocument({ data: buf }).promise; }).then(function (pdf) {
      var pages = [], chain = Promise.resolve();
      for (var i = 1; i <= pdf.numPages; i++) { (function (p) { chain = chain.then(function () { return pdf.getPage(p).then(function (page) { return page.getTextContent(); }).then(function (tc) { pages.push(tc.items.map(function (it) { return it.str; }).join(' ')); }); }); })(i); }
      return chain.then(function () { return { text: pages.join('\n'), n: pdf.numPages }; });
    }).then(function (r) {
      document.getElementById('kBody').value = r.text.slice(0, 19000);
      if (!document.getElementById('kTitle').value.trim()) document.getElementById('kTitle').value = f.name.replace(/\.pdf$/i, '');
      kMsg('已提取 ' + r.n + ' 页文字到内容框，请核对修改后再保存草稿。');
    }).catch(function () { kMsg('PDF 提取失败，请把要点直接粘贴到内容框。'); });
  } else if (ext === 'png' || ext === 'jpg' || ext === 'jpeg') {
    knowSource = { type: 'image', name: f.name };
    kMsg('图片暂不支持自动识别文字：已记录文件名「' + f.name + '」，请把图片中的要点填入上方内容后保存。');
  } else {
    knowSource = { type: 'word', name: f.name };
    kMsg('Word 暂不支持自动解析：已记录文件名「' + f.name + '」，请把要点粘贴到上方内容后保存。');
  }
});
