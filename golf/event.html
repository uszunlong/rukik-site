var cdAuth = null; // 懒加载的 auth.js 模块
var cdLoginMounted = false;
var cdSavedScrollY = 0;

function cdEsc(s) { return window.esc ? window.esc(s) : String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function cdStoreKey() { return 'golf_caddie_msgs_' + (cdEventId || 'none'); }
function cdPersist() { try { sessionStorage.setItem(cdStoreKey(), JSON.stringify(cdHistory.slice(-20))); } catch (e) {} }
function cdLoadHistory() { try { var s = sessionStorage.getItem(cdStoreKey()); cdHistory = s ? (JSON.parse(s) || []) : []; } catch (e) { cdHistory = []; } }
function cdScrollBottom() { cdBody.scrollTop = cdBody.scrollHeight; }
// 轻量结构渲染：## 标题 / - 列表 / **加粗** / 段落（先转义再套格式，用户文本永不注入 HTML）
function cdRenderRich(text) {
  var lines = cdEsc(text).split('\n');
  var out = '', inList = false;
  function closeList() { if (inList) { out += '</ul>'; inList = false; } }
  lines.forEach(function (ln) {
    var t = ln.trim();
    var bold = function (s) { return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); };
    if (/^##\s+/.test(t)) { closeList(); out += '<div class="h">' + bold(t.replace(/^##\s+/, '')) + '</div>'; }
    else if (/^-\s+/.test(t)) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + bold(t.replace(/^-\s+/, '')) + '</li>'; }
    else if (t === '') { closeList(); }
    else { closeList(); out += '<p>' + bold(t) + '</p>'; }
  });
  closeList();
  return out;
}
function cdAddMsg(role, text, rich) {
  var d = document.createElement('div');
  d.className = 'cd-msg ' + (role === 'user' ? 'u' : 'a');
  if (role === 'assistant' && rich) d.innerHTML = cdRenderRich(text); else d.textContent = text;
  cdMsgs.appendChild(d);
  cdScrollBottom();
  return d;
}
function cdAddSys(text) {
  var d = document.createElement('div');
  d.className = 'cd-sys'; d.textContent = text;
  cdMsgs.appendChild(d);
  cdScrollBottom();
}
function cdPaintWelcome() {
  var d = document.createElement('div');
  d.className = 'cd-msg a';
  d.innerHTML = '<span class="cd-tag">平台官方 AI · 不是真人教练</span><div>' + cdEsc(CD_WELCOME) + '</div>';
  cdMsgs.appendChild(d);
}
function cdPaintHistory() {
  cdMsgs.innerHTML = '';
  cdPaintWelcome();
  cdHistory.forEach(function (m) { cdAddMsg(m.role, m.content, m.role === 'assistant'); });
}
function cdPaintChips() {
  cdChips.innerHTML = '';
  if (!cdLoggedIn) return;
  CD_SUGGESTED.forEach(function (q) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = q;
    b.addEventListener('click', function () { if (!cdSending) { cdInput.value = q; cdSend(); } });
    cdChips.appendChild(b);
  });
}
function cdSetLoggedIn(on) {
  cdLoggedIn = on;
  cdLogin.classList.toggle('hidden', on);
  cdComposer.classList.toggle('hidden', !on);
  cdPaintChips();
  if (on && cdPendingAsk) { var t = cdPendingAsk; cdPendingAsk = null; cdInput.value = t; cdSend(); }
}
/* Z35：点赛事页合作伙伴卡 → 打开本场球童并自动请其介绍该品牌（上下文沿用本场 golf_event_id） */
document.addEventListener('golf:ask-brand', function (ev) {
  var d = (ev && ev.detail) || {};
  if (!d.name) return;
  var q = '请详细介绍本场赛事的' + d.name + '。';
  Promise.resolve(cdOpen()).then(function () {
    if (cdLoggedIn) { cdInput.value = q; cdSend(); }
    else cdPendingAsk = q;
  });
});
function cdSetEvName() {
  var t = (window.EV && window.EV.title) || '';
  var el = document.getElementById('cdEvName');
  if (t) { el.textContent = t; return; }
  // EV 未就绪时只读 event_get 取公开标题，失败静默留「本场赛事」
  fetch(CD_API + '/golf-api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': window.ANON, 'Authorization': 'Bearer ' + window.ANON },
    body: JSON.stringify({ action: 'event_get', event_id: cdEventId })
  }).then(function (r) { return r.json(); }).then(function (j) {
    var tt = (j && j.event && j.event.title) || '';
    if (tt) el.textContent = tt;
  }).catch(function () {});
}
async function cdEnsureAuth() {
  if (cdAuth) return cdAuth;
  cdAuth = await import('./auth.js?v=20261112c'); /* [线Z55] 共享模块必须带内容版本参数，auth.js 变更同步升版本（见 play-home-fix 终报口径） */
  cdAuth.initAuth(function (s) { cdSetLoggedIn(!!s); });
  return cdAuth;
}
async function cdOpen() {
  if (!cdEventId) cdEventId = window.eventId;
  cdLoadHistory();
  cdSavedScrollY = window.scrollY || 0;
  cdSheet.classList.remove('hidden');
  cdPaintHistory();
  cdSetEvName();
  try {
    var auth = await cdEnsureAuth();
    var tk = await auth.getAccessToken();
    cdSetLoggedIn(!!tk);
    if (!tk && !cdLoginMounted) {
      cdLoginMounted = true;
      auth.mountLogin(document.getElementById('cdLoginMount'), { onDone: function () { cdSetLoggedIn(true); } });
    }
  } catch (e) {
    // 登录组件加载失败：面板内如实提示，赛事页其余功能不受影响
    cdAddSys('登录组件暂时加载失败，请稍后再打开球童面板。');
  }
  cdScrollBottom();
  try { cdInput.focus(); } catch (e) {}
}
function cdClose() {
  cdSheet.classList.add('hidden');
  try { window.scrollTo(0, cdSavedScrollY); } catch (e) {}
}
async function cdSend() {
  var text = (cdInput.value || '').trim();
  if (!text || cdSending) return;
  cdSending = true; cdSendBtn.disabled = true; cdInput.value = '';
  cdHistory.push({ role: 'user', content: text });
  cdAddMsg('user', text, false); cdPersist();
  var bubble = cdAddMsg('assistant', '正在思考…', false);
  var acc = '';
  try {
    var tk = await cdAuth.getAccessToken();
    if (!tk) { bubble.textContent = '登录状态已过期，请重新登录后再问我。'; cdSetLoggedIn(false); return; }
    var payload = { professional_id: CD_PRO_ID, mode: 'web', stream: true, messages: cdHistory.slice(-10) };
    if (cdEventId) payload.golf_event_id = cdEventId;
    var res = await fetch(CD_API + '/pro-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': window.ANON, 'Authorization': 'Bearer ' + tk },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      var ej = await res.json().catch(function () { return null; });
      var code = ej && ej.error;
      if (res.status === 401 || code === 'login_required') { bubble.textContent = '登录状态已过期，请重新登录后再问我。'; cdSetLoggedIn(false); }
      else if (code === 'round_limit') { bubble.textContent = '这轮会话的问题已经比较多了，请关闭面板后重新打开球童会话继续问我。'; }
      else { bubble.textContent = '这次没能连上（' + (code || res.status) + '），请稍后再试一次。'; }
      cdHistory.pop(); cdPersist();
      return;
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = '';
    bubble.textContent = '';
    for (;;) {
      var step = await reader.read();
      if (step.done) break;
      buf += dec.decode(step.value, { stream: true });
      var idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        var line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (line.indexOf('data:') !== 0) continue;
        var data = line.slice(5).trim();
        if (!data || data === '[DONE]') continue;
        try {
          var j = JSON.parse(data);
          var c = j && j.choices && j.choices[0] && j.choices[0].delta ? j.choices[0].delta.content : '';
          if (typeof c === 'string' && c) { acc += c; bubble.innerHTML = cdRenderRich(acc); cdScrollBottom(); }
        } catch (e) {}
      }
    }
    if (!acc) { bubble.textContent = '这次没有拿到回答，请再问一次。'; cdHistory.pop(); cdPersist(); return; }
    bubble.innerHTML = cdRenderRich(acc);
    cdHistory.push({ role: 'assistant', content: acc });
    cdPersist();
  } catch (e) {
    bubble.textContent = '网络好像不太顺，请稍后再试一次。';
    cdHistory.pop(); cdPersist();
  } finally {
    cdSending = false; cdSendBtn.disabled = false;
  }
}
cdSendBtn.addEventListener('click', cdSend);
cdInput.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); cdSend(); } });
document.getElementById('cdClose').addEventListener('click', cdClose);
document.getElementById('cdBackdrop').addEventListener('click', cdClose);
// [线X 热修] Esc 关闭（与 ✕／点遮罩并列的第三条关闭路径）；弹层只许由下方 #cdOpen 委托点击打开，无任何自动打开路径
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !cdSheet.classList.contains('hidden')) cdClose(); });
// 双卡由 renderDual 渲染，入口用事件委托绑定（避免重复绑定）
document.addEventListener('click', function (e) {
  var t = e.target && e.target.closest ? e.target.closest('#cdOpen') : null;
  if (t) { e.preventDefault(); cdOpen(); }
});
</script>
<script>
/* 照片管理（线 Z27，2026-11-11）：删除只列本人上传的照片；服务端 live-photo 按 uploader_id 强制校验，
 * 他人照片删不动（403）。令牌每次调用时现读 localStorage（与 photos.html 同口径，不依赖页面加载时快照）。 */
(function () {
  var LP = 'https://yzgzgtrqrmarfjftgbwt.supabase.co/functions/v1/live-photo';
  var LSKEY = 'sb-yzgzgtrqrmarfjftgbwt-auth-token';
  var sheet = document.getElementById('pmSheet');
  var opts = document.getElementById('pmOpts');
  var delView = document.getElementById('pmDelView');
  var msg = document.getElementById('pmMsg');
  var list = document.getElementById('pmList');

  function session() {
    try { var raw = localStorage.getItem(LSKEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function myTok() { var s = session(); return (s && s.access_token) || null; }
  function myUid() {
    var s = session();
    if (s && s.user && s.user.id) return s.user.id;
    var t = myTok();
    if (!t) return null;
    try {
      var p = JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));
      return p.sub || null;
    } catch (e) { return null; }
  }
  function lp(body) {
    var tok = myTok();
    return fetch(LP, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': window.ANON, 'Authorization': 'Bearer ' + (tok || window.ANON) },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, data: j }; }); });
  }
  function close() { sheet.classList.add('hidden'); }
  window.pmOpen = function () {
    opts.classList.remove('hidden');
    delView.classList.add('hidden');
    sheet.classList.remove('hidden');
  };
  document.getElementById('pmClose').addEventListener('click', close);
  document.getElementById('pmBackdrop').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.classList.contains('hidden')) close(); });
  document.getElementById('pmGoUpload').addEventListener('click', function () { location.href = poolUrl(); });
  document.getElementById('pmGoDelete').addEventListener('click', function () {
    opts.classList.add('hidden');
    delView.classList.remove('hidden');
    list.innerHTML = '';
    if (!myUid()) {
      msg.textContent = '请先登录后再删除照片（与 RUKIK App 同一账号）。';
      mountLogin();
      return;
    }
    loadMine();
  });
  function mountLogin() {
    import('./auth.js?v=20261112c').then(function (m) { /* [线Z55] 内容版本参数，同上 */
      m.mountLogin(document.getElementById('pmLoginMount'), { onDone: function () {
        document.getElementById('pmLoginMount').innerHTML = '';
        loadMine();
      } });
    }).catch(function () { msg.textContent = '登录组件加载失败，请刷新后重试。'; });
  }
  function loadMine() {
    msg.textContent = '正在加载…';
    lp({ action: 'photo_list', event_kind: 'golf', event_id: window.eventId, limit: 100 }).then(function (r) {
      if (r.status !== 200 || !r.data || r.data.error) { msg.textContent = '加载失败，请稍后重试。'; return; }
      var uid = myUid();
      var mine = (r.data.photos || []).filter(function (p) { return p.uploader_id === uid; });
      if (!mine.length) { msg.textContent = '你还没有上传过照片。'; list.innerHTML = ''; return; }
      msg.textContent = '只显示你上传的照片。删除后立即生效、无法恢复。';
      list.innerHTML = mine.map(function (p) {
        var cap = p.caption ? esc(p.caption) : (p.status === 'visible' ? '已展示' : '未公开展示');
        return '<div class="pm-row" data-pid="' + esc(p.id) + '"><img src="' + esc(p.thumb_url || p.url) + '" alt="">' +
          '<span class="pm-cap">' + cap + '</span>' +
          '<button type="button" class="pm-del">删除</button></div>';
      }).join('');
      Array.prototype.forEach.call(list.querySelectorAll('.pm-row'), function (row) {
        var btn = row.querySelector('.pm-del');
        btn.addEventListener('click', function () {
          if (!btn.classList.contains('confirm')) {
            btn.classList.add('confirm'); btn.textContent = '确认删除？';
            var cancel = document.createElement('button');
            cancel.type = 'button'; cancel.className = 'pm-cancel'; cancel.textContent = '取消';
            cancel.addEventListener('click', function () {
              btn.classList.remove('confirm'); btn.textContent = '删除'; cancel.remove();
            });
            btn.after(cancel);
            return;
          }
          btn.disabled = true; btn.textContent = '删除中…';
          lp({ action: 'photo_delete', photo_id: row.getAttribute('data-pid') }).then(function (r2) {
            if (r2.status === 200 && r2.data && r2.data.ok) {
              row.remove();
              if (typeof window.loadWall === 'function') window.loadWall();
              if (!list.querySelector('.pm-row')) msg.textContent = '你上传的照片已全部删除。';
            } else if (r2.status === 403) {
              msg.textContent = '只能删除自己上传的照片。';
              btn.disabled = false; btn.classList.remove('confirm'); btn.textContent = '删除';
            } else {
              msg.textContent = '删除失败，请稍后重试。';
              btn.disabled = false; btn.classList.remove('confirm'); btn.textContent = '删除';
            }
          }).catch(function () {
            msg.textContent = '删除失败，请稍后重试。';
            btn.disabled = false; btn.classList.remove('confirm'); btn.textContent = '删除';
          });
        });
      });
    }).catch(function () { msg.textContent = '加载失败，请稍后重试。'; });
  }
})();
</script>
<script>
/* [Z65] 封面管理面板逻辑：数据源＝EV.event.poster_urls（存储序）＋cover_url，
   与 hero 相册（renderHeroMedia/postersOf）同读一份真源；任一变更后以服务端
   回执刷新 EV 并重渲染 hero（默认封面自动让位/回归）。上传＝poster_add 先登记
   再签名直传；直传失败自动 poster_delete 清理登记条目，不留坏图。 */
(function () {
  var sheet = document.getElementById('pcSheet');
  if (!sheet) return;
  var msg = document.getElementById('pcMsg');
  var list = document.getElementById('pcList');
  var fileIn = document.getElementById('pcFile');
  var bound = false;
  function setMsg(t) { if (msg) msg.textContent = t || ''; }
  function rawList() { return (window.EV && Array.isArray(window.EV.event.poster_urls)) ? window.EV.event.poster_urls.slice() : []; }
  function close() { sheet.classList.add('hidden'); }
  function syncEv(d) {
    if (d && Array.isArray(d.poster_urls)) window.EV.event.poster_urls = d.poster_urls;
    if (d && 'cover_url' in d) window.EV.event.cover_url = d.cover_url;
  }
  function afterChange(okMsg) {
    if (typeof window.renderHeroMedia === 'function') window.renderHeroMedia();
    renderList();
    setMsg(okMsg || '');
  }
  function doCall(action, extra, okMsg) {
    setMsg('处理中…');
    return window.call(action, extra).then(function (d) {
      syncEv(d);
      afterChange(okMsg);
      return d;
    }).catch(function (e) { renderList(); setMsg('操作失败：' + ((e && e.message) || '请稍后重试')); });
  }
  function renderList() {
    var urls = rawList();
    var cover = (window.EV && window.EV.event) ? window.EV.event.cover_url : null;
    if (!urls.length) {
      list.innerHTML = '<div class="pm-msg">还没有海报。用下方「添加海报」上传第一张；没有海报时，球局页顶部显示 RUKIK Golf 默认封面。</div>';
      return;
    }
    list.innerHTML = urls.map(function (u, i) {
      return '<div class="pm-row" data-pcidx="' + i + '"><img src="' + window.esc(u) + '" alt="海报">' +
        (u === cover ? '<span class="pc-cov">封面</span>' : '') +
        '<span class="pm-cap">第 ' + (i + 1) + ' 张</span>' +
        (u === cover ? '' : '<button type="button" class="pc-act" data-pc="cover">设封面</button>') +
        '<button type="button" class="pc-act" data-pc="up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" class="pc-act" data-pc="down"' + (i === urls.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button type="button" class="pm-del" data-pc="del">删除</button></div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.pm-row'), function (row) {
      var i = Number(row.getAttribute('data-pcidx'));
      var u = rawList()[i];
      if (!u) return;
      var cov = row.querySelector('[data-pc="cover"]');
      if (cov) cov.addEventListener('click', function () { doCall('poster_set_cover', { url: u }, '已设为封面，相册与分享图已同步。'); });
      var up = row.querySelector('[data-pc="up"]');
      if (up) up.addEventListener('click', function () {
        var cur = rawList(); if (i <= 0 || i >= cur.length) return;
        var nx = cur.slice(); var t = nx[i - 1]; nx[i - 1] = nx[i]; nx[i] = t;
        doCall('poster_reorder', { poster_urls: nx }, '顺序已更新。');
      });
      var dn = row.querySelector('[data-pc="down"]');
      if (dn) dn.addEventListener('click', function () {
        var cur = rawList(); if (i < 0 || i >= cur.length - 1) return;
        var nx = cur.slice(); var t = nx[i + 1]; nx[i + 1] = nx[i]; nx[i] = t;
        doCall('poster_reorder', { poster_urls: nx }, '顺序已更新。');
      });
      var del = row.querySelector('[data-pc="del"]');
      if (del) del.addEventListener('click', function () {
        if (!del.classList.contains('confirm')) {
          del.classList.add('confirm'); del.textContent = '确认删除？';
          var cancel = document.createElement('button');
          cancel.type = 'button'; cancel.className = 'pm-cancel'; cancel.textContent = '取消';
          cancel.addEventListener('click', function () { del.classList.remove('confirm'); del.textContent = '删除'; cancel.remove(); });
          del.after(cancel);
          return;
        }
        del.disabled = true; del.textContent = '删除中…';
        doCall('poster_delete', { url: u }, '已删除，相册已同步。');
      });
    });
  }
  function onFile() {
    var f = fileIn.files && fileIn.files[0];
    fileIn.value = '';
    if (!f) return;
    if (!/image\/(png|jpeg|webp)/.test(f.type || '')) { setMsg('仅支持 PNG / JPG / WebP 图片。'); return; }
    if (f.size > 5242880) { setMsg('单张海报不能超过 5MB，请压缩后重试。'); return; }
    if (rawList().length >= 9) { setMsg('海报最多 9 张，请先删除旧海报。'); return; }
    setMsg('上传中…');
    window.call('poster_add', { content_type: f.type }).then(function (d) {
      if (!d || !d.ok || !d.signed_url) throw new Error((d && d.error) || '登记失败');
      syncEv(d);
      return fetch(d.signed_url, { method: 'PUT', headers: { 'Content-Type': f.type }, body: f }).then(function (r) {
        if (!r.ok) {
          return window.call('poster_delete', { url: d.public_url }).then(function (dd) {
            syncEv(dd);
            throw new Error('直传失败（存储返回 ' + r.status + '），已清理登记，请重试');
          });
        }
        afterChange('海报已添加，相册已同步。');
      });
    }).catch(function (e) {
      if (typeof window.renderHeroMedia === 'function') window.renderHeroMedia();
      renderList();
      setMsg('上传失败：' + ((e && e.message) || '请稍后重试'));
    });
  }
  window.openPcSheet = function () {
    if (!bound) {
      bound = true;
      document.getElementById('pcClose').addEventListener('click', close);
      document.getElementById('pcBackdrop').addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.classList.contains('hidden')) close(); });
      fileIn.addEventListener('change', onFile);
    }
    renderList();
    setMsg('');
    sheet.classList.remove('hidden');
  };
})();
</script>
