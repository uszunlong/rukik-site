      var fig = img.parentNode, track = document.getElementById('carTrack');
      if (!fig || !track) return;
      var i = Array.prototype.indexOf.call(track.children, fig);
      var item = CAR.list[i];
      if (item) { CARDEAD[item.id] = true; carRemoveAt(i); }
    });
    img.addEventListener('click', function () { location.href = poolUrl(); });
  });
  var downX = null;
  box.addEventListener('pointerdown', function (e) { downX = e.clientX; });
  box.addEventListener('pointerup', function (e) {
    if (downX == null) return;
    var dx = e.clientX - downX; downX = null;
    if (Math.abs(dx) > 40) { carNoteManual(); carGo(CAR.idx + (dx < 0 ? 1 : -1)); }
  });
  box.addEventListener('touchstart', function () { carNoteManual(); }, { passive: true });
  carGo(CAR.idx);
  carStart();
}
var LASTBOARD = null;
function loadBoardIntoFunc() {
  dyn('leaderboard_get', {}).then(function (j) {
    LASTBOARD = j;
    renderFunc(j);
    var el = document.getElementById('funcSec');
    var h = el.querySelector('h2');
    if (h) { var t = new Date(); h.innerHTML += ' <span style="font-size:12px;color:#888;font-weight:normal">更新于 ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + '</span>'; }
  }).catch(function () {
    if (LASTBOARD) return; // 已有上次数据：保留展示（带原更新时间），不清空、不整页报错
    errBox(document.getElementById('funcSec'), '排行榜加载失败，请重试。', loadBoardIntoFunc);
  });
}
function loadWall() {
  dyn('wall_get', {}).then(function (j) {
    WALL = j.wall || null;
    if (EV) { renderHero(); renderLive(); }
    startWallPoll();
  }).catch(function () {
    var el = document.getElementById('liveSec');
    if (el && ((EV && EV.album_enabled) || (SNAP && SNAP.album_enabled))) errBox(el, '精彩瞬间加载失败，请重试。', loadWall);
  });
}
// 比赛进行中（state=live）每 60 秒静默刷新一次照片墙：新照片自动进轮播，无需刷新整页；
// 页面不可见时跳过，dyn() 已做在飞去重＋重试上限，不会形成请求风暴。
var WALL_POLL_STARTED = false;
function startWallPoll() {
  if (WALL_POLL_STARTED) return;
  WALL_POLL_STARTED = true;
  setInterval(function () {
    if (document.hidden || !WALL || WALL.state !== 'live') return;
    dyn('wall_get', {}).then(function (j) {
      var nw = j.wall || null;
      if (!nw) return;
      var oldIds = ((WALL && WALL.feed) || []).map(function (f) { return f.id; }).join(',');
      var newIds = (nw.feed || []).map(function (f) { return f.id; }).join(',');
      WALL = nw;
      if (oldIds !== newIds) renderLive();
    }).catch(function () {});
  }, 60000);
}
var SNAP = null, WALL_STARTED = false;
var SNAP_URL = 'https://yzgzgtrqrmarfjftgbwt.supabase.co/storage/v1/object/public/share-images/golf-snapshots/' + eventId + '.json';
function applySnapshot(j) {
  // L0 基础层：海报/名称/时间/地点/机构/场次——不依赖 golf-api，存储直出即可见
  EV = {
    event: { title: j.title, title_en: j.title_en, description: j.description, status: j.status, starts_at: j.starts_at, timezone: j.timezone, cover_url: j.cover_url, poster_urls: j.poster_urls || [], format: j.format },
    course: { name: j.course_name, address: j.course_address, city: j.course_city },
    organizations: j.organizations || [], sessions: j.sessions || [],
    album_enabled: !!j.album_enabled, care_tips: { public: [], personal: null }, course_preview: null, pairings: [],
  };
  renderHero(); renderOrgs();
  applyShare(j);
}
function maybeWall() {
  if (WALL_STARTED) return;
  var enabled = EV && EV.album_enabled != null ? EV.album_enabled : (SNAP ? SNAP.album_enabled : null);
  if (enabled === null || enabled === undefined) return; // 开通状态未知，等动态层
  if (!enabled) { WALL_STARTED = true; window.__l3skipped = true; return; } // L3：未开通零请求
  WALL_STARTED = true; loadWall();
}
function loadDynamic() {
  dyn('event_get', {}).then(function (j) {
    EV = j; PREVIEW = j.course_preview || null;
    applyShare(j.event);
    curTee = PREVIEW && PREVIEW.main_tee_id;
    renderHero(); renderOrgs(); renderMap();
    if (LASTBOARD) loadBoardIntoFunc();
    setTimeout(renderCare, 900); // L4 关怀层：基础与排名之后最后渲染，失败静默（renderCare 无数据即隐藏）
    maybeWall();
  }).catch(function (e) {
    var msg = String(e && e.message || e);
    if (!SNAP) {
      errBox(document.getElementById('heroSec'), msg.indexOf('event not found') >= 0 ? '赛事不存在或链接无效。' : '赛事信息加载失败（网络或服务暂时不可用）。', loadDynamic);
      document.getElementById('statePill').textContent = '加载失败';
    } else {
      errBox(document.getElementById('mapSec'), '球场地图加载失败，请重试。', loadDynamic);
    }
    maybeWall();
  });
}
function boot() {
  document.getElementById('heroSec').innerHTML = '<div class="skl"></div>';
  loadBoardIntoFunc(); // L2 排名独立启动，不等基础层
  var t0 = Date.now();
  var ctrl = new AbortController(); var to = setTimeout(function () { ctrl.abort(); }, 4000);
  fetch(SNAP_URL, { signal: ctrl.signal }).then(function (r) { clearTimeout(to); if (!r.ok) throw new Error('snap ' + r.status); return r.json(); })
    .then(function (j) {
      window.__reqLog.push({ action: 'snapshot', ms: Date.now() - t0, ok: true });
      if (j && j.event_id === eventId && !PREVIEW) { SNAP = j; applySnapshot(j); maybeWall(); }
    })
    .catch(function () { window.__reqLog.push({ action: 'snapshot', ms: Date.now() - t0, ok: false }); /* 快照失败：回退 API 基础层，不报错 */ });
  loadDynamic();
}
if (!eventId) {
  errBox(document.getElementById('heroSec'), '链接缺少赛事参数。', function () { location.href = 'https://rukik.com/golf/event.html?e=11564c2e-9c4f-40de-a54a-9803a0ae024c'; });
} else {
  boot();
}
</script>

<!-- RUKIK Golf AI球童 · 赛事页内嵌面板（线 T，2026-11-11）：本页展开，不跳问 Rukik；caddie.html 独立页保留为备用入口 -->
<div id="cdSheet" class="hidden" role="dialog" aria-label="RUKIK Golf AI球童">
  <div class="cd-backdrop" id="cdBackdrop"></div>
  <div class="cd-panel">
    <div class="cd-head">
      <div class="cd-ttl">
        <div class="cd-name">RUKIK Golf AI球童<span class="cd-badge">平台官方 AI</span></div>
        <div class="cd-sub" id="cdEvName">本场赛事</div>
      </div>
      <button type="button" id="cdClose" aria-label="关闭">✕</button>
    </div>
    <div class="cd-body" id="cdBody">
      <div id="cdLogin" class="hidden">
        <div class="cd-lt">登录后即可问 AI 球童</div>
        <div class="cd-ld">AI 球童需要读取您在本场赛事的真实成绩与分组信息，因此需要登录。与 RUKIK App 同一账号（手机号或邮箱），同一 UID。</div>
        <div id="cdLoginMount"></div>
      </div>
      <div id="cdMsgs"></div>
      <div class="cd-chips" id="cdChips"></div>
    </div>
    <div class="cd-foot hidden" id="cdComposer">
      <div class="cd-inrow">
        <textarea id="cdInput" rows="1" placeholder="问球童：规则、球场、我的成绩……"></textarea>
        <button type="button" id="cdSend">发送</button>
      </div>
      <div class="cd-hint">AI 球童是平台官方 AI，不是真人教练；成绩与排名以赛事正式发布为准。</div>
    </div>
  </div>
</div>
<script type="module">
/* RUKIK Golf AI球童 · 赛事页内嵌面板（线 T，2026-11-11）
 * 调用口径逐字复用线 H caddie.html：客户端只传 golf_event_id，上下文由服务端
 * 以本人 JWT 由服务端隐藏注入，永不显示为用户消息；auth.js 懒加载（首屏零新增请求）。
 * 会话只含本场对话：sessionStorage 按 event_id 分键，与 caddie.html 同键共享同一线程。 */
var CD_PRO_ID = 'c5b73421-290a-4a1b-8ca3-25364e7d2824'; // 平台官方角色「RUKIK Golf AI球童」（迁移 0696）
var CD_API = 'https://yzgzgtrqrmarfjftgbwt.supabase.co/functions/v1';
var CD_WELCOME = '您好！我是您的RUKIK Golf AI球童。我可以帮您了解球场、解释规则、回顾成绩，也会记住您在每一场比赛中的真实进步。';
var CD_SUGGESTED = ['我这场比赛打得怎么样？现在排第几？', '下一洞是什么情况？', '球出界（OB）了该怎么处理？', '比杆赛和 Stableford 有什么区别？', '打高尔夫有哪些基本礼仪？'];

var cdSheet = document.getElementById('cdSheet');
var cdBody = document.getElementById('cdBody');
var cdMsgs = document.getElementById('cdMsgs');
var cdChips = document.getElementById('cdChips');
var cdInput = document.getElementById('cdInput');
var cdSendBtn = document.getElementById('cdSend');
var cdComposer = document.getElementById('cdComposer');
var cdLogin = document.getElementById('cdLogin');
var cdEventId = null; // 面板打开时锁定当前页面 event_id，此后每轮都带它
var cdHistory = []; // 只含本场真实问答轮，欢迎语不入会话
var cdLoggedIn = false;
var cdSending = false;
var cdAuth = null; // 懒加载的 auth.js 模块
var cdLoginMounted = false;
var cdSavedScrollY = 0;

function cdEsc(s) { return window.esc ? window.esc(s) : String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function cdStoreKey() { return 'golf_caddie_msgs_' + (cdEventId || 'none'); }
function cdPersist() { try { sessionStorage.setItem(cdStoreKey(), JSON.stringify(cdHistory.slice(-20))); } catch (e) {} }
function cdLoadHistory() { try { var s = sessionStorage.getItem(cdStoreKey()); cdHistory = s ? (JSON.parse(s) || []) : []; } catch (e) { cdHistory = []; } }
function cdScrollBottom() { cdBody.scrollTop = cdBody.scrollHeight; }
// 轻量结构渲染：## 标题 / - 列表 / **加粗** / 段落（先转义再套格式，用户文本永不注入 HTML）
function cdRenderRich(text) {
  var lines = cdEsc(text).split('\n');
  var out = '', inList = false;
  function closeList() { if (inList) { out += '</ul>'; inList = false; } }
  lines.forEach(function (ln) {
    var t = ln.trim();
    var bold = function (s) { return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); };
    if (/^##\s+/.test(t)) { closeList(); out += '<div class="h">' + bold(t.replace(/^##\s+/, '')) + '</div>'; }
    else if (/^-\s+/.test(t)) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + bold(t.replace(/^-\s+/, '')) + '</li>'; }
    else if (t === '') { closeList(); }
    else { closeList(); out += '<p>' + bold(t) + '</p>'; }
  });
  closeList();
  return out;
}
function cdAddMsg(role, text, rich) {
  var d = document.createElement('div');
  d.className = 'cd-msg ' + (role === 'user' ? 'u' : 'a');
  if (role === 'assistant' && rich) d.innerHTML = cdRenderRich(text); else d.textContent = text;
  cdMsgs.appendChild(d);
  cdScrollBottom();
  return d;
}
function cdAddSys(text) {
  var d = document.createElement('div');
  d.className = 'cd-sys'; d.textContent = text;
  cdMsgs.appendChild(d);
  cdScrollBottom();
}
function cdPaintWelcome() {
  var d = document.createElement('div');
  d.className = 'cd-msg a';
  d.innerHTML = '<span class="cd-tag">平台官方 AI · 不是真人教练</span><div>' + cdEsc(CD_WELCOME) + '</div>';
  cdMsgs.appendChild(d);
}
function cdPaintHistory() {
  cdMsgs.innerHTML = '';
  cdPaintWelcome();
  cdHistory.forEach(function (m) { cdAddMsg(m.role, m.content, m.role === 'assistant'); });
}
function cdPaintChips() {
  cdChips.innerHTML = '';
  if (!cdLoggedIn) return;
  CD_SUGGESTED.forEach(function (q) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = q;
    b.addEventListener('click', function () { if (!cdSending) { cdInput.value = q; cdSend(); } });
    cdChips.appendChild(b);
  });
}
function cdSetLoggedIn(on) {
  cdLoggedIn = on;
  cdLogin.classList.toggle('hidden', on);
  cdComposer.classList.toggle('hidden', !on);
  cdPaintChips();
}
function cdSetEvName() {
  var t = (window.EV && window.EV.title) || '';
  var el = document.getElementById('cdEvName');
  if (t) { el.textContent = t; return; }
  // EV 未就绪时只读 event_get 取公开标题，失败静默留「本场赛事」
  fetch(CD_API + '/golf-api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': window.ANON, 'Authorization': 'Bearer ' + window.ANON },
    body: JSON.stringify({ action: 'event_get', event_id: cdEventId })
  }).then(function (r) { return r.json(); }).then(function (j) {
    var tt = (j && j.event && j.event.title) || '';
    if (tt) el.textContent = tt;
  }).catch(function () {});
}
async function cdEnsureAuth() {
  if (cdAuth) return cdAuth;
  cdAuth = await import('./auth.js');
  cdAuth.initAuth(function (s) { cdSetLoggedIn(!!s); });
  return cdAuth;
}
async function cdOpen() {
  if (!cdEventId) cdEventId = window.eventId;
  cdLoadHistory();
  cdSavedScrollY = window.scrollY || 0;
  cdSheet.classList.remove('hidden');
  cdPaintHistory();
  cdSetEvName();
  try {
    var auth = await cdEnsureAuth();
    var tk = await auth.getAccessToken();
    cdSetLoggedIn(!!tk);
    if (!tk && !cdLoginMounted) {
      cdLoginMounted = true;
      auth.mountLogin(document.getElementById('cdLoginMount'), { onDone: function () { cdSetLoggedIn(true); } });
    }
  } catch (e) {
    // 登录组件加载失败：面板内如实提示，赛事页其余功能不受影响
    cdAddSys('登录组件暂时加载失败，请稍后再打开球童面板。');
  }
  cdScrollBottom();
  try { cdInput.focus(); } catch (e) {}
}
function cdClose() {
  cdSheet.classList.add('hidden');
  try { window.scrollTo(0, cdSavedScrollY); } catch (e) {}
}
async function cdSend() {
  var text = (cdInput.value || '').trim();
  if (!text || cdSending) return;
  cdSending = true; cdSendBtn.disabled = true; cdInput.value = '';
  cdHistory.push({ role: 'user', content: text });
  cdAddMsg('user', text, false); cdPersist();
  var bubble = cdAddMsg('assistant', '正在思考…', false);
  var acc = '';
  try {
    var tk = await cdAuth.getAccessToken();
    if (!tk) { bubble.textContent = '登录状态已过期，请重新登录后再问我。'; cdSetLoggedIn(false); return; }
    var payload = { professional_id: CD_PRO_ID, mode: 'web', stream: true, messages: cdHistory.slice(-10) };
    if (cdEventId) payload.golf_event_id = cdEventId;
    var res = await fetch(CD_API + '/pro-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': window.ANON, 'Authorization': 'Bearer ' + tk },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      var ej = await res.json().catch(function () { return null; });
      var code = ej && ej.error;
      if (res.status === 401 || code === 'login_required') { bubble.textContent = '登录状态已过期，请重新登录后再问我。'; cdSetLoggedIn(false); }
      else if (code === 'round_limit') { bubble.textContent = '这轮会话的问题已经比较多了，请关闭面板后重新打开球童会话继续问我。'; }
      else { bubble.textContent = '这次没能连上（' + (code || res.status) + '），请稍后再试一次。'; }
      cdHistory.pop(); cdPersist();
      return;
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = '';
    bubble.textContent = '';
    for (;;) {
      var step = await reader.read();
      if (step.done) break;
      buf += dec.decode(step.value, { stream: true });
      var idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        var line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (line.indexOf('data:') !== 0) continue;
        var data = line.slice(5).trim();
        if (!data || data === '[DONE]') continue;
        try {
          var j = JSON.parse(data);
          var c = j && j.choices && j.choices[0] && j.choices[0].delta ? j.choices[0].delta.content : '';
          if (typeof c === 'string' && c) { acc += c; bubble.innerHTML = cdRenderRich(acc); cdScrollBottom(); }
        } catch (e) {}
      }
    }
    if (!acc) { bubble.textContent = '这次没有拿到回答，请再问一次。'; cdHistory.pop(); cdPersist(); return; }
    bubble.innerHTML = cdRenderRich(acc);
    cdHistory.push({ role: 'assistant', content: acc });
    cdPersist();
  } catch (e) {
    bubble.textContent = '网络好像不太顺，请稍后再试一次。';
    cdHistory.pop(); cdPersist();
  } finally {
    cdSending = false; cdSendBtn.disabled = false;
  }
}
cdSendBtn.addEventListener('click', cdSend);
cdInput.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); cdSend(); } });
document.getElementById('cdClose').addEventListener('click', cdClose);
document.getElementById('cdBackdrop').addEventListener('click', cdClose);
// funcrow 由 renderFunc 反复重渲染，入口用事件委托绑定（避免重复绑定）
document.addEventListener('click', function (e) {
  var t = e.target && e.target.closest ? e.target.closest('#cdOpen') : null;
  if (t) { e.preventDefault(); cdOpen(); }
});
</script>
