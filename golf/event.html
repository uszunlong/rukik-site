async function cdSend() {
  var text = (cdInput.value || '').trim();
  if (!text || cdSending) return;
  await cdSyncWithServer(); /* 发送前对齐删除状态：已删内容不得再作上下文回传 */

  cdAddMsg('user', text, false); cdPersist();
  var bubble = cdAddMsg('assistant', '正在思考…', false);
  var acc = '';
  try {
    var tk = await cdAuth.getAccessToken();
    if (!tk) { bubble.textContent = '登录状态已过期，请重新登录后再问我。'; cdSetLoggedIn(false); return; }
    var payload = { professional_id: CD_PRO_ID, mode: 'web', stream: true, client_msg_id: turnCid, messages: cdHistory.slice(-10).map(function (m) { return { role: m.role, content: m.content }; }) };
    if (cdEventId) payload.golf_event_id = cdEventId;
    var res = await fetch(CD_API + '/pro-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': window.ANON, 'Authorization': 'Bearer ' + tk },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      var ej = await res.json().catch(function () { return null; });
      var code = ej && ej.error;
      if (res.status === 401 || code === 'login_required') { bubble.textContent = '登录状态已过期，请重新登录后再问我。'; cdSetLoggedIn(false); }
      else if (code === 'round_limit') { bubble.textContent = '这轮会话的问题已经比较多了，请关闭面板后重新打开球童会话继续问我。'; }
      else { bubble.textContent = '这次没能连上（' + (code || res.status) + '），请稍后再试一次。'; }
      cdHistory.pop(); cdPersist();

    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = '';

      buf += dec.decode(step.value, { stream: true });
      var idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        var line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (line.indexOf('data:') !== 0) continue;
        var data = line.slice(5).trim();
        if (!data || data === '[DONE]') continue;

          if (typeof c === 'string' && c) { acc += c; bubble.innerHTML = cdRenderRich(acc); cdScrollBottom(); }

    if (!acc) { bubble.textContent = '这次没有拿到回答，请再问一次。'; cdHistory.pop(); cdPersist(); return; }

    cdHistory.push({ role: 'assistant', content: acc, cid: turnCid });

<script>
/* 照片管理（线 Z27，2026-11-11）：删除只列本人上传的照片；服务端 live-photo 按 uploader_id 强制校验，

(function () {
  var LP = 'https://yzgzgtrqrmarfjftgbwt.supabase.co/functions/v1/live-photo';
  var LSKEY = 'sb-yzgzgtrqrmarfjftgbwt-auth-token';

  var opts = document.getElementById('pmOpts');

  var msg = document.getElementById('pmMsg');

  function session() {
    try { var raw = localStorage.getItem(LSKEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function myTok() { var s = session(); return (s && s.access_token) || null; }
  function myUid() {

    if (s && s.user && s.user.id) return s.user.id;
    var t = myTok();

      var p = JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));
      return p.sub || null;
    } catch (e) { return null; }

    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, data: j }; }); });
  }

    sheet.classList.remove('hidden');

  document.getElementById('pmBackdrop').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.classList.contains('hidden')) close(); });

  // [权限 V2 2026-11-12] 删除管理模式：多选批量——普通参赛者只能选自己
  // 上传的（他人照片列出但不可选），主办方/管理员（photo_list cls=manager）

  var pmSel = {};

      if (r.status !== 200 || !r.data || r.data.error) { msg.textContent = '加载失败，请稍后重试。'; return; }

<script>
/* [Z65] 封面管理面板逻辑：数据源＝EV.event.poster_urls（存储序）＋cover_url，
   与 hero 相册（renderHeroMedia/postersOf）同读一份真源；任一变更后以服务端
   回执刷新 EV 并重渲染 hero（默认封面自动让位/回归）。上传＝poster_add 先登记
   再签名直传；直传失败自动 poster_delete 清理登记条目，不留坏图。 */
(function () {
  var sheet = document.getElementById('pcSheet');
  if (!sheet) return;
  var msg = document.getElementById('pcMsg');
  var list = document.getElementById('pcList');
  var fileIn = document.getElementById('pcFile');
  var bound = false;
  function setMsg(t) { if (msg) msg.textContent = t || ''; }
  function rawList() { return (window.EV && Array.isArray(window.EV.event.poster_urls)) ? window.EV.event.poster_urls.slice() : []; }
  function close() { sheet.classList.add('hidden'); }
  function syncEv(d) {
    if (d && Array.isArray(d.poster_urls)) window.EV.event.poster_urls = d.poster_urls;
    if (d && 'cover_url' in d) window.EV.event.cover_url = d.cover_url;
  }
  function afterChange(okMsg) {
    if (typeof window.renderHeroMedia === 'function') window.renderHeroMedia();
    renderList();
    setMsg(okMsg || '');
  }
  function doCall(action, extra, okMsg) {
    setMsg('处理中…');
    return window.call(action, extra).then(function (d) {
      syncEv(d);
      afterChange(okMsg);
      return d;
    }).catch(function (e) { renderList(); setMsg('操作失败：' + ((e && e.message) || '请稍后重试')); });
  }
  function renderList() {
    var urls = rawList();
    var cover = (window.EV && window.EV.event) ? window.EV.event.cover_url : null;
    if (!urls.length) {
      list.innerHTML = '<div class="pm-msg">还没有海报。用下方「添加海报」上传第一张；没有海报时，球局页顶部显示 RUKIK Golf 默认封面。</div>';
      return;
    }
    list.innerHTML = urls.map(function (u, i) {
      return '<div class="pm-row" data-pcidx="' + i + '"><img src="' + window.esc(u) + '" alt="海报">' +
        (u === cover ? '<span class="pc-cov">封面</span>' : '') +
        '<span class="pm-cap">第 ' + (i + 1) + ' 张</span>' +
        (u === cover ? '' : '<button type="button" class="pc-act" data-pc="cover">设封面</button>') +
        '<button type="button" class="pc-act" data-pc="up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" class="pc-act" data-pc="down"' + (i === urls.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button type="button" class="pm-del" data-pc="del">删除</button></div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.pm-row'), function (row) {
      var i = Number(row.getAttribute('data-pcidx'));
      var u = rawList()[i];
      if (!u) return;
      var cov = row.querySelector('[data-pc="cover"]');
      if (cov) cov.addEventListener('click', function () { doCall('poster_set_cover', { url: u }, '已设为封面，相册与分享图已同步。'); });
      var up = row.querySelector('[data-pc="up"]');
      if (up) up.addEventListener('click', function () {
        var cur = rawList(); if (i <= 0 || i >= cur.length) return;
        var nx = cur.slice(); var t = nx[i - 1]; nx[i - 1] = nx[i]; nx[i] = t;
        doCall('poster_reorder', { poster_urls: nx }, '顺序已更新。');
      });
      var dn = row.querySelector('[data-pc="down"]');
      if (dn) dn.addEventListener('click', function () {
        var cur = rawList(); if (i < 0 || i >= cur.length - 1) return;
        var nx = cur.slice(); var t = nx[i + 1]; nx[i + 1] = nx[i]; nx[i] = t;
        doCall('poster_reorder', { poster_urls: nx }, '顺序已更新。');
      });
      var del = row.querySelector('[data-pc="del"]');
      if (del) del.addEventListener('click', function () {
        if (!del.classList.contains('confirm')) {
          del.classList.add('confirm'); del.textContent = '确认删除？';
          var cancel = document.createElement('button');
          cancel.type = 'button'; cancel.className = 'pm-cancel'; cancel.textContent = '取消';
          cancel.addEventListener('click', function () { del.classList.remove('confirm'); del.textContent = '删除'; cancel.remove(); });
          del.after(cancel);
          return;
        }
        del.disabled = true; del.textContent = '删除中…';
        doCall('poster_delete', { url: u }, '已删除，相册已同步。');
      });
    });
  }
  function onFile() {
    var f = fileIn.files && fileIn.files[0];
    fileIn.value = '';
    if (!f) return;
    if (!/image\/(png|jpeg|webp)/.test(f.type || '')) { setMsg('仅支持 PNG / JPG / WebP 图片。'); return; }
    if (f.size > 5242880) { setMsg('单张海报不能超过 5MB，请压缩后重试。'); return; }
    if (rawList().length >= 9) { setMsg('海报最多 9 张，请先删除旧海报。'); return; }
    setMsg('上传中…');
    window.call('poster_add', { content_type: f.type }).then(function (d) {
      if (!d || !d.ok || !d.signed_url) throw new Error((d && d.error) || '登记失败');
      syncEv(d);
      return fetch(d.signed_url, { method: 'PUT', headers: { 'Content-Type': f.type }, body: f }).then(function (r) {
        if (!r.ok) {
          return window.call('poster_delete', { url: d.public_url }).then(function (dd) {
            syncEv(dd);
            throw new Error('直传失败（存储返回 ' + r.status + '），已清理登记，请重试');
          });
        }
        afterChange('海报已添加，相册已同步。');
      });
    }).catch(function (e) {
      if (typeof window.renderHeroMedia === 'function') window.renderHeroMedia();
      renderList();
      setMsg('上传失败：' + ((e && e.message) || '请稍后重试'));
    });
  }
  window.openPcSheet = function () {
    if (!bound) {
      bound = true;
      document.getElementById('pcClose').addEventListener('click', close);
      document.getElementById('pcBackdrop').addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.classList.contains('hidden')) close(); });
      fileIn.addEventListener('change', onFile);
    }
    renderList();
    setMsg('');
    sheet.classList.remove('hidden');
  };
})();
</script>

    (linkCode ? '<p class="err">您打开的链接中的邀请码不正确，或已被组织者更新，请核对后重新输入。</p>' : '') +

async function loadAll(useCachePaint) {
  var seq = ++S.loadSeq; /* [线P] 运行序号：后发运行优先，陈旧运行返回后不得再 paint */

       一律等实时数据确认（S.fresh）后才画。旧版用缓存 ev/pc/askCtx/cardData

    S.ev = cached.ev;

    var failStatus = evR && evR.status;
    if (failStatus === 404) { app.innerHTML = errCardHtml('球局不存在或链接已失效。'); bindRetry(); return; }
    if (failStatus === 403) { renderForbiddenGuide(); return; }
    /* [线Z55] 实时确认失败＝显式失败态：有缓存头也只显示赛事头＋错误，
       绝不拿缓存画状态（故障不能伪装成无数据/旧数据） */
    if (!S.ev) { app.innerHTML = errCardHtml('赛事信息加载失败（网络异常，已自动重试多次）。请检查网络后重新加载。'); }
    else { app.innerHTML = evMetaHtml() + errCardHtml('赛事最新状态加载失败（网络异常，已自动重试多次）。为避免显示过期信息，这里不展示缓存状态，请重新加载。'); }

  /* [ONEPAGE 20261114] 分享卡片由赛事页 applyShare 统一装配，本模块不重复处理 */
  if (!S.session) { paint(); return; }

  if (linkCode && S.ev.event.kind === 'casual' && !S.ev.my_player && !S.autoJoinTried) {
    S.autoJoinTried = true;
    var sessU = (S.session && S.session.user) || {};
    var jn = await casualJoin({ event_id: eventId, invite_code: linkCode, display_name: (sessU.user_metadata || {}).display_name || sessU.email || undefined });
    if (seq !== S.loadSeq) return;
    if (jn && jn.ok) { loadAll(false); /* [REG-LAND 20261114] 加入成功直达逐洞记分模块（同 paintRegister 口径） */ [600, 1600].forEach(function (ms) { setTimeout(function () { var sc = document.getElementById('scoreSec'); if (sc) sc.scrollIntoView(); }, ms); }); return; }
    S.autoJoinErr = joinErrText(jn);
  }
  var rs = await Promise.all([
    golfApiRetry('player_card', { event_id: eventId }, true).catch(function () { return null; }),
    golfApiRetry('ask_context', { event_id: eventId }, true).catch(function () { return null; }),
  ]);
  if (seq !== S.loadSeq) return;
  if (rs[0] && rs[0].ok) { S.pc = rs[0].data.player_card; S.freshPc = true; }
  else if (rs[0] && rs[0].status === 404) { S.pc = null; S.freshPc = true; }
  if (rs[1] && rs[1].ok) { S.askCtx = rs[1].data.ask_context; S.freshAsk = true; }
  cacheSet({ pc: S.pc, askCtx: S.askCtx });
  if (!S.freshPc || !S.freshAsk) {
    /* 个人参赛数据没拿到：显式失败，禁止用缓存/默认值继续画状态机 */
    app.innerHTML = evMetaHtml() + errCardHtml('您的参赛信息加载失败（网络异常，已自动重试多次）。为避免显示错误状态，请重新加载。');
    bindRetry();
    return;
  }
  var card = myCard();
  if (card) {
    /* [线Z55] 跨会话 cardData 复用必须过版本校验：缓存 cardMeta 与实时
       ask_context 中同卡 version/updated_at 完全一致才可作秒开占位，
       不一致即弃缓存等实时返回；实时返回一到立即覆盖（cardStale 标记）。 */
    var meta = cached && cached.cardMeta;
    var live = (S.askCtx.my_scorecards || []).filter(function (c) { return c.id === card.id; })[0];
    if (cached && cached.cardData && meta && live && meta.id === card.id && meta.version === live.version && meta.updated_at === live.updated_at && (!S.cardData || S.cardData.scorecard.id !== card.id)) {
      S.cardData = cached.cardData; S.cardStale = true;
    }
    var cd = await golfApiRetry('score_get_card', { scorecard_id: card.id }, true).catch(function () { return null; });
    if (seq !== S.loadSeq) return;
    if (cd && cd.ok) { S.cardData = cd.data; S.cardStale = false; cacheSet({ cardData: S.cardData }); }
    else if (!S.cardData) S.cardLoadFail = true;
    await loadGroup(card, false); /* [线Z39] 同组共享判定：组内个人卡 ≥2 才进共享模式 */
  }
  if (seq !== S.loadSeq) return; /* [线P] 陈旧运行不得重绘 */
  paint();
  flushQueue(); // 进入页面即尝试回放本地待同步记分
}

function paintRecap(card) {
  var pc = S.pc || {};
  var ms = pc.my_score || (card ? { gross_total: card.gross_total, to_par: card.to_par, status: card.status } : null);
  var html = evMetaHtml() + '<div class="card"><h2>🏆 我的成绩</h2>';
  if (ms && ms.gross_total != null) {
    html += '<p class="meta">总杆：<b>' + esc(ms.gross_total) + '</b> 杆' +
      (ms.to_par != null ? '（相对标准杆 ' + (ms.to_par > 0 ? '+' + ms.to_par : ms.to_par) + '）' : '') +
      (ms.net_total != null ? '<br>净杆：' + esc(ms.net_total) + ' 杆' : '') +
      '<br>成绩状态：' + (ms.status === 'locked' || ms.is_final ? '已最终确认（正式成绩）' : '未最终确认，以主办方公布为准') + '</p>';
  } else {
    html += '<p class="muted">本场暂无您的成绩记录。</p>';
  }
  if (pc.course_revisit && pc.course_revisit.line) html += '<div class="preview"><span class="t">球场记忆</span><br>' + esc(pc.course_revisit.line) + '</div>';
  if (S.cardData && S.cardData.holes && (!card || (S.cardData.scorecard && S.cardData.scorecard.id === card.id))) {
    html += '<h3>逐洞成绩</h3><table class="scores"><tr><th>洞</th><th>Par</th><th>杆数</th></tr>' +
      S.cardData.holes.map(function (h) { return '<tr><td>' + h.hole + '</td><td>' + h.par + '</td><td>' + (h.strokes == null ? '—' : '<b>' + h.strokes + '</b>') + '</td></tr>'; }).join('') + '</table>';
  }
  /* [主会话] 完赛回顾态亦保留球童入口（与 paintScoring 同口径；复盘本场成绩是球童核心用法，完赛不得消失） */
  html += myStatusHtml();
  html += '<div class="btnrow"><a class="btn plain" href="caddie.html?e=' + encodeURIComponent(eventId) + '">问 RUKIK Golf</a></div>';
  html += '<div class="btnrow"><a class="btn" href="event.html?e=' + encodeURIComponent(eventId) + '">查看排行榜与赛事回忆</a></div></div>';
  app.innerHTML = html;
}

function holeState(cardId, hole, serverStrokes) {
  if (S.conflicts[hole]) return 'conflict';
  var q = queuedFor(cardId, hole);
  if (q.length) return S.flushing ? 'syncing' : (S.failed[hole] ? 'conflict' : 'pending');
  return serverStrokes == null ? 'none' : 'saved';
}

function effStrokes(cardId, h) {
  var q = queuedFor(cardId, h.hole);
  if (q.length) return q[q.length - 1].strokes;
  return h.strokes;
}

async function loadGroup(card, keepEdits) {
  var r = await golfApi('score_get_group', { scorecard_id: card.id }, true).catch(function () { return null; });
  if (!r || !r.ok || !r.data) { S.grpFail = true; S.group = null; return null; } /* [线Z78] 请求失败/超时：标记失败待提示，禁止静默伪装成单人形态 */
  S.grpFail = false; /* 请求已成功到达：以下为「确实没有同组」的正常单人形态，不出失败提示 */
  if ((r.data.players || []).filter(function (p) { return p.scorecard_id; }).length < 2) { S.group = null; return null; }
  S.group = r.data;
  if (!keepEdits || !Object.keys(S.gDirty).length) {
    if (S.selHole != null) { initGEdits(S.selHole); S.gInitFor = S.selHole; }
  } else {
    (S.group.players || []).forEach(function (p) {
      if (!S.gDirty[p.player_id]) {
        var c = (S.group.cells[p.player_id] || {})[S.selHole];
        S.gEdits[p.player_id] = c ? c.strokes : null;
      }
    });
  }
  return S.group;
}

function grpFailHtml() {
  if (!S.grpFail || S.group) return '';
  return '<div class="syncbar bad">同组记分暂时没加载出来（网络异常），您仍可先记自己的分。<div class="btnrow"><button class="btn plain" type="button" id="grpRetryBtn">重试</button></div></div>';
}

async function grpRetry(card) { await loadGroup(card, false); paint(); }

function initGEdits(hole) {
  S.gEdits = {}; S.gDirty = {};
  if (!S.group) return;
  (S.group.players || []).forEach(function (p) {
    var c = (S.group.cells[p.player_id] || {})[hole];
    S.gEdits[p.player_id] = c ? c.strokes : null;
  });
}

function gOpenHole() {
  if (!S.group) return null;
  var hs = S.group.holes || [];
  for (var i = 0; i < hs.length; i++) {
    var missing = (S.group.players || []).some(function (p) { return p.scorecard_id && !(S.group.cells[p.player_id] || {})[hs[i].hole]; });
    if (missing) return hs[i].hole;
  }
  return hs.length ? hs[hs.length - 1].hole : null;
}

function gRelTxt(v) { return v == null ? '' : v === 0 ? ' · Par' : v < 0 ? ' · ' + v : ' · +' + v; }

function paintGroupScoring(card) {
  var g = S.group;
  var me = (g.players || []).filter(function (p) { return p.is_me; })[0] || null;
  var lockedG = !!me && me.card_status === 'locked';
  if (S.selHole == null) S.selHole = gOpenHole() || 1;
  if (S.gInitFor !== S.selHole) { initGEdits(S.selHole); S.gInitFor = S.selHole; }
  var curH = (g.holes || []).filter(function (h) { return h.hole === S.selHole; })[0] || (g.holes || [])[0];
  if (!curH) return paintScoringFallbackToSingle(card);
  var par = curH.par;
  var cardIds = {};
  (g.players || []).forEach(function (p) { if (p.scorecard_id) cardIds[p.scorecard_id] = 1; });
  var qAll = loadQueue().filter(function (x) { return cardIds[x.scorecard_id]; });
  var syncHtml;
  if (lockedG) syncHtml = '<div class="syncbar good">成绩已锁定（正式成绩），不可再修改。</div>';
  else if (Object.keys(S.gConflicts).length) syncHtml = '<div class="syncbar bad">有成绩冲突等待确认（见下方球员行），不会被静默覆盖。</div>';
  else if (qAll.length) syncHtml = '<div class="syncbar">有 ' + qAll.length + ' 条记分已保存到本机，等待同步（联网后自动同步、全组可见）。</div>';
  else syncHtml = '<div class="syncbar good">全组记分已同步。</div>';

  var rows = (g.players || []).map(function (p) {
    var cell = (g.cells[p.player_id] || {})[curH.hole];
    var v = S.gEdits[p.player_id];
    var flash = S.gFlash[p.player_id];
    var cf = S.gConflicts[p.player_id];
    var sub;
    if (cf) sub = '<span style="color:#dc2626">冲突：服务端现为 ' + (cf.current == null ? '—' : cf.current) + ' 杆，你记的是 ' + cf.mine + ' 杆</span>';
    else if (flash) sub = '<span style="color:#15803d">✓ 已同步 · ' + esc(flash.text) + '</span>';
    else if (v == null && !cell) sub = '待记录';
    else if (S.gDirty[p.player_id]) sub = '<span style="color:#d97706">待保存（已修改，未提交）</span>';
    else sub = '<span style="color:#15803d">已同步' + gRelTxt(cell ? cell.strokes - par : null) + (cell && cell.updated_by_name ? ' · ' + esc(cell.updated_by_name) + ' 记录' : '') + '</span>';
    return '<div class="grow' + (p.is_me ? ' me' : '') + (flash ? ' flash' : '') + '">' +
      '<div class="ginfo"><div class="gname">' + esc(p.display_name) + (p.is_me ? '（我）' : '') + '</div><div class="gsub">' + sub + '</div>' +
      (cf ? '<div class="btnrow"><button class="btn plain" data-gcf="server" data-pid="' + p.player_id + '">用服务端的</button><button class="btn gold" data-gcf="mine" data-pid="' + p.player_id + '">以我的为准</button></div>' : '') +
      '</div>' +
      (lockedG ? '<div class="val" style="font-size:24px;font-weight:800">' + (v == null ? '—' : v) + '</div>'
        : '<div class="stepper small"><button type="button" data-gstep="-1" data-pid="' + p.player_id + '" aria-label="减一杆">−</button><div class="val">' + (v == null ? '—' : v) + '</div><button type="button" data-gstep="1" data-pid="' + p.player_id + '" aria-label="加一杆">＋</button></div>') +
      '</div>';
  }).join('');

  var matrix = '';
  if (S.gMatrix) {
    var head = '<tr><th>球员</th>' + (g.holes || []).map(function (h) { return '<th>' + h.hole + '</th>'; }).join('') + '<th>总杆</th></tr>';
    var parRow = '<tr><td>Par</td>' + (g.holes || []).map(function (h) { return '<td>' + h.par + '</td>'; }).join('') + '<td>' + (g.holes || []).reduce(function (a, h) { return a + (h.par || 0); }, 0) + '</td></tr>';
    var pRows = (g.players || []).map(function (p) {
      return '<tr><td>' + esc(p.display_name) + '</td>' + (g.holes || []).map(function (h) {
        var c = (g.cells[p.player_id] || {})[h.hole];
        return '<td>' + (c ? '<b>' + c.strokes + '</b>' : '·') + '</td>';
      }).join('') + '<td>' + (p.gross_total == null ? '—' : '<b>' + p.gross_total + '</b>') + '</td></tr>';
    }).join('');
    matrix = '<div style="overflow-x:auto;margin-top:10px"><table class="scores mx">' + head + parRow + pRows + '</table></div>';
  }

  var certHtml = '';
  if (!lockedG && me && me.scorecard_id) {
    var totalHoles = (g.holes || []).length;
    if ((me.card_status === 'in_progress' || me.card_status === 'not_started' || me.card_status === 'disputed') && me.thru >= totalHoles && totalHoles) {
      certHtml = '<div class="btnrow"><button class="btn gold" id="gCertSubmit">全部洞已录完 · 提交成绩核对</button></div>';
    }
    if (me.card_status === 'submitted') {
      certHtml = '<div class="btnrow"><button class="btn gold" id="gCertApprove">确认成绩无误</button><button class="btn plain" id="gCertFlag">成绩有异议</button></div>' +
        '<p class="muted" style="margin-top:10px">成绩已提交，等待球员确认 / 裁判核对。</p>';
    }
    if (me.card_status === 'verified') certHtml = '<p class="muted" style="margin-top:10px">成绩已确认，等待主办方锁定为正式成绩。</p>';
  }

  var html = evMetaHtml() +
    '<div class="card"><div class="scorehead"><h2 style="margin:0">⛳ 同组共享记分</h2><span class="tot">第 ' + (g.pairing.group_no == null ? '' : g.pairing.group_no + ' 组 · ') + '第 ' + curH.hole + ' 洞 · Par ' + par + (curH.yards ? ' · ' + curH.yards + ' 码' : '') + '</span></div>' +
    syncHtml +
    '<p class="muted" style="margin-top:8px">同组共享记分卡：任一球员可代记全组，未填显示「待记录」、不会当作 0 杆。</p>' +
    rows +
    (lockedG ? '' : '<div class="btnrow"><button class="btn" id="gSave"' + (S.gSaving ? ' disabled' : '') + '>' + (S.gSaving ? '保存中…' : '保存全组本洞成绩') + '</button></div>') +
    '<div class="btnrow"><button class="btn plain" id="gPrev">上一洞</button><button class="btn plain" id="gNext">下一洞</button><button class="btn plain" id="gMx">' + (S.gMatrix ? '收起总览' : '全组总览（18 洞）') + '</button></div>' +
    matrix + certHtml +
    backToEventBtn('返回赛事页') + '</div>';
  app.innerHTML = html;
  setTailVisible(true); syncTail(); paintStatusSec(); renderShareInvite(); /* [UNIFY 20261114]＋[REMOVE-SESSIONBAR 20261114] 记生态尾部统一渲染：状态卡（statusSec）→分享邀请（casualSec 槽位，两类赛事同位同序；本场进程已整段删除） */
  bindMyStatus();
  app.querySelectorAll('[data-gstep]').forEach(function (el) {
    el.addEventListener('click', function () {
      var pid = el.dataset.pid;
      var p = (g.players || []).filter(function (x) { return x.player_id === pid; })[0];
      var cell = (g.cells[pid] || {})[curH.hole];
      var base = S.gEdits[pid] != null ? S.gEdits[pid] : (cell ? cell.strokes : par);
      var nv = Math.max(1, Math.min(15, base + Number(el.dataset.gstep)));
      S.gEdits[pid] = nv; S.gDirty[pid] = 1;
      paint();
    });
  });
  app.querySelectorAll('[data-gcf]').forEach(function (el) {
    el.addEventListener('click', function () { gResolve(el.dataset.pid, el.dataset.gcf === 'mine'); });
  });
  var sv = document.getElementById('gSave');
  if (sv) sv.addEventListener('click', gSave);
  var pv = document.getElementById('gPrev');
  if (pv) pv.addEventListener('click', function () { if (S.selHole > 1) { S.selHole--; paint(); } });
  var nx = document.getElementById('gNext');
  if (nx) nx.addEventListener('click', function () { if (S.selHole < (g.holes || []).length) { S.selHole++; paint(); } });
  var mx = document.getElementById('gMx');
  if (mx) mx.addEventListener('click', function () { S.gMatrix = !S.gMatrix; paint(); });
  var cs = document.getElementById('gCertSubmit');
  if (cs && me) cs.addEventListener('click', async function () {
    this.disabled = true;
    var r = await golfApi('certify', { scorecard_id: me.scorecard_id, step: 'scorer_submit' }, true);
    if (r.ok) { await loadGroup(card, false); paint(); } else { this.disabled = false; alert('提交失败：' + (r.error || '请稍后重试')); }
  });
  var ca = document.getElementById('gCertApprove');
  if (ca && me) ca.addEventListener('click', async function () {
    this.disabled = true;
    var r = await golfApi('certify', { scorecard_id: me.scorecard_id, step: 'player_verify', decision: 'approve' }, true);
    if (r.ok) { await loadGroup(card, false); paint(); } else { this.disabled = false; alert('确认失败：' + (r.error || '请稍后重试')); }
  });
  var cf2 = document.getElementById('gCertFlag');
  if (cf2 && me) cf2.addEventListener('click', async function () {
    var note = prompt('请简单说明异议（如：第 7 洞应为 4 杆）');
    if (note == null) return;
    this.disabled = true;
    var r = await golfApi('certify', { scorecard_id: me.scorecard_id, step: 'player_verify', decision: 'flag', note: note }, true);
    if (r.ok) { await loadGroup(card, false); paint(); } else { this.disabled = false; alert('提交失败：' + (r.error || '请稍后重试')); }
  });
}

function paintScoringFallbackToSingle(card) { S.group = null; paintScoring(card); }

async function gSave() {
  var g = S.group; if (!g || S.gSaving) return;
  var hole = S.selHole;
  var entries = [], sent = {};
  (g.players || []).forEach(function (p) {
    if (!S.gDirty[p.player_id]) return;
    var v = S.gEdits[p.player_id];
    var cell = (g.cells[p.player_id] || {})[hole];
    entries.push({ player_id: p.player_id, strokes: v == null ? null : v, op_id: newOpId(), base_strokes: cell ? cell.strokes : null });
    if (v != null) sent[p.player_id] = v;
  });
  if (!entries.length) return;
  S.gSaving = true; paint();
  try {
    var r = await golfApi('score_submit_group', { pairing_id: g.pairing.id, hole: hole, entries: entries }, true);
    if (!r.ok) throw new Error(r.error || 'submit failed');
    var myRound = null, myCardId = null;
    (r.data.results || []).forEach(function (res) {
      var pl = (g.players || []).filter(function (x) { return x.player_id === res.player_id; })[0];
      if (res.status === 'saved' || res.status === 'idempotent') {
        delete S.gDirty[res.player_id];
        var cel = res.celebration;
        if (cel && cel.first_confirm) S.gFlash[res.player_id] = { text: cel.strokes + ' 杆 · ' + cel.label, level: cel.level };
        if (pl && pl.is_me) { myCardId = pl.scorecard_id; if (cel && cel.round_complete && cel.round) myRound = cel; }
      } else if (res.status === 'conflict') {
        S.gConflicts[res.player_id] = { current: res.current_strokes != null ? res.current_strokes : null, mine: sent[res.player_id] };
      } else if (res.status === 'error') {
        var e0 = entries.filter(function (x) { return x.player_id === res.player_id; })[0];
        if (pl && pl.scorecard_id && e0 && e0.strokes != null) {
          enqueueScore({ op_id: e0.op_id, scorecard_id: pl.scorecard_id, hole: hole, strokes: e0.strokes, base_strokes: e0.base_strokes, uid: S.session ? S.session.user.id : null });
          delete S.gDirty[res.player_id];
        }
      }
    });
    setTimeout(function () { S.gFlash = {}; if (S.group) paint(); }, 2600);
    var card = myCard();
    if (card) await loadGroup(card, false);
    try { if (window.loadBoardIntoFunc) window.loadBoardIntoFunc(); } catch (e) {} /* [ONEPAGE 20261114] 全组保存后刷新本页排行榜 */
    S.gSaving = false;
    if (myRound && myCardId) {
      var flagKey = 'rukik.golf.roundCelebrated.v1.' + myCardId;
      var seen = null; try { seen = localStorage.getItem(flagKey); } catch (e) {}
      if (!seen) {
        try { localStorage.setItem(flagKey, new Date().toISOString()); } catch (e) {}
        var rd = myRound.round; var relS = rd.to_par;
        var hlHoles = (rd.highlight_holes || []).map(function (x) { return x.hole; });
        var linesR = ['完成球洞 ' + myRound.holes_completed + ' / ' + myRound.holes_total + ' · 本场总杆 ' + rd.gross_total + ' 杆（相对标准杆 ' + (relS === 0 ? '±0' : relS > 0 ? '+' + relS : '' + relS) + '）'];
        if (rd.birdie_plus_count > 0) linesR.push('今天打出 ' + rd.birdie_plus_count + ' 次 Birdie 及更好' + (hlHoles.length ? '，亮点洞：第 ' + hlHoles.join('、') + ' 洞' : '') + '——都已记入你的赛事回忆。');
        linesR.push('今天的每一杆，都值得被记住。');
        linesR.push(rd.status_line);
        paint();
        showCelebration({ title: (g.holes || []).length + ' 洞，精彩完赛！', lines: linesR, round: true, level: 'round' });
        return;
      }
    }
    if (!Object.keys(S.gConflicts).length && hole < (g.holes || []).length) S.selHole = hole + 1;
    paint();
  } catch (e) {
    entries.forEach(function (e0) {
      var pl = (g.players || []).filter(function (x) { return x.player_id === e0.player_id; })[0];
      if (pl && pl.scorecard_id && e0.strokes != null) {
        enqueueScore({ op_id: e0.op_id, scorecard_id: pl.scorecard_id, hole: hole, strokes: e0.strokes, base_strokes: e0.base_strokes, uid: S.session ? S.session.user.id : null });
        delete S.gDirty[e0.player_id];
        S.gEdits[e0.player_id] = e0.strokes;
      }
    });
    S.gInitFor = hole;
    S.gSaving = false;
    paint(); flushQueue();
    alert('网络暂时不可用，本洞成绩已保存到本机，等待同步；联网后会自动同步、全组可见。');
  }
}

async function gResolve(pid, useMine) {
  var cf = S.gConflicts[pid]; var g = S.group;
  if (!cf || !g) return;
  delete S.gConflicts[pid];
  if (!useMine) {
    delete S.gDirty[pid];
    var c0 = myCard(); if (c0) await loadGroup(c0, true);
    paint();
    return;
  }
  try {

function sendShape(item) {

  if (item.force) { o.force = true; o.reason = item.reason; }
  return o;
}

async function loadCardOnly(cardId) {

  if (r && r.ok) { S.cardData = r.data; cacheSet({ cardData: S.cardData }); }
  paint();
}

async function flushQueue() {
  if (S.flushing || !S.session) return;
  var uid = S.session.user.id;
  var q = loadQueue().filter(function (x) { return !x.uid || x.uid === uid; });
  if (!q.length) return;
  S.flushing = true;
  var remain = loadQueue().filter(function (x) { return x.uid && x.uid !== uid; });
  var sentAny = false;
  var confirmedJS = null;
  for (var i = 0; i < q.length; i++) {
    var item = q[i];
    try {
      var r = await golfApi('score_submit', sendShape(item), true);
      if (r.ok) {
        sentAny = true;
        delete S.conflicts[item.hole]; delete S.failed[item.hole];
        if (r.data && r.data.next_hole_preview) S.preview = previewText(r.data.next_hole_preview);
        if (S.justSaved && item.scorecard_id === S.justSaved.scorecard_id && item.hole === S.justSaved.hole && Date.now() - S.justSaved.at < 30000) { confirmedJS = S.justSaved; if (r.data && r.data.celebration) confirmedJS.cel = r.data.celebration; }
      } else if (r.status === 409) {
        S.conflicts[item.hole] = { item: item, current_strokes: r.data.current_strokes != null ? r.data.current_strokes : null };
        remain.push(item);
      } else {
        S.failed[item.hole] = true;
        remain.push(item);
      }
    } catch (e) {
      S.failed[item.hole] = true;
      remain.push(item);
    }
  }
  saveQueue(remain);
  S.flushing = false;
  var card = myCard();
  if (card && S.ev && S.ev.event && S.ev.event.status === 'in_progress') {
    if (sentAny) { var cd = await golfApi('score_get_card', { scorecard_id: card.id }, true).catch(function () { return null; }); if (cd && cd.ok) { S.cardData = cd.data; cacheSet({ cardData: S.cardData }); } }
    paint();
  }
  /* [ONEPAGE 20261114] 本页排行榜联动：本轮有记分被服务端确认即刷新排行榜区（同页呈现，不跳转） */
  try { if (sentAny && window.loadBoardIntoFunc) window.loadBoardIntoFunc(); } catch (e) {}
  /* [线W2] 记分仪式感（与 App 同口径）：仅当用户刚主动保存的那一洞在本轮
     回放中被服务端确认（r.ok）才触发；待同步/失败/409 不庆祝；后台定时
     回放无 justSaved 不触发。整轮打满＝完赛喝彩（一轮一次，localStorage
     持久标记防刷新/重进重播），数据全部取已保存成绩，不编造。 */
  if (confirmedJS) {

    var cd2 = S.cardData;

      var hs = cd2.holes || [];
      var queueLeft = loadQueue().some(function (x) { return x.scorecard_id === card.id; });
      var allPlayed = hs.length > 0 && hs.every(function (h) { return effStrokes(card.id, h) != null; });
      if (allPlayed && !queueLeft) {
        var flagKey = 'rukik.golf.roundCelebrated.v1.' + card.id;
        var seen = null; try { seen = localStorage.getItem(flagKey); } catch (e) {}
        if (!seen) {
          try { localStorage.setItem(flagKey, new Date().toISOString()); } catch (e) {}
          var celR = confirmedJS.cel;
          if (celR && celR.round_complete && celR.round) {
            /* [线Z37] 完赛数据优先服务端真实汇总（总杆/亮点洞/确认状态） */
            var rd = celR.round;
            var relS = rd.to_par;
            var hlHoles = (rd.highlight_holes || []).map(function (x) { return x.hole; });
            var linesR = ['完成球洞 ' + celR.holes_completed + ' / ' + celR.holes_total + ' · 本场总杆 ' + rd.gross_total + ' 杆（相对标准杆 ' + (relS === 0 ? '±0' : relS > 0 ? '+' + relS : '' + relS) + '）'];
            if (rd.birdie_plus_count > 0) linesR.push('今天打出 ' + rd.birdie_plus_count + ' 次 Birdie 及更好' + (hlHoles.length ? '，亮点洞：第 ' + hlHoles.join('、') + ' 洞' : '') + '——都已记入你的赛事回忆。');

        var cel = confirmedJS.cel;

        }
      }
    }
  }
}

    : lv === 'bogey' ? ';border:1.5px solid #9DBEA8' : '';
  var cardCss = 'background:#F7F3EC;border-radius:16px;padding:28px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.18)' + accent;
  var kicker = o.round || lv === 'eagle' || lv === 'albatross' || lv === 'hole_in_one' ? '🏆 RUKIK GOLF' : lv === 'birdie' ? '⭐ RUKIK GOLF' : '⛳ RUKIK GOLF';
  var inner = '<div style="' + cardCss + '"><div style="font-size:12px;letter-spacing:2px;color:#8B857D">' + kicker + '</div>' +
    '<div style="font-size:' + (o.round ? '26px' : '22px') + ';font-weight:700;color:#14304A;margin:8px 0">' + esc(o.title) + '</div>';
  (o.lines || []).forEach(function (ln, i) { inner += '<div style="font-size:' + (i === 0 ? '16px' : '14px') + ';color:#2B2B28;margin-top:4px;line-height:1.55">' + esc(ln) + '</div>'; });
  if (o.round) inner += '<div style="margin-top:14px"><a href="event.html?e=' + encodeURIComponent(eventId) + '" style="display:inline-block;background:#14532D;color:#fff;font-size:15px;font-weight:600;padding:10px 26px;border-radius:10px;text-decoration:none">查看我的成绩</a></div>';
  inner += '<div style="font-size:12px;color:#8B857D;margin-top:10px">' + (o.round ? '轻点空白处关闭' : '轻点任意处继续') + '</div></div>';
  el.innerHTML = inner;
  document.body.appendChild(el);
  requestAnimationFrame(function () { el.style.opacity = '1'; });
  var done = false;
  var close = function () { if (done) return; done = true; el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 180); };
  el.addEventListener('click', close);
  setTimeout(close, reduced ? 1400 : (o.round ? 3200 : 1900));
}

function previewText(p) {
  if (!p) return '';
  var parts = [];
  var nx = p.next_hole || p.next || null;
  if (nx && nx.hole) parts.push('第 ' + nx.hole + ' 洞' + (nx.par ? ' · Par ' + nx.par : '') + (nx.yards ? ' · ' + nx.yards + ' 码' : ''));
  if (p.history_line) parts.push(esc(p.history_line));
  (p.care_lines || []).slice(0, 2).forEach(function (t) { parts.push(esc(t)); });
  (p.safety || []).forEach(function (t) { parts.push('⚠️ ' + esc(t)); });
  /* [线W2] 不渲染 missing[]：其中可能含引擎口径（如天气缓存说明），内部口径禁入用户可见字段 */
  return parts.join('<br>');
}

/* [ONEPAGE 20261114] play 的尾部显隐（球童/地图模块）在本页由静态布局承担，此处只保留
   「记分当前洞 → 逐洞图跟随」联动：洞号未变化时绝不触碰地图（缩放状态不被记分重绘重置）；
   逐洞图与全局图缩放状态各自独立（全局图由赛事页 Leaflet 实例自理，本函数不触碰）。 */
function setTailVisible(show) {}
function syncTail() {
  try {
    if (S.selHole != null && typeof window.setHole === 'function' && window.curHole !== S.selHole) window.setHole(S.selHole);
  } catch (e) {}
}
/* [ONEPAGE 20261114] 最小 toast（记分页同名调用未定义，此处补齐；仅供结束条提示） */
function toast(msg) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.setAttribute('style', 'position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(9,32,22,.94);color:#eafff3;border:1px solid rgba(118,229,173,.5);border-radius:999px;padding:10px 18px;font-size:14px;z-index:400;box-shadow:0 8px 24px rgba(0,0,0,.35)');
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2400);
}

/* [REMOVE-SESSIONBAR 20261114] 「本场进程」模块按用户 15:40 定版整段删除：其「结束本场球局」
   与管理赛事「结束赛事」重复，结束动作唯一入口收敛为管理赛事区「结束赛事」
   （event_update completed，[END-EVENT 20261114]）。原 maybeSessionBar 函数、两处 paint
   调用与 clearCasualBars 清场已一并移除；casualSec 现只承载「分享邀请」。 */

function renderShareInvite() { /* [UNIFY 20261114] 「分享邀请」固定模块位（排行榜与管理赛事之间，casualSec 唯一模块）：由原「邀请好友」卡合并改名（用户 2026-11-14 12:49 定名），快速球局与正式赛事同位同式；呈现口径＝邀请权限（organizer/admin 必见，与邀请卡显隐口径一致）＋赛事 published/in_progress（赛前即可邀请，不限记生态）；内容复用既有邀请机制——活动链接＋邀请码，分享 payload 与原邀请卡「分享」按钮同一生成路径（shareCourseName/shareTitleOf/shareDescOf 点击时现算）；[SHARE-DIRECT 20261114] 19:17 起标题行直达分享、展开层已删（详见函数内注）。本函数按 EV 全权管理 #inviteBar 生命周期（paint 不再清场本卡），由 renderHero（动态层）与记分 paint 尾部共同调用、幂等重建 */
  var sec = document.getElementById('casualSec');
  if (!sec) return;
  var old = document.getElementById('inviteBar');
  var e = (typeof EV !== 'undefined' && EV && EV.event) || null;
  var staff = !!(e && (EV.my_role === 'organizer' || EV.my_role === 'admin'));
  if (!e || !staff || (e.status !== 'published' && e.status !== 'in_progress')) { if (old) old.remove(); return; }
  if (old) old.remove();
  var code = e.invite_code || '';
  /* [线Z60 2026-11-12] 主按钮复制「活动链接」（event.html?e=活动ID，&c= 携带邀请凭据），与原邀请卡同一链接构造 */
  var joinLink = location.origin + '/golf/event.html?e=' + encodeURIComponent(e.id) + (code ? '&c=' + encodeURIComponent(code) : '');
  var bar = document.createElement('div');
  bar.className = 'card manageCard'; /* [INVITE-COLLAPSE 20261114] 与「管理赛事」同款横条：复用 .manageCard .mtoggle 样式 */
  bar.id = 'inviteBar';
  /* [SHARE-DIRECT 20261114] 用户 19:17 定版（覆盖 15:53 折叠式）：「分享邀请」
     不再展开——标题行即分享触发点，点击直接执行原展开层内层「分享」按钮的
     行为（payload 点击时现算、navigator.share 优先、无 share 时复制邀请链接
     并在 invMsg 提示）；展开层 #invBody 与内层「分享」按钮删除，箭头随之去除。
     展开层原其余操作（复制活动链接／casual 的重置邀请码／关闭·开启加入）随
     展开层一并失去本页入口，去向见本线终报盘点，不在此自创替代入口。 */
  bar.innerHTML = '<button type="button" class="mtoggle" id="invShareBar"><span>分享邀请</span></button>' +
    '<div id="invMsg"></div>';
  sec.appendChild(bar);
  var msg = document.getElementById('invMsg');
  function say(html) { if (msg) msg.innerHTML = html; }
  document.getElementById('invShareBar').addEventListener('click', function () {
    /* 原内层「分享」按钮行为原样迁移（[SHARE-FIX 2026-11-14] 口径不变）：
       与页面 applyShare 同一分享口径——标题跟随球场名（有球场＝shareTitleOf
       动态标题；无球场才回落品牌定版），点击时用 shareCourseName/
       shareTitleOf/shareDescOf 现算，url 为带邀请码凭据的 joinLink。 */
    var se = e;
    var scn = (typeof shareCourseName === 'function') ? shareCourseName(se) : '';
    var stitle = scn && typeof shareTitleOf === 'function' ? shareTitleOf(se, scn) : '';
    var sd = stitle ? { title: stitle, text: (typeof shareDescOf === 'function' ? shareDescOf(se.description, scn, se.kind) : ''), url: joinLink } : { title: 'RUKIK Golf · AI高尔夫大师', text: '一键入局，智享挥杆。智能组局、实时记分、实时球场地图，AI球童全程相伴，让每一杆都更精彩。无需下载 App，点击即可加入。', url: joinLink };
    if (navigator.share) navigator.share(sd).catch(function () {});
    else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(joinLink).then(function () { say('<p class="okmsg">邀请链接已复制，去粘贴发送吧。</p>'); });
  });
}

async function casualJoin(body) {
  var r = await golfApi('casual_join', body, true).catch(function () { return null; });
  if (!r) return { ok: false, error: 'network' };
  if (!r.ok) return { ok: false, error: (r.data && (r.data.error || r.data.message)) || 'join_failed', status: r.status };
  var d = r.data || {}, ev = d.event || {};
  return { ok: true, event_id: ev.id || null, member_count: d.member_count };
}

/* ---------- 启动（与记分页同口径：会话确认后才装载，会话变化重装） ---------- */
initAuth(function (s) {
  var wasKnown = S.authKnown;
  var was = !!S.session;
  S.session = s;
  S.authKnown = true; /* 会话状态未确认前禁止渲染登录表单（paint 骨架守卫） */
  if (!wasKnown || !!s !== was) loadAll(false);
  else paint();
});
window.__evScoreReload = function () { loadAll(false); }; /* 供赛事页加入/管理动作后同步刷新 */
(function boot() {
  var s = getSessionSync();
  S.session = s;
  loadAll(true);
})();
setInterval(function () {
  if (document.hidden) return;
  flushQueue();
  /* 共享模式聚焦期同节奏刷新全组视图：他人保存，我这边可见 */
  if (S.group && S.session) { var c = myCard(); if (c) loadGroup(c, true).then(function () { if (S.group) paint(); }); }
}, 15000);
window.addEventListener('online', function () { flushQueue(); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  flushQueue();
  if (!S.group && S.session) { var vc = myCard(); if (vc) loadGroup(vc, false).then(function (g) { if (g) paint(); }); }
});
</script>
