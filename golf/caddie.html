      var code = ej && ej.error;
      if (res.status === 401 || code === 'login_required') { bubble.textContent = '登录状态已过期，请重新登录后再问我。'; setLoggedIn(false); }
      else if (code === 'round_limit') { bubble.textContent = '这轮会话的问题已经比较多了，请回比赛页后重新进入球童会话继续问我。'; }
      else { bubble.textContent = '这次没能连上（' + (code || res.status) + '），请稍后再试一次。'; }
      history.pop(); persist();
      return;
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = '';
    bubble.textContent = '';
    for (;;) {
      var step = await reader.read();
      if (step.done) break;
      buf += dec.decode(step.value, { stream: true });
      var idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        var line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (line.indexOf('data:') !== 0) continue;
        var data = line.slice(5).trim();
        if (!data || data === '[DONE]') continue;
        try {
          var j = JSON.parse(data);
          var c = j && j.choices && j.choices[0] && j.choices[0].delta ? j.choices[0].delta.content : '';
          if (typeof c === 'string' && c) { acc += c; bubble.innerHTML = renderRich(acc); window.scrollTo(0, document.body.scrollHeight); }
        } catch (e) {}
      }
    }
    if (!acc) { bubble.textContent = '这次没有拿到回答，请再问一次。'; history.pop(); persist(); return; }
    bubble.innerHTML = renderRich(acc);
    history.push({ role: 'assistant', content: acc, cid: turnCid });
    persist();
  } catch (e) {
    bubble.textContent = '网络好像不太顺，请稍后再试一次。';
    history.pop(); persist();
  } finally {
    sending = false; sendBtn.disabled = false;
  }
}
sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

loadHistory();
paintHistory();
initAuth(function (s) {
  onAuthGuard(s);
  setLoggedIn(!!s);
  if (s) syncWithServer();
  if (!s) mountLogin(document.getElementById('loginMount'), { onDone: function () { setLoggedIn(true); } });
});
renderAuthBar(document.getElementById('authBar'), { onLogout: function () { setLoggedIn(false); } });
</script>
<script>
/* [球童登录视觉改版 2026-11-12 · 纯增呈现层] 密码可见切换、卡底快捷入口、Apple 登录发起。
 * 不改任何既有认证流程：快捷入口只触发既有邮箱页签；Apple 走 auth.js 新增的
 * signInWithApple（平台已接通的同一 OAuth 通道），返回后仍由既有会话机制恢复。 */
(function () {
  function $(s) { return document.querySelector(s); }
  function enhance() {
    var pw = $('#loginMount input[data-f="pwPass"]');
    if (pw && !pw.dataset.eye) {
      pw.dataset.eye = '1';
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pw-eye'; b.textContent = '\u{1F441}'; b.setAttribute('aria-label', '显示或隐藏密码');
      b.addEventListener('click', function () { pw.type = pw.type === 'password' ? 'text' : 'password'; pw.focus(); });
      pw.parentNode.appendChild(b);
    }
  }
  var lm = document.getElementById('loginMount');
  if (lm) new MutationObserver(enhance).observe(lm, { childList: true, subtree: true });
  enhance();
  function goEmail() { var t = $('#loginMount [data-tab="email"]'); if (t) t.click(); var e = $('#loginMount input[data-f="email"]'); if (e) e.focus(); }
  var f1 = document.getElementById('toEmailOtp'); if (f1) f1.addEventListener('click', goEmail);
  var f2 = document.getElementById('toRegister'); if (f2) f2.addEventListener('click', goEmail);
  var ab = document.getElementById('appleBtn');
  if (ab) ab.addEventListener('click', function () {
    ab.disabled = true;
    var label = ab.querySelector('span'); if (label) label.textContent = '正在跳转到 Apple 登录…';
    import('./auth.js?v=20261113a').then(function (m) { return m.signInWithApple(location.href); }).then(function (r) {
      if (!r || !r.ok) {
        ab.disabled = false; if (label) label.textContent = '使用 Apple 登录';
        var msg = $('#loginMount [data-f="msg"]'); if (msg) msg.textContent = 'Apple 登录暂时不可用，请改用邮箱或手机号登录。';
      }
    });
  });
})();
</script>

<script>
/* [网页小账批次 2026-11-13 · 纯增呈现层] 顶栏用户头像圈补齐：原皮肤 ::before 为
 * 空内容装饰、恒显空白圆。按站内既有口径补齐——会话元数据有头像图则显图，
 * 否则显显示名首字。只读 authBar 既有 DOM 与本地会话记录，不改认证、登录链
 * 与 V2 记忆协议（不读写 caddie 本地历史存储键）。 */
(function () {
  var bar = document.getElementById('authBar');
  if (!bar) return;
  function sessionUser() {
    try {
      var raw = localStorage.getItem('sb-yzgzgtrqrmarfjftgbwt-auth-token');
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (s && s.currentSession) s = s.currentSession;
      return (s && s.user) || null;
    } catch (e) { return null; }
  }
  function paint() {
    var who = bar.querySelector('.rk-who');
    if (!who) return;
    var u = sessionUser();
    var meta = (u && u.user_metadata) || {};
    var av = meta.avatar_url || meta.picture || '';
    if (av && !who.classList.contains('rk-has-av')) {
      who.style.setProperty('--rk-av', 'url("' + String(av).replace(/"/g, '%22') + '")');
      who.classList.add('rk-has-av');
    }
    var nameEl = who.querySelector('.rk-who-name');
    var nm = nameEl ? (nameEl.textContent || '').trim() : '';
    if (nm) {
      var ch = nm.charAt(0);
      if (who.getAttribute('data-initial') !== ch) who.setAttribute('data-initial', ch);
    }
  }
  new MutationObserver(paint).observe(bar, { childList: true, subtree: true, characterData: true });
  paint();
})();
</script>
