/* ---------- 主构建：以给定投影器渲染一洞地形层 ---------- */
function buildArtWithProjector(feats, boundaryGeom, pr, opts) {
  opts = opts || {};

  const byType = t => sorted.filter(f => f.type === t);

  const pin = pinPoint(feats);

  if (boundaryGeom) items.push({ k: 'path', d: pathOf(boundaryGeom, pr), fill: 'none', stroke: PAL.boundary, sw: 1.5, dash: '5 4' });

  byType('rough').forEach(f => { const g = featGeom(f); if (g) items.push({ k: 'path', d: pathOf(g, pr), fill: PAL.rough }); });

  feats.forEach((f, i) => { if (VEG_TYPES[f.type]) treeItems(f, pr, items, i * 7919); });

  byType('water_hazard').forEach(f => {
    const g = featGeom(f);
    if (g) items.push({ k: 'path', d: pathOf(g, pr), fill: 'url(#waterGrad)', stroke: PAL.waterEdge, sw: 1 });
  });

  if (hasFairway) {
    byType('fairway').forEach(f => { const g = featGeom(f); if (g) items.push({ k: 'path', d: pathOf(g, pr), fill: PAL.fairwayBase }); });
    const line = centerlineCoords(feats);
    const ribbons = line ? stripeRibbons(line, pr) : [];
    let dA = '', dB = '';
    ribbons.forEach(r => { if (r.band % 2 === 0) dA += ptsToPath(r.pts); else dB += ptsToPath(r.pts); });
    if (dA) items.push({ k: 'path', d: dA, fill: PAL.stripeA, clip: 'fwClip' });
    if (dB) items.push({ k: 'path', d: dB, fill: PAL.stripeB, clip: 'fwClip' });
    byType('fairway').forEach(f => { const g = featGeom(f); if (g) items.push({ k: 'path', d: pathOf(g, pr), fill: 'none', stroke: PAL.fairwayEdge, sw: 1 }); });
  } else {
    byType('fairway').forEach(f => { const g = featGeom(f); if (g) items.push({ k: 'path', d: pathOf(g, pr), fill: PAL.fairwayBase }); });
  }

  byType('cartpath').forEach(f => { const g = featGeom(f); if (g) items.push({ k: 'path', d: pathOf(g, pr), fill: 'none', stroke: PAL.pathUnder, sw: 4.5, opacity: 0.9 }); });
  byType('cartpath').forEach(f => { const g = featGeom(f); if (g) items.push({ k: 'path', d: pathOf(g, pr), fill: 'none', stroke: PAL.pathOver, sw: 2.6 }); });

  byType('bunker').forEach(f => {
    const g = featGeom(f);
    if (!g) return;
    items.push({ k: 'path', d: pathOf(g, pr), fill: PAL.bunker, stroke: PAL.bunkerEdge, sw: 1.1 });
    const rings = outerRings(g);
    if (rings.length) {
      const c = ringCentroid(rings[0]);
      const cp = pr(c);
      items.push({ k: 'path', d: pathOf(g, pr), fill: PAL.bunkerInner, opacity: 0.85, transform: 'translate(' + cp[0].toFixed(1) + ' ' + cp[1].toFixed(1) + ') scale(0.8) translate(' + (-cp[0]).toFixed(1) + ' ' + (-cp[1]).toFixed(1) + ')' });
    }
  });

  byType('green').forEach(f => {
    const g = featGeom(f);
    if (!g) return;
    items.push({ k: 'path', d: pathOf(g, pr), fill: PAL.greenHalo, stroke: PAL.greenHalo, sw: 7 });
    items.push({ k: 'path', d: pathOf(g, pr), fill: PAL.green, stroke: PAL.greenEdge, sw: 1 });
    const rings = outerRings(g);
    if (rings.length) {
      const c = ringCentroid(rings[0]);
      const cp = pr(c);
      items.push({ k: 'path', d: pathOf(g, pr), fill: PAL.greenInner, transform: 'translate(' + cp[0].toFixed(1) + ' ' + cp[1].toFixed(1) + ') scale(0.78) translate(' + (-cp[0]).toFixed(1) + ' ' + (-cp[1]).toFixed(1) + ')' });
    }
  });

  byType('tee').forEach(f => {
    const g = featGeom(f);
    if (!g) return;
    if (g.type === 'Point') {
      const q = pr(g.coordinates);
      items.push({ k: 'rect', x: q[0] - 6, y: q[1] - 4.5, w: 12, h: 9, rx: 2, fill: PAL.tee, stroke: PAL.teeEdge, sw: 1 });
    } else {
      items.push({ k: 'path', d: pathOf(g, pr), fill: PAL.tee, stroke: PAL.teeEdge, sw: 1.1 });
    }
  });

  if (!hasFairway) {
    const line = centerlineCoords(feats);
    if (line) {
      const lg = { type: 'LineString', coordinates: line };
      items.push({ k: 'path', d: pathOf(lg, pr), fill: 'none', stroke: PAL.centerline, sw: 3.5, linecap: 1 });
    }
  }

  const inset = opts.inset === false ? null : insetModel(feats, pin, opts.frame, pr);
  if (inset) inset.items.forEach(it => items.push(it));

  const markers = opts.markers === false ? [] : distanceMarkers(feats, pr, inset, opts.frame);
  markers.forEach(m => {
    items.push({ k: 'line', x1: m.x - m.nx * 10, y1: m.y - m.ny * 10, x2: m.x + m.nx * 10, y2: m.y + m.ny * 10, stroke: 'rgba(20,83,45,0.35)', sw: 5, linecap: 1 });
    items.push({ k: 'line', x1: m.x - m.nx * 10, y1: m.y - m.ny * 10, x2: m.x + m.nx * 10, y2: m.y + m.ny * 10, stroke: '#ffffff', sw: 2.6, linecap: 1 });
    items.push({ k: 'circle', cx: m.bx, cy: m.by, r: 12, fill: '#ffffff', stroke: PAL.markerRing, sw: 1.6 });
    items.push({ k: 'text', x: m.bx, y: m.by + 0.5, text: String(m.label), size: 11.5, weight: 700, fill: PAL.markerText, anchor: 'middle', dyEm: 0.36 });
  });

  // 旗杆（pin 在放大插图内时由插图内的旗代替）
  let flagPt = pin ? pr(pin) : null;
  if (!flagPt) {
    const greens = byType('green').map(f => featGeom(f)).filter(Boolean);
    if (greens.length) { const r = outerRings(greens[0])[0]; if (r) flagPt = pr(ringCentroid(r)); }
  }
  if (flagPt && !(inset && Math.hypot(flagPt[0] - inset.cx, flagPt[1] - inset.cy) < inset.r + 6)) {
    items.push({ k: 'line', x1: flagPt[0], y1: flagPt[1] + 1, x2: flagPt[0], y2: flagPt[1] - 16, stroke: PAL.pole, sw: 2 });
    items.push({ k: 'poly', pts: flagPt[0] + ',' + (flagPt[1] - 16) + ' ' + flagPt[0] + ',' + (flagPt[1] - 9.5) + ' ' + (flagPt[0] + 11.5) + ',' + (flagPt[1] - 12.75), fill: PAL.flag });
    items.push({ k: 'circle', cx: flagPt[0], cy: flagPt[1], r: 3, fill: '#1f2937', stroke: '#ffffff', sw: 1.3 });
  }

  const clips = [];
  if (hasFairway) {
    let fwD = '';
    byType('fairway').forEach(f => { const g = featGeom(f); if (g) fwD += pathOf(g, pr); });
    if (fwD) clips.push({ id: 'fwClip', d: fwD });
  }
  if (inset) clips.push({ id: inset.clipId, shape: { cx: inset.cx, cy: inset.cy, r: inset.r - 3 } });
  return { items, clips, inset, markers, hasFairway };
}

/* ---------- 发球台码数条 ---------- */

  const rows = [];

    const r = Math.floor(i / perRow);

  const items = [];
  rows.forEach((row, ri) => {
    row.forEach((t, ci) => {
      const x = 14 + ci * (132 + 10), y = FH + 12 + ri * (25 + 7);
      items.push({ k: 'rect', x, y, w: 132, h: 25, rx: 6, fill: PAL.chipBg, stroke: PAL.chipEdge, sw: 1, opacity: 0.94 });
      items.push({ k: 'rect', x: x + 7, y: y + 6.5, w: 12, h: 12, rx: 3, fill: t.color });
      items.push({ k: 'text', x: x + 25, y: y + 12.5, text: String(t.yards), size: 13, weight: 700, fill: PAL.chipYards, anchor: 'start', dyEm: 0.36 });
      items.push({ k: 'text', x: x + 58, y: y + 12.5, text: t.label, size: 9.5, weight: 400, fill: PAL.chipName, anchor: 'start', dyEm: 0.36 });

/* ---------- 整洞构建 ---------- */
/* [地图取景二修20261112] 自适应画布高上下限（画布单位，画布宽恒 620）：
 * 下限保极端长条洞在手机上仍有可读高度；上限防近方形走廊把画布撑得过高。 */

  let x0 = 1 / 0, x1 = -1 / 0, y0 = 1 / 0, y1 = -1 / 0;
  pts.forEach(p => { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; });
  const kx = Math.cos(((y0 + y1) / 2) * Math.PI / 180);

function buildHoleArt(data, opts) {

  // 单洞压成画面中央一小块（旧渲染即如此）；新渲染单洞取景、全场轮廓只在
  // 总览呈现。仅当 boundary 与单洞同尺度（个别数据源的洞级边界）时才画。
  const geoms = [];

  /* [地图取景二修20261112] 画布高按本洞走廊旋转后纵横比自适应（取代
   * [地图打磨20261112] 的 620×620 方框）：方框与旧舞台固定高不匹配，桌面端
   * 画布被 meet 适配压到舞台约一半宽，长条球道在方框里也只是中部一条绿带、
   * 上下大片留白（真机 13:21 复验实证，WH 5/9、FH 1/2 四洞同症）。新口径：
   * 画布宽恒 620（页面以 width:100% 显示＝舞台宽 100%）；画布高取「走廊在
   * 两轴 4% 边距＋PAD 下同时吃满宽高」的高度，再夹入 [FIT_FRAME_H_MIN,
   * FIT_FRAME_H_MAX] 保手机可读。fit 为空（无可取景跨度）时回退旧方框，
   * 后续 makeProjector 旧路径不变。（[地图取景三修20261112] 画布高另把
   * 码数条高计入预算、取景集收窄为打球面本体，详见 FIT_TYPES 与下方
   * stripPre 两处注。） */
  const fit = computeFit(feats);
  /* [地图取景三修20261112] 先算发球台码数条高：码数条与地图同处一幅
   * SVG、同属舞台，画布高预算须把条高计入（frameH 表达式末项），并经
   * frame.stageH 令投影器以舞台总高做纵向居中——否则条越高、带被顶得
   * 越偏上（FH 九台三行条时二修版纵向中心偏移像素实测 −16%）。 */
  const stripPre = teeStrip(opts.teeRows || [], { w: 620, h: 0 });
  let frameH = 620;
  if (fit) {
    const spanX = Math.max(1e-12, fit.rx1 - fit.rx0), spanY = Math.max(1e-12, fit.ry1 - fit.ry0);
    frameH = Math.round(Math.min(FIT_FRAME_H_MAX, Math.max(FIT_FRAME_H_MIN, 2 * PAD + (620 - 2 * PAD) * spanY / spanX + stripPre.stripH)));
  }
  const frame = { w: 620, h: frameH, stageH: frameH + stripPre.stripH };
  const pr = makeFitProjector(feats, frame, fit) || makeProjector(geoms, frame);
  if (!pr) return null;
  const drawBoundary = boundaryGeom && bboxDiag([boundaryGeom]) <= 1.8 * Math.max(1e-12, bboxDiag(geoms)) ? boundaryGeom : null;
  const art = buildArtWithProjector(feats, drawBoundary, pr, Object.assign({}, opts, { frame: frame }));
  const strip = teeStrip(opts.teeRows || [], frame);
  const height = frame.h + strip.stripH;
  const items = [{ k: 'rect', x: 0, y: 0, w: frame.w, h: height, rx: 14, fill: PAL.backdrop, stroke: PAL.backdropEdge, sw: 1 }].concat(art.items, strip.items);
  return { items, clips: art.clips, height, w: frame.w, markers: art.markers, inset: art.inset, hasFairway: art.hasFairway };

   「发送失败」误报同族（服务端成功、响应回程失败）。关键读取失败先自动
   重试；重试期间显示「正在重试」，不画错误终态、更不画成空数据。 */
function sleepMs(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function golfApiRetry(action, body, needAuth) {
  var delays = [700, 1800, 4000];
  var r = null;
  for (var i = 0; i <= delays.length; i++) {
    r = await golfApi(action, body, needAuth).catch(function () { return null; });
    if (r && r.ok) return r;
    if (r && (r.status === 400 || r.status === 401 || r.status === 403 || r.status === 404)) return r; /* 业务性失败不重试 */
    if (i < delays.length) {
      S.loadNote = '网络异常，正在自动重试（第 ' + (i + 2) + ' 次）…';
      paintLoading();
      await sleepMs(delays[i]);
    }
  }
  return r;
}
function paintLoading() {
  var t = esc(S.loadNote || '正在加载最新状态…');
  if (S.ev && S.ev.event) app.innerHTML = evMetaHtml() + '<div class="card"><div class="skel">' + t + '</div></div>';
  else app.innerHTML = '<div class="card"><div class="skel">' + t + '</div></div>';
}
function errCardHtml(msg) {
  return '<div class="card"><div class="err">' + esc(msg) + '</div><div class="btnrow"><button class="btn" id="retryBtn">重新加载</button></div></div>';
}
function bindRetry() {
  var rb = document.getElementById('retryBtn');
  if (rb) rb.addEventListener('click', function () { loadAll(false); });
}
/* [403修复20261112] 403 引导页：私密球局未带有效凭据时的正确出口——成员在此
   登录（登录成功自动重载本局）；持码者可手输邀请码（带 &c= 重开、走 linkAccess
   直通）；其余情况引导向组织者索取最新分享链接。全程不出现「网络异常」字样。
   [线Z63] 已登录但无权者不再重复给登录表单：改显「您尚未加入这场球局」＋
   邀请码加入入口（登录态以 getSessionSync 为准）。 */
function renderForbiddenGuide() {
  var sess = getSessionSync();
  var loggedIn = !!(sess && sess.user);
  app.innerHTML = (S.ev && S.ev.event ? evMetaHtml() : '') +
    '<div class="card"><h2>' + (loggedIn ? '您尚未加入这场球局' : '这是私密球局') + '</h2>' +
    '<p class="muted">' + (loggedIn ? '您已登录，但还不是这场球局的参与者。请输入组织者给您的邀请码加入，或向组织者索取最新分享链接。' : '本球局仅限受邀参加，登录后即可查看并加入。如果您是经分享链接打开的，请确认打开的是组织者最新分享的完整链接——链接不完整、或邀请码已被组织者更新，都会看到本页。') + '</p>' +
    (linkCode ? '<p class="err">您打开的链接中的邀请码不正确，或已被组织者更新，请核对后重新输入。</p>' : '') +
    (loggedIn ? '' : '<div id="forbidLogin"></div>') +
    '<div class="fld"><label>有邀请码？输入后直接打开</label><input id="forbidCode" type="text" placeholder="邀请码" autocomplete="off"></div>' +
    '<div class="err" id="forbidCodeErr"></div>' +
    '<div class="btnrow"><button class="btn" id="forbidCodeBtn" type="button">用邀请码打开</button><button class="btn plain" id="forbidRetry" type="button">重新加载</button></div></div>';
  if (!loggedIn) mountLogin(document.getElementById('forbidLogin'), { onDone: function () { loadAll(false); } });
  var cb = document.getElementById('forbidCodeBtn');

/* ---------- 数据装载 ---------- */
async function loadAll(useCachePaint) {
  var seq = ++S.loadSeq; /* [线P] 运行序号：后发运行优先，陈旧运行返回后不得再 paint */
  S.fresh = false; S.freshPc = false; S.freshAsk = false; S.cardLoadFail = false; S.loadNote = '';
  var cached = cacheGet();
  if (cached && cached.ev) {
    /* [线Z55] 缓存只种「赛事头」供标题与骨架：状态模块（报名/等待/记分）
       一律等实时数据确认（S.fresh）后才画。旧版用缓存 ev/pc/askCtx/cardData
       直接 paint，是首屏闪现「报名参加」错误态与旧球场卡（Par 71）的根因。 */
    S.ev = cached.ev;
    document.getElementById('pageTitle').textContent = (cached.ev.event && cached.ev.event.title) || '我的比赛';
  }
  paint();
  var evBody = { event_id: eventId };
  if (linkCode) evBody.invite_code = linkCode; /* [403修复20261112] 凭据透传（linkAccess），见 linkCode 注 */
  var evR = await golfApiRetry('event_get', evBody, false);
  if (seq !== S.loadSeq) return;
  if (!evR || !evR.ok) {
    /* [403修复20261112] 失败按状态分流、三态不许再混：404＝球局不存在或链接
       已失效；403＝邀请/权限问题（私密球局未带凭据或凭据失效）→ 引导页，
       绝不写「网络异常」；仅 fetch 异常/超时/5xx 等真网络失败才用网络异常文案。 */
    var failStatus = evR && evR.status;
    if (failStatus === 404) { app.innerHTML = errCardHtml('球局不存在或链接已失效。'); bindRetry(); return; }
    if (failStatus === 403) { renderForbiddenGuide(); return; }
    /* [线Z55] 实时确认失败＝显式失败态：有缓存头也只显示赛事头＋错误，
       绝不拿缓存画状态（故障不能伪装成无数据/旧数据） */
    if (!S.ev) { app.innerHTML = errCardHtml('赛事信息加载失败（网络异常，已自动重试多次）。请检查网络后重新加载。'); }
    else { app.innerHTML = evMetaHtml() + errCardHtml('赛事最新状态加载失败（网络异常，已自动重试多次）。为避免显示过期信息，这里不展示缓存状态，请重新加载。'); }
    bindRetry();
    return;
  }
  S.ev = evR.data;
  S.loadedAt = Date.now();
  document.getElementById('pageTitle').textContent = (evR.data.event && evR.data.event.title) || '我的比赛';
  cacheSet({ ev: S.ev });
  S.fresh = true;
  applyPlayShare(); /* [分享修复20261112] 数据确认后刷新分享卡片（og＋微信分享数据） */
  if (!S.session) { paint(); return; }
  /* [匿名邀请完善20261112] 登录后自动加入：持有效邀请码打开 casual 球局、登录
     成功且尚非成员时，自动以邀请码加入一次（与首页 ?join= 自动加入流同口径），
     成功即整页重载落成员视图；失败如实记录、回落报名表单（邀请码已预填）。 */
  if (linkCode && S.ev.event.kind === 'casual' && !S.ev.my_player && !S.autoJoinTried) {
    S.autoJoinTried = true;
    var sessU = (S.session && S.session.user) || {};
    var jn = await casualJoin({ event_id: eventId, invite_code: linkCode, display_name: (sessU.user_metadata || {}).display_name || sessU.email || undefined });
    if (seq !== S.loadSeq) return;
    if (jn && jn.ok) { loadAll(false); return; }
    S.autoJoinErr = joinErrText(jn);
  }
  var rs = await Promise.all([
    golfApiRetry('player_card', { event_id: eventId }, true).catch(function () { return null; }),
    golfApiRetry('ask_context', { event_id: eventId }, true).catch(function () { return null; }),
  ]);
  if (seq !== S.loadSeq) return;
  if (rs[0] && rs[0].ok) { S.pc = rs[0].data.player_card; S.freshPc = true; }
  else if (rs[0] && rs[0].status === 404) { S.pc = null; S.freshPc = true; }
  if (rs[1] && rs[1].ok) { S.askCtx = rs[1].data.ask_context; S.freshAsk = true; }
  cacheSet({ pc: S.pc, askCtx: S.askCtx });
  if (!S.freshPc || !S.freshAsk) {
    /* 个人参赛数据没拿到：显式失败，禁止用缓存/默认值继续画状态机 */
    app.innerHTML = evMetaHtml() + errCardHtml('您的参赛信息加载失败（网络异常，已自动重试多次）。为避免显示错误状态，请重新加载。');
    bindRetry();
    return;
  }
  var card = myCard();
  if (card) {
    /* [线Z55] 跨会话 cardData 复用必须过版本校验：缓存 cardMeta 与实时
       ask_context 中同卡 version/updated_at 完全一致才可作秒开占位，
       不一致即弃缓存等实时返回；实时返回一到立即覆盖（cardStale 标记）。 */
    var meta = cached && cached.cardMeta;
    var live = (S.askCtx.my_scorecards || []).filter(function (c) { return c.id === card.id; })[0];
    if (cached && cached.cardData && meta && live && meta.id === card.id && meta.version === live.version && meta.updated_at === live.updated_at && (!S.cardData || S.cardData.scorecard.id !== card.id)) {
      S.cardData = cached.cardData; S.cardStale = true;
    }
    var cd = await golfApiRetry('score_get_card', { scorecard_id: card.id }, true).catch(function () { return null; });
    if (seq !== S.loadSeq) return;
    if (cd && cd.ok) { S.cardData = cd.data; S.cardStale = false; cacheSet({ cardData: S.cardData }); }
    else if (!S.cardData) S.cardLoadFail = true;
    await loadGroup(card, false); /* [线Z39] 同组共享判定：组内个人卡 ≥2 才进共享模式 */
  }
  if (seq !== S.loadSeq) return; /* [线P] 陈旧运行不得重绘 */
  paint();
  flushQueue(); // 进入页面即尝试回放本地待同步记分
}

/* ---------- 通用小块 ---------- */

  return '<div class="card"><h2>' + esc(e.title) + '</h2><div class="meta">' +

    (c.name ? '📍 ' + esc(c.name) + (c.address ? '，' + esc(c.address) : '') + (c.city ? '，' + esc(c.city) : '') + '<br>' : '') +
    '🏌️ ' + pill + (S.ev.my_role ? ' · 您是本场' + esc(S.ev.my_role) : '') +

  return '<div class="btnrow"><a class="btn plain" href="event.html?e=' + encodeURIComponent(eventId) + (linkCode ? '&c=' + encodeURIComponent(linkCode) : '') + '">' + esc(label || '返回赛事页') + '</a></div>';

/* ---------- 状态机渲染 ---------- */
function paint() {
  if (!S.ev || !S.ev.event) { app.innerHTML = '<div class="skel">正在加载赛事信息…</div>'; return; }
  /* [线Z55] 实时状态未确认（S.fresh=false）前只出骨架：禁止用缓存/默认值
     画报名、等待、记分等状态模块（首屏错误中间态根因修复） */
  if (!S.fresh) { paintLoading(); return; }
  setTailVisible(false); /* [线Z44] 尾部两模块只在记生态呈现，其余状态一律隐藏 */
  var e = S.ev.event;
  /* [线P] 会话状态未确认（auth.js 尚在恢复本地会话）时只显示赛事信息＋确认中骨架，
     绝不抢先渲染登录表单——已登录用户先看到登录表单正是走查投诉的根因之一 */
  if (!S.session && !S.authKnown) { app.innerHTML = evMetaHtml() + '<div class="card"><div class="skel">正在确认登录状态…</div></div>'; return; }
  if (!S.session) return paintGuest();
  var mine = S.ev.my_player;
  var reg = S.ev.my_registration;
  if (!mine) return paintRegister();
  if (reg && reg.status === 'waitlisted') {
    app.innerHTML = evMetaHtml() + '<div class="card"><h2>报名候补中</h2><p class="muted">本场名额已满，您已进入候补名单。有名额释放时主办方会与您联系。</p>' + backToEventBtn() + '</div>';
    return;
  }
  if (reg && reg.status === 'cancelled') {
    app.innerHTML = evMetaHtml() + '<div class="card"><h2>报名已取消</h2><p class="muted">您在本场的报名已取消。如需重新报名，请联系主办方。</p>' + backToEventBtn() + '</div>';
    return;
  }
  /* [线P] 报名审核流球员态（用户定版：报名先待审核、通过后才生效） */
  if (reg && reg.status === 'pending') {
    app.innerHTML = evMetaHtml() + '<div class="card"><h2>报名待主办方审核</h2>' +
      '<p class="meta">球员：' + esc((S.ev.my_player || {}).display_name || '') + '<br>状态：<b>报名已提交，等待主办方审核</b>。</p>' +
      '<p class="muted">审核通过后报名即正式生效，这里会继续显示分组与记分入口；未通过会在此如实显示。可稍后刷新查看审核结果。</p>' +
      '<div class="btnrow"><button class="btn plain" id="refreshBtn">刷新状态</button></div>' + backToEventBtn() + '</div>';
    document.getElementById('refreshBtn').addEventListener('click', function () { loadAll(false); });
    return;
  }
  if (reg && reg.status === 'rejected') {
    app.innerHTML = evMetaHtml() + '<div class="card"><h2>报名未通过审核</h2>' +
      '<p class="muted">主办方未通过您本场的报名，本次报名不生效。如有疑问，请联系主办方。</p>' + backToEventBtn() + '</div>';
    return;
  }
  var card = myCard();
  if (e.status === 'completed') return paintRecap(card);
  if (e.status === 'in_progress') {
    if (card) {
      /* [线Z55] 记分卡实时加载失败且无可用数据：显式失败，禁止静默画空网格 */
      if (S.cardLoadFail) { app.innerHTML = evMetaHtml() + errCardHtml('记分卡加载失败（网络异常，已自动重试多次）。您的成绩数据不会丢失，请重新加载。'); bindRetry(); return; }
      return paintScoring(card);
    }
    return paintNoCard();
  }
  /* published / draft：未开赛 */
  if (S.pc && S.pc.group_no) return paintPreStart();
  return paintWaitingGroup();
}

/* ---------- 记分视图 ---------- */
function holeState(cardId, hole, serverStrokes) {
  if (S.conflicts[hole]) return 'conflict';
  var q = queuedFor(cardId, hole);
  if (q.length) return S.flushing ? 'syncing' : (S.failed[hole] ? 'conflict' : 'pending');
  return serverStrokes == null ? 'none' : 'saved';
}
function effStrokes(cardId, h) {
  var q = queuedFor(cardId, h.hole);
  if (q.length) return q[q.length - 1].strokes;
  return h.strokes;
}

/* ---------- [线Z39] 同组共享记分卡（与 App 同口径） ----------
   同组任一 registered 球员可代记全组：group 视图＝pairing 全组球员
   ×18 洞矩阵（服务端唯一数据源）；整组提交逐人走同一 op_id 幂等/
   409/审计/celebration 口径；未填不提交、不当 0 杆；断网整组条目逐人
   入既有本机队列、回放逐人对账。 */
async function loadGroup(card, keepEdits) {
  var r = await golfApi('score_get_group', { scorecard_id: card.id }, true).catch(function () { return null; });
  if (!r || !r.ok || !r.data) { S.grpFail = true; S.group = null; return null; } /* [线Z78] 请求失败/超时：标记失败待提示，禁止静默伪装成单人形态 */
  S.grpFail = false; /* 请求已成功到达：以下为「确实没有同组」的正常单人形态，不出失败提示 */
  if ((r.data.players || []).filter(function (p) { return p.scorecard_id; }).length < 2) { S.group = null; return null; }
  S.group = r.data;
  if (!keepEdits || !Object.keys(S.gDirty).length) {
    if (S.selHole != null) { initGEdits(S.selHole); S.gInitFor = S.selHole; }
  } else {
    (S.group.players || []).forEach(function (p) {
      if (!S.gDirty[p.player_id]) {
        var c = (S.group.cells[p.player_id] || {})[S.selHole];
        S.gEdits[p.player_id] = c ? c.strokes : null;
      }
    });
  }
  return S.group;
}
/* [线Z78] 同组记分加载失败提示：单人记分照常可用，重试成功即切回同组视图 */
function grpFailHtml() {
  if (!S.grpFail || S.group) return '';
  return '<div class="syncbar bad">同组记分暂时没加载出来（网络异常），您仍可先记自己的分。<div class="btnrow"><button class="btn plain" type="button" id="grpRetryBtn">重试</button></div></div>';
}
async function grpRetry(card) { await loadGroup(card, false); paint(); }
function initGEdits(hole) {
  S.gEdits = {}; S.gDirty = {};
  if (!S.group) return;
  (S.group.players || []).forEach(function (p) {
    var c = (S.group.cells[p.player_id] || {})[hole];
    S.gEdits[p.player_id] = c ? c.strokes : null;
  });
}
function gOpenHole() {
  if (!S.group) return null;
  var hs = S.group.holes || [];
  for (var i = 0; i < hs.length; i++) {
    var missing = (S.group.players || []).some(function (p) { return p.scorecard_id && !(S.group.cells[p.player_id] || {})[hs[i].hole]; });
    if (missing) return hs[i].hole;
  }
  return hs.length ? hs[hs.length - 1].hole : null;
}
function gRelTxt(v) { return v == null ? '' : v === 0 ? ' · Par' : v < 0 ? ' · ' + v : ' · +' + v; }

  var curH = (g.holes || []).filter(function (h) { return h.hole === S.selHole; })[0] || (g.holes || [])[0];

async function gSave() {
  var g = S.group; if (!g || S.gSaving) return;
  var hole = S.selHole;
  var entries = [], sent = {};
  (g.players || []).forEach(function (p) {
    if (!S.gDirty[p.player_id]) return;
    var v = S.gEdits[p.player_id];
    var cell = (g.cells[p.player_id] || {})[hole];
    entries.push({ player_id: p.player_id, strokes: v == null ? null : v, op_id: newOpId(), base_strokes: cell ? cell.strokes : null });
    if (v != null) sent[p.player_id] = v;
  });
  if (!entries.length) return;
  S.gSaving = true; paint();
  try {
    var r = await golfApi('score_submit_group', { pairing_id: g.pairing.id, hole: hole, entries: entries }, true);
    if (!r.ok) throw new Error(r.error || 'submit failed');
    var myRound = null, myCardId = null;
    (r.data.results || []).forEach(function (res) {
      var pl = (g.players || []).filter(function (x) { return x.player_id === res.player_id; })[0];

        if (pl && pl.is_me) { myCardId = pl.scorecard_id; if (cel && cel.round_complete && cel.round) myRound = cel; }
      } else if (res.status === 'conflict') {
        S.gConflicts[res.player_id] = { current: res.current_strokes != null ? res.current_strokes : null, mine: sent[res.player_id] };
      } else if (res.status === 'error') {
        var e0 = entries.filter(function (x) { return x.player_id === res.player_id; })[0];
        if (pl && pl.scorecard_id && e0 && e0.strokes != null) {
          enqueueScore({ op_id: e0.op_id, scorecard_id: pl.scorecard_id, hole: hole, strokes: e0.strokes, base_strokes: e0.base_strokes, uid: S.session ? S.session.user.id : null });
          delete S.gDirty[res.player_id];

    });
    setTimeout(function () { S.gFlash = {}; if (S.group) paint(); }, 2600);
    var card = myCard();
    if (card) await loadGroup(card, false);
    S.gSaving = false;
    if (myRound && myCardId) {
      var flagKey = 'rukik.golf.roundCelebrated.v1.' + myCardId;
      var seen = null; try { seen = localStorage.getItem(flagKey); } catch (e) {}
      if (!seen) {
        try { localStorage.setItem(flagKey, new Date().toISOString()); } catch (e) {}
        var rd = myRound.round; var relS = rd.to_par;
        var hlHoles = (rd.highlight_holes || []).map(function (x) { return x.hole; });
        var linesR = ['完成球洞 ' + myRound.holes_completed + ' / ' + myRound.holes_total + ' · 本场总杆 ' + rd.gross_total + ' 杆（相对标准杆 ' + (relS === 0 ? '±0' : relS > 0 ? '+' + relS : '' + relS) + '）'];
        if (rd.birdie_plus_count > 0) linesR.push('今天打出 ' + rd.birdie_plus_count + ' 次 Birdie 及更好' + (hlHoles.length ? '，亮点洞：第 ' + hlHoles.join('、') + ' 洞' : '') + '——都已记入你的赛事回忆。');
        linesR.push('今天的每一杆，都值得被记住。');

    entries.forEach(function (e0) {

/* 队列回放：与 App flushScoreQueue 同语义（成功移除、409 留队待确认、失败留队重试） */
async function flushQueue() {
  if (S.flushing || !S.session) return;
  var uid = S.session.user.id;
  var q = loadQueue().filter(function (x) { return !x.uid || x.uid === uid; });
  if (!q.length) return;
  S.flushing = true;
  var remain = loadQueue().filter(function (x) { return x.uid && x.uid !== uid; });
  var sentAny = false;
  var confirmedJS = null;
  for (var i = 0; i < q.length; i++) {
    var item = q[i];
    try {
      var r = await golfApi('score_submit', sendShape(item), true);
      if (r.ok) {
        sentAny = true;
        delete S.conflicts[item.hole]; delete S.failed[item.hole];
        if (r.data && r.data.next_hole_preview) S.preview = previewText(r.data.next_hole_preview);
        if (S.justSaved && item.scorecard_id === S.justSaved.scorecard_id && item.hole === S.justSaved.hole && Date.now() - S.justSaved.at < 30000) { confirmedJS = S.justSaved; if (r.data && r.data.celebration) confirmedJS.cel = r.data.celebration; }
      } else if (r.status === 409) {
        S.conflicts[item.hole] = { item: item, current_strokes: r.data.current_strokes != null ? r.data.current_strokes : null };
        remain.push(item);
      } else {
        S.failed[item.hole] = true;
        remain.push(item);
      }
    } catch (e) {
      S.failed[item.hole] = true;
      remain.push(item);
    }
  }
  saveQueue(remain);
  S.flushing = false;
  var card = myCard();
  if (card && S.ev && S.ev.event && S.ev.event.status === 'in_progress') {
    if (sentAny) { var cd = await golfApi('score_get_card', { scorecard_id: card.id }, true).catch(function () { return null; }); if (cd && cd.ok) { S.cardData = cd.data; cacheSet({ cardData: S.cardData }); } }
    paint();
  }
  /* [线W2] 记分仪式感（与 App 同口径）：仅当用户刚主动保存的那一洞在本轮
     回放中被服务端确认（r.ok）才触发；待同步/失败/409 不庆祝；后台定时
     回放无 justSaved 不触发。整轮打满＝完赛喝彩（一轮一次，localStorage
     持久标记防刷新/重进重播），数据全部取已保存成绩，不编造。 */
  if (confirmedJS) {
    S.justSaved = null;
    var cd2 = S.cardData;
    if (card && cd2 && cd2.scorecard && cd2.scorecard.id === card.id) {
      var hs = cd2.holes || [];
      var queueLeft = loadQueue().some(function (x) { return x.scorecard_id === card.id; });
      var allPlayed = hs.length > 0 && hs.every(function (h) { return effStrokes(card.id, h) != null; });
      if (allPlayed && !queueLeft) {
        var flagKey = 'rukik.golf.roundCelebrated.v1.' + card.id;
        var seen = null; try { seen = localStorage.getItem(flagKey); } catch (e) {}
        if (!seen) {
          try { localStorage.setItem(flagKey, new Date().toISOString()); } catch (e) {}
          var celR = confirmedJS.cel;
          if (celR && celR.round_complete && celR.round) {
            /* [线Z37] 完赛数据优先服务端真实汇总（总杆/亮点洞/确认状态） */
            var rd = celR.round;
            var relS = rd.to_par;
            var hlHoles = (rd.highlight_holes || []).map(function (x) { return x.hole; });

  (o.lines || []).forEach(function (ln, i) { inner += '<div style="font-size:' + (i === 0 ? '16px' : '14px') + ';color:#2B2B28;margin-top:4px;line-height:1.55">' + esc(ln) + '</div>'; });

/* [地图打磨20261112] 总览徽章避让（缺陷：默认缩放下洞号成簇重叠）：
 * 徽章 24px、相邻洞旗杆位在 fitBounds 缩放下常不足 24px 间距（Western
 * Hills 北侧 13/14/16、南侧 1/2/6/7 实测互相遮挡）。绘制后按当前缩放把
 * 徽章投影到容器像素做松弛推挤：仅平移徽章本身（上限 20px，真位由底图
 * 上的旗杆圆点对应），最小间距 27px 使数字可辨认；缩放结束重算。 */
function ovBadgeEl(k) {
  var mk = ovMarkers[k];
  if (!mk || !mk.getElement) return null;
  var el = mk.getElement();
  return el ? el.querySelector('.hole-badge') : null;
}
function ovDeclutter() {
  if (!ovMap) return;
  var keys = Object.keys(ovMarkers);
  if (keys.length < 2) return;
  var base = {}, off = {};
  keys.forEach(function (k) {
    try { base[k] = ovMap.latLngToContainerPoint(ovMarkers[k].getLatLng()); } catch (e) { base[k] = null; }
    off[k] = { x: 0, y: 0 };
  });
  var MIN = 27, MAXOFF = 20;
  for (var it = 0; it < 80; it++) {
    var moved = false;
    for (var i = 0; i < keys.length; i++) {
      for (var j = i + 1; j < keys.length; j++) {
        var a = keys[i], b = keys[j];
        if (!base[a] || !base[b]) continue;
        var dx = (base[b].x + off[b].x) - (base[a].x + off[a].x);
        var dy = (base[b].y + off[b].y) - (base[a].y + off[a].y);
        var d = Math.hypot(dx, dy);
        if (d >= MIN) continue;
        if (d < 0.01) { var ang = ((Number(a) * 47 + Number(b) * 89) % 360) * Math.PI / 180; dx = Math.cos(ang); dy = Math.sin(ang); d = 1; }
        var push = (MIN - d) / 2 + 0.5, ux = dx / d, uy = dy / d;
        off[a].x -= ux * push; off[a].y -= uy * push;
        off[b].x += ux * push; off[b].y += uy * push;
        [a, b].forEach(function (k) {
          var m = Math.hypot(off[k].x, off[k].y);
          if (m > MAXOFF) { off[k].x *= MAXOFF / m; off[k].y *= MAXOFF / m; }
        });
        moved = true;
      }
    }
    if (!moved) break;
  }
  keys.forEach(function (k) {
    var badge = ovBadgeEl(k); if (!badge) return;
    var o = off[k];
    badge.style.transform = (Math.abs(o.x) > 0.5 || Math.abs(o.y) > 0.5)
      ? 'translate(' + o.x.toFixed(1) + 'px,' + o.y.toFixed(1) + 'px)' : '';
  });
}
function ovDeclutterSoon() {
  if (!ovMap) return;
  requestAnimationFrame(function () { setTimeout(ovDeclutter, 60); });
  ovMap.once('moveend', function () { setTimeout(ovDeclutter, 30); });
}

function ovLocate() {
  if (!ovMap || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function (p) {

    ovMap.panTo(ll);

}

/* [地图升级20261112] 地图双视图页签/全屏/定位按钮（静态元素，一次绑定） */
(function () {
  var tH = document.getElementById('mapTabHole'); if (tH) tH.addEventListener('click', function () { mapView = 'hole'; renderMapStage(); });
  var tA = document.getElementById('mapTabAll'); if (tA) tA.addEventListener('click', function () { mapView = 'all'; renderMapStage(); });
  var fsb = document.getElementById('mapFsBtn'); if (fsb) fsb.addEventListener('click', openPlayHd);
  var lb = document.getElementById('mapLocBtn'); if (lb) lb.addEventListener('click', ovLocate);
  pzBind();
  var hc = document.getElementById('playHdClose'); if (hc) hc.addEventListener('click', closePlayHd);
  var ov = document.getElementById('playHd'); if (ov) ov.addEventListener('click', function (e) { if (e.target === ov) closePlayHd(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePlayHd(); });
})();

/* ---------- 启动 ---------- */
initAuth(function (s) {
  var wasKnown = S.authKnown;
  var was = !!S.session;
  S.session = s;
  S.authKnown = true; /* [线P] 首次回调即确认会话状态（有/无），之后才允许渲染登录表单 */
  if (HOME_MODE) { paintHome(); return; } /* [线Z44] H5 入口：会话变化只刷新入口页 */
  if (!wasKnown || !!s !== was) loadAll(false);
  else paint();
});
renderAuthBar(document.getElementById('authBar'), { onLogout: function () { loadAll(false); } });
(function boot() {
  var s = getSessionSync();
  S.session = s;
  if (HOME_MODE) { /* [线Z44] H5 入口：不装载默认赛事，直接呈现三入口 */
    document.getElementById('pageTitle').textContent = 'RUKIK Golf';
    document.title = 'RUKIK Golf · 一页球局';
    paintHome();
    return;
  }
  cdInit();
  loadAll(true);
})();
setInterval(function () {
  if (document.hidden) return;
  flushQueue();
  /* [线Z39] 共享模式聚焦期同节奏刷新全组视图：他人保存，我这边可见 */
  if (S.group && S.session) { var c = myCard(); if (c) loadGroup(c, true).then(function () { if (S.group) paint(); }); }
}, 15000);
window.addEventListener('online', function () { flushQueue(); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  flushQueue();
  /* [线Z78] 回到前台且当前仍是单人形态时自动补拉一次同组记分：覆盖朋友晚加入、页面早已打开的场景；拉到即切同组视图 */
  if (!S.group && S.session && !HOME_MODE) { var vc = myCard(); if (vc) loadGroup(vc, false).then(function (g) { if (g) paint(); }); }
});
</script>
</body>
</html>
