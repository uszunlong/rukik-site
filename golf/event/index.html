<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛事详情 · RUKIK Golf</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f6f7f5;color:#1c2a1e}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 6px;font-weight:700;letter-spacing:.06em;color:#14532d;font-size:13px}
  .pill{background:#16a34a;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:0}
  .pill.pre{background:#64748b}.pill.post{background:#7c3aed}
  h1{font-size:24px;margin:8px 0 4px;line-height:1.3}
  .sub{color:#5b6b5e;font-size:13px}
  .hero{margin-top:12px}
  .hero img.poster{width:100%;height:auto;display:block;border-radius:16px}
  .hero .ph{border-radius:16px;background:linear-gradient(135deg,#14532d,#16a34a);color:#e7f6ec;min-height:150px;display:flex;align-items:center;justify-content:center;font-size:15px;padding:16px;text-align:center}
  .card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 4px rgba(20,60,35,.06)}
  .card h2{font-size:16px;margin:0 0 10px;color:#14532d}
  .meta{font-size:14px;line-height:1.9}
  .desc{font-size:14px;line-height:1.8;color:#33463a;white-space:pre-wrap}
  .stats{display:flex;gap:10px;margin-top:14px}
  .stat{flex:1;background:#eef4ef;border-radius:14px;padding:10px 6px;text-align:center}
  .stat b{display:block;font-size:19px;color:#14532d}
  .stat span{font-size:12px;color:#5b6b5e}
  .org{display:flex;gap:12px;padding:10px 0;border-top:1px solid #eef2ee;align-items:flex-start}
  .org:first-of-type{border-top:none}
  .org img{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#f2f5f2}
  .org .t{font-size:12px;color:#16a34a;font-weight:700}
  .org .n{font-size:15px;font-weight:600}
  .org .i{font-size:13px;color:#5b6b5e;line-height:1.6}
  .org a{color:#14532d;text-decoration:none}
  .skl{border-radius:12px;background:linear-gradient(90deg,#e8eee9 25%,#f4f7f4 50%,#e8eee9 75%);background-size:200% 100%;animation:sk 1.2s infinite;min-height:74px}
  @keyframes sk{to{background-position:-200% 0}}
  .err{background:#fdf3f3;border:1px solid #f3d2d2;color:#8c2f2f;border-radius:12px;padding:12px;font-size:14px}
  .empty{color:#7a8a7d;font-size:14px;padding:8px 0}
  button.retry{margin-top:8px;background:#14532d;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:14px;cursor:pointer}
  .holebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
  .holebar button{border:1px solid #cfe0d2;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
  .holebar button.on{background:#14532d;color:#fff;border-color:#14532d}
  .dots{display:flex;gap:4px;flex-wrap:wrap}
  .dots button{width:30px;height:30px;border-radius:50%;padding:0;font-size:12px}
  select{font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid #cfe0d2;background:#fff}
  svg.map{width:100%;height:auto;background:#eef4ef;border-radius:14px;display:block}
  .holeinfo{font-size:14px;line-height:1.9}
  .suspect{color:#b45309;font-size:12px;background:#fdf6e3;border-radius:6px;padding:1px 6px;margin-left:6px}
  .src{font-size:12px;color:#7a8a7d;line-height:1.7;margin-top:8px}
  .tips{font-size:14px;line-height:1.9}
  .tips li{margin:2px 0}
  table.board{width:100%;border-collapse:collapse;font-size:14px}
  table.board td,table.board th{padding:7px 4px;border-bottom:1px solid #eef2ee;text-align:left}
  .feed{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .feed figure{margin:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(20,60,35,.06)}
  .feed img{width:100%;height:150px;object-fit:cover;display:block}
  .feed figcaption{padding:8px 10px;font-size:13px}
  .feed .m{color:#7a8a7d;font-size:12px}
  .cta{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid #e3eae4;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .cta a{display:block;max-width:760px;margin:0 auto;background:#14532d;color:#fff;text-align:center;border-radius:14px;padding:14px;font-size:16px;font-weight:700;text-decoration:none}
  .cta a.live{background:#16a34a}.cta a.post{background:#7c3aed}
  .funcrow{display:flex;gap:10px;flex-wrap:wrap}
  .funcrow a{flex:1;min-width:140px;text-align:center;background:#eef4ef;color:#14532d;border-radius:12px;padding:12px;font-size:14px;font-weight:600;text-decoration:none}
  iframe.osm{width:100%;height:230px;border:0;border-radius:14px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><span>RUKIK GOLF · LIVE</span><span class="pill pre" id="statePill">加载中</span></div>
  <div id="heroSec"><div class="skl"></div></div>
  <div id="orgSec"></div>
  <div id="mapSec"></div>
  <div id="careSec"></div>
  <div id="funcSec"></div>
  <div id="liveSec"></div>
  <p class="src" style="margin-top:18px">成绩由确定性规则引擎计算；未最终确认的成绩会明确标注。照片仅在赛事开通 Golf Live 相册后展示。</p>
</div>
<div class="cta hidden" id="ctaBar"><a id="ctaBtn" href="https://rukik.com/download/">打开 RUKIK App</a></div>
<script>

}
var EV = null, WALL = null, PREVIEW = null, curHole = 1, curTee = null, geomCache = {};

function renderHero() {

    '<h1>' + esc(e.title) + '</h1>' +
    '<div class="sub">赛事互动 · 精彩瞬间 · 实时成绩</div>' +
    '<div class="card"><div class="meta">' +
    (e.starts_at ? '🗓 ' + fmtTime(e.starts_at, e.timezone) + ' 开赛<br>' : '') +
    (c.name ? '📍 ' + esc(c.name) + (c.address ? '，' + esc(c.address) : '') + (c.city ? '，' + esc(c.city) : '') + '<br>' : '') +
    '🏌️ 状态：' + regLine + (EV.my_role ? ' · 您是本场' + esc(EV.my_role) : '') +

  var cta = document.getElementById('ctaBar'), btn = document.getElementById('ctaBtn');
  cta.classList.remove('hidden');

function renderOrgs() {
  var el = document.getElementById('orgSec');
  var orgs = (EV.organizations || []).filter(function (o) { return o && o.name; });
  if (!orgs.length) { el.innerHTML = ''; return; }
  var order = { '主办': 0, '联合主办': 1, '承办': 2, '协办': 3, '冠名赞助': 4, '赞助商': 5, '合作伙伴': 6 };
  orgs.sort(function (a, b) { return (order[a.type] != null ? order[a.type] : 9) - (order[b.type] != null ? order[b.type] : 9); });
  el.innerHTML = '<div class="card"><h2>主办 · 协办 · 赞助</h2>' + orgs.map(function (o) {
    var name = o.website ? '<a href="' + esc(o.website) + '" target="_blank" rel="noopener">' + esc(o.name) + ' ↗</a>' : esc(o.name);
    return '<div class="org">' + (o.logo_url ? '<img src="' + esc(o.logo_url) + '" alt="">' : '') + '<div><div class="t">' + esc(o.type || '合作伙伴') + '</div><div class="n">' + name + '</div>' + (o.intro ? '<div class="i">' + esc(o.intro) + '</div>' : '') + '</div></div>';
  }).join('') + '</div>';
}
function renderCare() {
  var el = document.getElementById('careSec');
  var tips = EV.care_tips || { public: [], personal: null };
  var all = (tips.public || []).concat(tips.personal || []);
  if (!all.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="card"><h2>RUKIK 替您想到的</h2><ul class="tips">' + all.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
}
function teeFamily(name) {
  var n = String(name || '').toLowerCase();
  if (n.indexOf('silver') >= 0) return 'silver';
  if (n.indexOf('gold') >= 0) return 'gold';
  if (n.indexOf('unicorn') >= 0) return 'unicorn';
  if (n.indexOf('championship') >= 0) return 'championship';
  if (n.indexOf('fairway') >= 0) return 'fairway';
  return '';
}
function suspectNote(hole) {
  var dq = PREVIEW && PREVIEW.data_quality;
  if (!dq || !dq.suspect_yardages) return '';
  var fam = teeFamily((PREVIEW.tees || []).filter(function (t) { return t.id === curTee; }).map(function (t) { return t.name; })[0]);
  for (var i = 0; i < dq.suspect_yardages.length; i++) {
    var su = dq.suspect_yardages[i];
    if (su.hole === hole && (String(su.tee_family).indexOf(fam) >= 0)) return su.note || '码数待核实';
  }
  return '';
}
function project(feats) {
  var pts = [];
  function walk(g) {
    if (!g) return;
    if (g.type === 'Point') pts.push(g.coordinates);
    else if (g.type === 'LineString' || g.type === 'MultiPoint') g.coordinates.forEach(function (p) { pts.push(p); });
    else if (g.type === 'Polygon' || g.type === 'MultiLineString') g.coordinates.forEach(function (r) { r.forEach(function (p) { pts.push(p); }); });
    else if (g.type === 'MultiPolygon') g.coordinates.forEach(function (pl) { pl.forEach(function (r) { r.forEach(function (p) { pts.push(p); }); }); });
  }
  feats.forEach(function (f) { walk(f.geojson && f.geojson.geometry); });
  var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  var kx = Math.cos(((y0 + y1) / 2) * Math.PI / 180);
  var W = 720, H = 520, pad = 26;

function pathOf(geom, pr, close) {
  function line(coords) { return coords.map(function (p, i) { var q = pr(p); return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(' '); }
  if (geom.type === 'LineString') return line(geom.coordinates);
  if (geom.type === 'Polygon') return geom.coordinates.map(function (r) { return line(r) + ' Z'; }).join(' ');
  if (geom.type === 'MultiPolygon') return geom.coordinates.map(function (pl) { return pl.map(function (r) { return line(r) + ' Z'; }).join(' '); }).join(' ');

var FILLS = { fairway: '#bfe3c0', green: '#43a047', bunker: '#ecd9a0', water_hazard: '#a8d4f0', rough: '#d8e6c3', tee: '#ffffff', boundary: 'none' };
function renderHoleSvg(data) {
  var feats = data.features || [];
  var all = feats.slice(); if (data.boundary) all.push({ type: 'boundary', geojson: data.boundary });
  var pr = project(all);
  var parts = [];
  if (data.boundary) parts.push('<path d="' + pathOf(data.boundary.geometry, pr) + '" fill="none" stroke="#9db8a2" stroke-width="1.5" stroke-dasharray="5 4"/>');
  var order = { fairway: 1, rough: 1, water_hazard: 2, cartpath: 3, bunker: 4, green: 5, tee: 6, hole: 7, pin: 8 };
  feats.sort(function (a, b) { return (order[a.type] || 5) - (order[b.type] || 5); });
  feats.forEach(function (f) {
    var g = f.geojson.geometry;
    if (f.type === 'pin' || g.type === 'Point') { var q = pr(g.coordinates); parts.push('<circle cx="' + q[0] + '" cy="' + q[1] + '" r="6" fill="#dc2626" stroke="#fff" stroke-width="2"/>'); return; }

function holeData() {
  if (!PREVIEW) return null;
  var by = PREVIEW.holes_by_tee || {};
  var list = by[curTee] || PREVIEW.holes || [];
  for (var i = 0; i < list.length; i++) if (list[i].hole === curHole) return list[i];
  return null;
}
function renderMap() {
  var el = document.getElementById('mapSec');
  if (!PREVIEW || !PREVIEW.name) { el.innerHTML = ''; return; }
  var comp = PREVIEW.completeness || {};
  var h = holeData();
  var suspect = h ? suspectNote(h.hole) : '';
  var teeOpts = (PREVIEW.tees || []).map(function (t) { return '<option value="' + t.id + '"' + (t.id === curTee ? ' selected' : '') + '>' + esc(t.name) + (t.course_rating ? '（' + t.course_rating + '/' + t.slope + '）' : '') + '</option>'; }).join('');
  var dots = '';
  for (var i = 1; i <= 18; i++) dots += '<button type="button" data-hole="' + i + '"' + (i === curHole ? ' class="on"' : '') + '>' + i + '</button>';
  el.innerHTML = '<div class="card"><h2>球场地图 · 18 洞预览</h2>' +
    (PREVIEW.latitude != null ? '<iframe class="osm" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=' + (PREVIEW.longitude - 0.013) + ',' + (PREVIEW.latitude - 0.008) + ',' + (PREVIEW.longitude + 0.013) + ',' + (PREVIEW.latitude + 0.008) + '&layer=mapnik&marker=' + PREVIEW.latitude + ',' + PREVIEW.longitude + '"></iframe>' : '') +

    (teeOpts ? '<select id="teeSel">' + teeOpts + '</select>' : '') + '</div>' +
    '<div class="dots">' + dots + '</div>' +
    '<div id="holeSvg" style="margin-top:10px"><div class="skl"></div></div>' +
    '<div class="holeinfo">' + (h ? ('Par ' + h.par + ' · 标准杆指数 ' + (h.stroke_index != null ? h.stroke_index : '—') + ' · 距离 ' + (h.yards != null ? h.yards + ' 码' : '—（该发球台暂无逐洞码数）') + (suspect ? '<span class="suspect">码数待核实：' + esc(suspect) + '</span>' : '')) : '本洞记分卡资料暂缺') + '</div>' +
    '<div class="src">资料来源：记分卡 OpenGolfAPI（署名 © OpenStreetMap contributors (ODbL 1.0) via OpenGolfAPI）；球洞几何 © OpenStreetMap contributors（ODbL）。' + esc(comp.note || '') + (PREVIEW.data_quality && PREVIEW.data_quality.trust ? '<br>' + esc(PREVIEW.data_quality.trust) + '。' : '') + '</div></div>';

function setHole(n) { curHole = n; renderMap(); }

    geomCache[curHole] = j;
    var b2 = document.getElementById('holeSvg'); if (!b2) return;

  }).catch(function () {
    var b2 = document.getElementById('holeSvg'); if (!b2) return;
    b2.innerHTML = '<div class="err">本洞地图加载失败。<br><button class="retry" type="button">重试</button></div>';
    b2.querySelector('button.retry').addEventListener('click', loadHoleSvg);
  });
}
function renderFunc(board) {
  var el = document.getElementById('funcSec');
  var st = stateOf();
  var rows = '';
  if (board && board.entries && board.entries.length) {
    rows = '<table class="board"><tr><th>名次</th><th>' + (board.scope === 'team_stroke' || board.scope === 'team_points' ? '队伍' : '球员') + '</th><th>成绩</th></tr>' +
      board.entries.slice(0, 8).map(function (en) {
        var val = en.total != null ? en.total : (en.totalGross != null ? en.totalGross : (en.totalPoints != null ? en.totalPoints : ''));
        var note = en.counted ? '（计入 ' + en.counted.length + ' 人汇总）' : '';
        return '<tr><td>' + (en.rank != null ? en.rank : '') + '</td><td>' + esc(en.name || en.team_name || '') + note + '</td><td>' + esc(val) + (board.is_final ? '' : ' · 未最终确认') + '</td></tr>';
      }).join('') + '</table>';
  } else {
    rows = '<div class="empty">暂无排名数据（尚未开始记分或成绩未提交）。</div>';
  }
  var pairHtml = '';
  var pairs = (EV && EV.pairings) || [];
  if (pairs.length) {
    pairHtml = '<div style="margin-top:10px;font-size:14px;line-height:1.9"><strong>分组</strong>：' + pairs.map(function (p) { return '第 ' + p.group_no + ' 组（' + ((p.golf_pairing_players || []).length) + ' 人）'; }).join(' · ') + '</div>';
  }
  el.innerHTML = '<div class="card"><h2>' + (st === 'post' ? '赛事结果' : '排行榜') + (board && board.is_final ? '（正式）' : '') + '</h2>' + rows + pairHtml +
    '<div class="funcrow" style="margin-top:12px"><a href="https://rukik.com/download/">📝 记分（打开 App）</a><a href="https://rukik.com/download/">🤖 问 RUKIK 球童</a>' +
    (eventId ? '<a href="https://rukik.com/golf/board.html?e=' + encodeURIComponent(eventId) + '">📺 大屏榜</a>' : '') + '</div></div>';
}
function renderLive() {
  var el = document.getElementById('liveSec');
  if (!WALL || !WALL.album_enabled) { el.innerHTML = ''; return; }
  var feed = WALL.feed || [];
  var stats = WALL.stats || {};
  el.innerHTML = '<div class="stats"><div class="stat"><b>' + (stats.players != null ? stats.players : '—') + '</b><span>参赛球员</span></div><div class="stat"><b>' + (stats.photos != null ? stats.photos : '—') + '</b><span>现场照片</span></div><div class="stat"><b>' + (stats.progress_hole ? '第 ' + stats.progress_hole + ' 洞' : '—') + '</b><span>当前进度</span></div></div>' +
    '<div class="card"><h2>Golf Live · 精彩瞬间</h2>' +
    (feed.length ? '<div class="feed">' + feed.map(function (f) {
      return '<figure>' + (f.url ? '<img loading="lazy" src="' + esc(f.thumb_url || f.url) + '" alt="">' : '') + '<figcaption>' + esc(f.caption || '现场分享') + '<div class="m">' + (f.hole_number ? '第 ' + f.hole_number + ' 洞 · ' : '') + '现场分享' + (f.author ? ' · ' + esc(f.author) : '') + (f.like_count ? ' · ❤ ' + f.like_count : '') + '</div></figcaption></figure>';
    }).join('') + '</div>' : '<div class="empty">暂无现场照片。</div>') +
    '<div class="funcrow" style="margin-top:12px"><a href="https://rukik.com/golf/photos.html">📷 分享现场精彩瞬间</a></div></div>';
}
var LASTBOARD = null;
function loadBoardIntoFunc() {
  dyn('leaderboard_get', {}).then(function (j) {
    LASTBOARD = j;
    renderFunc(j);
    var el = document.getElementById('funcSec');
    var h = el.querySelector('h2');
    if (h) { var t = new Date(); h.innerHTML += ' <span style="font-size:12px;color:#888;font-weight:normal">更新于 ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + '</span>'; }
  }).catch(function () {
    if (LASTBOARD) return; // 已有上次数据：保留展示（带原更新时间），不清空、不整页报错
    errBox(document.getElementById('funcSec'), '排行榜加载失败，请重试。', loadBoardIntoFunc);
  });
}
function loadWall() {
  dyn('wall_get', {}).then(function (j) {
    WALL = j.wall || null;
    if (EV) { renderHero(); renderLive(); }
  }).catch(function () {
    var el = document.getElementById('liveSec');
    if (el && ((EV && EV.album_enabled) || (SNAP && SNAP.album_enabled))) errBox(el, '精彩瞬间加载失败，请重试。', loadWall);
  });
}
var SNAP = null, WALL_STARTED = false;
var SNAP_URL = 'https://yzgzgtrqrmarfjftgbwt.supabase.co/storage/v1/object/public/share-images/golf-snapshots/' + eventId + '.json';
function applySnapshot(j) {
  // L0 基础层：海报/名称/时间/地点/机构/场次——不依赖 golf-api，存储直出即可见
  EV = {
    event: { title: j.title, title_en: j.title_en, description: j.description, status: j.status, starts_at: j.starts_at, timezone: j.timezone, cover_url: j.cover_url, poster_urls: j.poster_urls || [], format: j.format },
    course: { name: j.course_name, address: j.course_address, city: j.course_city },
    organizations: j.organizations || [], sessions: j.sessions || [],
    album_enabled: !!j.album_enabled, care_tips: { public: [], personal: null }, course_preview: null, pairings: [],
  };
  renderHero(); renderOrgs();
}
function maybeWall() {
  if (WALL_STARTED) return;
  var enabled = EV && EV.album_enabled != null ? EV.album_enabled : (SNAP ? SNAP.album_enabled : null);
  if (enabled === null || enabled === undefined) return; // 开通状态未知，等动态层
  if (!enabled) { WALL_STARTED = true; window.__l3skipped = true; return; } // L3：未开通零请求
  WALL_STARTED = true; loadWall();
}
function loadDynamic() {
  dyn('event_get', {}).then(function (j) {
    EV = j; PREVIEW = j.course_preview || null;
    curTee = PREVIEW && PREVIEW.main_tee_id;
    renderHero(); renderOrgs(); renderMap();
    if (LASTBOARD) loadBoardIntoFunc();
    setTimeout(renderCare, 900); // L4 关怀层：基础与排名之后最后渲染，失败静默（renderCare 无数据即隐藏）
    maybeWall();
  }).catch(function (e) {
    var msg = String(e && e.message || e);
    if (!SNAP) {
      errBox(document.getElementById('heroSec'), msg.indexOf('event not found') >= 0 ? '赛事不存在或链接无效。' : '赛事信息加载失败（网络或服务暂时不可用）。', loadDynamic);
      document.getElementById('statePill').textContent = '加载失败';
    } else {
      errBox(document.getElementById('mapSec'), '球场地图加载失败，请重试。', loadDynamic);
    }
    maybeWall();
  });
}
function boot() {
  document.getElementById('heroSec').innerHTML = '<div class="skl"></div>';
  loadBoardIntoFunc(); // L2 排名独立启动，不等基础层
  var t0 = Date.now();
  var ctrl = new AbortController(); var to = setTimeout(function () { ctrl.abort(); }, 4000);
  fetch(SNAP_URL, { signal: ctrl.signal }).then(function (r) { clearTimeout(to); if (!r.ok) throw new Error('snap ' + r.status); return r.json(); })
    .then(function (j) {
      window.__reqLog.push({ action: 'snapshot', ms: Date.now() - t0, ok: true });
      if (j && j.event_id === eventId && !PREVIEW) { SNAP = j; applySnapshot(j); maybeWall(); }
    })
    .catch(function () { window.__reqLog.push({ action: 'snapshot', ms: Date.now() - t0, ok: false }); /* 快照失败：回退 API 基础层，不报错 */ });
  loadDynamic();
}
if (!eventId) {
  errBox(document.getElementById('heroSec'), '链接缺少赛事参数。', function () { location.href = 'https://rukik.com/golf/event.html?e=11564c2e-9c4f-40de-a54a-9803a0ae024c'; });
} else {
  boot();
}
</script>
