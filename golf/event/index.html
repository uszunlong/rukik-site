<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUKIK Golf 赛事</title>
<meta property="og:title" content="RUKIK Golf 赛事">
<meta property="og:description" content="RUKIK Golf｜懂比赛，更懂每一位球员。打开就能比赛，打完就有回忆。">
<meta name="description" content="RUKIK Golf｜懂比赛，更懂每一位球员。">
<style>
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f8f2; color:#17301c; }
  .hero { background:linear-gradient(135deg,#0b1f14,#1d4a2a); color:#fff; padding:34px 22px 26px; }
  .brand { color:#9fd08a; letter-spacing:2px; font-size:13px; }
  h1 { margin:8px 0 6px; font-size:27px; line-height:1.3; }
  .meta { color:#cfe6c8; font-size:15px; line-height:1.7; }
  main { padding:18px 22px 40px; max-width:760px; margin:0 auto; }
  h2 { font-size:19px; margin:26px 0 10px; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; }
  td, th { padding:10px 12px; border-bottom:1px solid #e5eee1; text-align:left; font-size:15px; }
  .tag { display:inline-block; background:#7a5b12; color:#ffe9a8; border-radius:999px; padding:2px 10px; font-size:12px; }
  .tag.final { background:#14532d; color:#bbf7d0; }
  .cta { display:block; text-align:center; background:#1d7a3a; color:#fff; padding:14px; border-radius:12px; text-decoration:none; font-size:17px; margin-top:22px; }
  .sponsor { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .sponsor img { height:36px; background:#fff; border-radius:6px; padding:3px 8px; }
  .note { color:#5c7260; font-size:13px; line-height:1.7; }
  .ann { background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
</style>
</head>
<body>
<div class="hero">
  <div class="brand">RUKIK GOLF ｜ 懂比赛，更懂每一位球员</div>
  <h1 id="title">赛事加载中…</h1>
  <div class="meta" id="meta"></div>
</div>
<main>
  <h2>排行榜 <span class="tag" id="boardTag">实时 · 未最终确认</span></h2>
  <table><thead><tr><th>名次</th><th>球员 / 球队</th><th>成绩</th></tr></thead><tbody id="rows"><tr><td colspan="3">加载中…</td></tr></tbody></table>
  <h2>赛事公告</h2>
  <div id="anns"><p class="note">暂无公告</p></div>
  <h2>赞助伙伴</h2>
  <div class="sponsor" id="sponsors"><p class="note">—</p></div>
  <a class="cta" href="https://rukik.com/download/">打开 RUKIK App 报名 / 记分</a>
  <p class="note">报名、记分与个人赛事主页在 RUKIK App 内完成；本页为公开赛事信息与实时排行榜。未锁定的成绩为实时排名，不作为正式名次。</p>
</main>
<script>
var API = 'https://yzgzgtrqrmarfjftgbwt.supabase.co/functions/v1/golf-api';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6Z3pndHJxcm1hcmZqZnRnYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTkzNjksImV4cCI6MjEwNzg3NTM2OX0.SORkmMkYrorMPHdDBwgyG8bRIJRi7hhhLHKe5mvQCnc';
var eventId = new URLSearchParams(location.search).get('e');
function call(action, body) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': ANON, 'Authorization': 'Bearer ' + ANON }, body: JSON.stringify(Object.assign({ action: action }, body || {})) }).then(function (r) { return r.json(); });
}
function scoreText(e) {
  if (e.totalPoints != null) return e.totalPoints + ' 分';
  if (e.netTotal != null) return '净 ' + e.netTotal + ' 杆';
  if (e.totalStrokes != null) return e.totalStrokes + ' 杆';
  if (e.grossTotal != null) return e.grossTotal + ' 杆';
  if (e.points != null) return e.points + ' 分';
  if (e.result) return e.result;
  return '—';
}
if (eventId) {
  call('event_get', { event_id: eventId }).then(function (d) {
    if (!d.event) return;
    document.title = d.event.title + ' · RUKIK Golf';
    document.getElementById('title').textContent = d.event.title;
    var bits = [];
    if (d.course) bits.push('球场：' + d.course.name);
    if (d.event.starts_at) bits.push('时间：' + String(d.event.starts_at).slice(0, 16).replace('T', ' '));
    bits.push('赛制：' + d.event.format);
    document.getElementById('meta').innerHTML = bits.join('<br>');
    var sp = document.getElementById('sponsors');
    if ((d.sponsors || []).length) sp.innerHTML = d.sponsors.map(function (s) { return s.logo_url ? '<img src="' + s.logo_url + '" alt="' + s.name + '">' : '<span>' + s.name + '</span>'; }).join('');
  });
  call('leaderboard_get', { event_id: eventId }).then(function (d) {
    var tag = document.getElementById('boardTag');
    if (d.is_final) { tag.textContent = '正式排名'; tag.classList.add('final'); }
    var rows = d.entries || [];
    document.getElementById('rows').innerHTML = rows.length ? rows.map(function (e, i) {
      return '<tr><td>' + (e.rank != null ? e.rank : i + 1) + '</td><td>' + (e.name || '') + '</td><td>' + scoreText(e) + '</td></tr>';
    }).join('') : '<tr><td colspan="3">暂无成绩</td></tr>';
  });
}
</script>
</body>
</html>
