<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分享效果 · RUKIK 专业工作台</title>
<meta name="description" content="专家分享落地访问与客户转化统计：主页/分身页访问、对话发起、转真人咨询与点数订单，7天/30天/累计。">
<style>
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#F7F3EC;color:#202020}
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:24px;color:#142235;margin:8px 0 4px}
  .sub{color:#8B857D;font-size:13px;line-height:1.7}
  .tabs{display:flex;gap:8px;margin:20px 0}
  .tabs button{flex:0 0 auto;background:#fff;border:1px solid #e3ddd2;color:#142235;border-radius:999px;padding:9px 20px;font-size:15px;cursor:pointer;min-height:44px}
  .tabs button.on{background:#142235;color:#F7F3EC;border-color:#142235}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(20,34,53,.06)}
  .card .n{font-size:28px;font-weight:700;color:#142235}
  .card .t{font-size:13px;color:#8B857D;margin-top:4px;line-height:1.6}
  h2{font-size:17px;color:#142235;margin:28px 0 10px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(20,34,53,.06)}
  th,td{padding:11px 14px;font-size:14px;text-align:left;border-bottom:1px solid #f1ede4}
  th{background:#142235;color:#F7F3EC}
  .note{font-size:12px;color:#8B857D;line-height:1.8;margin-top:18px}
  .authbox{background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 12px rgba(20,34,53,.06);max-width:460px;margin:24px auto}
  .authbox input{width:100%;border:1px solid #e3ddd2;border-radius:999px;padding:11px 16px;font-size:16px;outline:none;box-sizing:border-box;margin-top:10px;min-height:44px}
  .authbox button{width:100%;background:#142235;color:#F7F3EC;border:none;border-radius:999px;padding:11px;font-size:15px;cursor:pointer;margin-top:12px;min-height:44px}
  .msg{font-size:13px;color:#8B857D;text-align:center;min-height:18px;margin-top:10px}
  a{color:#B58A58}
</style>
</head>
<body>
<div class="wrap">
  <div style="font-size:13px"><a href="/studio/">← 专业工作台</a></div>
  <h1>分享效果</h1>
  <p class="sub">统计的是经分享标识的<b>落地访问</b>与后续转化，不是微信转发次数，也不包含群身份信息。UV 按「访客 × 专家 × 日」去重。</p>
  <div id="authArea"></div>
  <div id="main" hidden>
    <div class="tabs" id="winTabs">
      <button data-win="7d" class="on">近 7 天</button>
      <button data-win="30d">近 30 天</button>
      <button data-win="all">累计</button>
    </div>
    <div class="grid" id="cards"></div>
    <h2>渠道拆分（落地访问）</h2>
    <table><thead><tr><th>渠道</th><th>访问 PV</th><th>访客 UV</th></tr></thead><tbody id="srcBody"></tbody></table>
    <h2>物料拆分（落地访问）</h2>
    <table><thead><tr><th>物料标识 m</th><th>访问 PV</th></tr></thead><tbody id="mBody"></tbody></table>
    <p class="note" id="notes"></p>
  </div>
</div>
<script>
var SB='https://yzgzgtrqrmarfjftgbwt.supabase.co';
var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6Z3pndHJxcm1hcmZqZnRnYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTkzNjksImV4cCI6MjEwNzg3NTM2OX0.SORkmMkYrorMPHdDBwgyG8bRIJRi7hhhLHKe5mvQCnc';
var SRC_LABEL={wx_friend:'微信好友',wx_group:'微信群',moments:'朋友圈',qr_home:'主页二维码',qr_chat:'分身聊天二维码',link:'直接访问/普通链接'};
var statsData=null, curWin='7d';
function storedToken(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('sb-')===0&&k.indexOf('auth-token')>0){var v=JSON.parse(localStorage.getItem(k));if(v&&v.access_token)return v.access_token;}}}catch(e){}try{var s=sessionStorage.getItem('rk_share_stats_token');if(s)return s;}catch(e){}return null;}
function saveToken(t){try{sessionStorage.setItem('rk_share_stats_token',t);}catch(e){}}
function loadStats(token){
  fetch(SB+'/functions/v1/share-stats',{headers:{'Authorization':'Bearer '+token,'apikey':ANON}})
  .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
  .then(function(res){
    if(res.s===401){showLogin('登录已过期，请重新登录。');return;}
    if(res.s===403){document.getElementById('authArea').innerHTML='<div class="authbox"><p>当前账号不是已入驻专家，暂无分享统计。</p></div>';return;}
    if(res.s!==200||!res.j.stats){showLogin('加载失败，请重试。');return;}
    statsData=res.j;document.getElementById('authArea').innerHTML='';document.getElementById('main').hidden=false;render();
  }).catch(function(){showLogin('网络异常，请重试。');});
}
function render(){
  var w=statsData.stats.windows[curWin];
  var cards=[
    [w.pv_home,'主页访问 PV'],[w.uv_home,'主页访客 UV'],[w.pv_chat,'分身页访问 PV'],[w.uv_chat,'分身页访客 UV'],
    [w.chat_starts,'分身对话发起'],[w.consult_leads,'转真人咨询'],[w.paid_rounds,'点数付费轮次'],[w.paid_points,'付费点数合计']
  ];
  document.getElementById('cards').innerHTML=cards.map(function(c){return '<div class="card"><div class="n">'+c[0]+'</div><div class="t">'+c[1]+'</div></div>';}).join('');
  var bySrc=statsData.stats.by_src.filter(function(r){return r.win===curWin;});
  document.getElementById('srcBody').innerHTML=bySrc.length?bySrc.map(function(r){return '<tr><td>'+(SRC_LABEL[r.src]||r.src)+'</td><td>'+r.pv+'</td><td>'+r.uv+'</td></tr>';}).join(''):'<tr><td colspan="3">暂无数据</td></tr>';
  var byM=statsData.stats.by_m.filter(function(r){return r.win===curWin;});
  document.getElementById('mBody').innerHTML=byM.length?byM.map(function(r){return '<tr><td>'+(r.m==='(none)'?'（无物料标识）':r.m)+'</td><td>'+r.pv+'</td></tr>';}).join(''):'<tr><td colspan="2">暂无数据</td></tr>';
  var n=statsData.notes||{};
  document.getElementById('notes').textContent=[n.landing,n.chat_starts,n.consult_leads,n.paid].filter(Boolean).join('；')+'。付费口径：生产暂无现金付费咨询订单实体，故以点数扣费轮次与点数呈现，不展示现金金额。';
}
function showLogin(msg){
  document.getElementById('main').hidden=true;
  document.getElementById('authArea').innerHTML='<div class="authbox"><p style="margin:0;font-size:15px;line-height:1.7">请用专家账号的邮箱登录后查看（与 App 同一账号）。</p>'
  +'<input id="lgEmail" type="email" placeholder="邮箱地址" autocomplete="email">'
  +'<button id="lgSend" type="button">发送验证码</button>'
  +'<input id="lgCode" type="text" placeholder="邮箱收到的验证码" autocomplete="one-time-code" hidden>'
  +'<button id="lgVerify" type="button" hidden>验证并登录</button>'
  +'<div class="msg" id="lgMsg">'+(msg||'')+'</div></div>';
  document.getElementById('lgSend').onclick=function(){
    var em=document.getElementById('lgEmail').value.trim();if(!em)return;
    fetch(SB+'/auth/v1/otp',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json'},body:JSON.stringify({email:em,create_user:false})})
    .then(function(r){document.getElementById('lgMsg').textContent=r.ok?'验证码已发送，请查收邮箱。':'发送失败，请确认邮箱是否为专家账号邮箱。';if(r.ok){document.getElementById('lgCode').hidden=false;document.getElementById('lgVerify').hidden=false;}});
  };
  document.getElementById('lgVerify').onclick=function(){
    var em=document.getElementById('lgEmail').value.trim(),code=document.getElementById('lgCode').value.trim();if(!em||!code)return;
    fetch(SB+'/auth/v1/verify',{method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json'},body:JSON.stringify({email:em,token:code,type:'email'})})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(res){if(res.s===200&&res.j.access_token){saveToken(res.j.access_token);loadStats(res.j.access_token);}else{document.getElementById('lgMsg').textContent='验证码不正确或已过期。';}});
  };
}
document.getElementById('winTabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;curWin=b.dataset.win;[].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});if(statsData)render();});
var t=storedToken();if(t){loadStats(t);}else{showLogin('');}
</script>
</body>
</html>
