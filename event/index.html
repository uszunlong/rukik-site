<script>
var BASE = 'https://yzgzgtrqrmarfjftgbwt.supabase.co';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6Z3pndHJxcm1hcmZqZnRnYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTkzNjksImV4cCI6MjEwNzg3NTM2OX0.SORkmMkYrorMPHdDBwgyG8bRIJRi7hhhLHKe5mvQCnc';
var REST = { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON };
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jget(url, headers, body){
  var ctrl = new AbortController(); var to = setTimeout(function(){ctrl.abort();}, 15000);
  var opt = { signal: ctrl.signal, headers: headers };
  if(body){ opt.method='POST'; opt.body = JSON.stringify(body); }
  return fetch(url, opt).then(function(r){ clearTimeout(to); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .catch(function(e){ clearTimeout(to); throw e; });
}
function fmtDate(iso, tz){
  if(!iso) return '';
  try{
    return new Intl.DateTimeFormat('zh-CN',{timeZone:tz||'America/Los_Angeles',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso));
  }catch(e){ return String(iso).slice(0,10); }
}
var GST = { published:'报名中', in_progress:'进行中', completed:'已结束' };
var ALL = [], FILTER = 'all', PAGE = 0, PER = 24;

function golfEvents(){
  return jget(BASE + '/functions/v1/golf-api', { 'apikey': ANON, 'Content-Type': 'application/json' }, { action: 'event_list' })
  .then(function(j){
    var evs = (j && j.events) || [];
    var mirrorIds = {};
    var jobs = evs.filter(function(e){ return e.status!=='cancelled' && e.status!=='draft'; }).map(function(e){
      if(e.public_event_id) mirrorIds[e.public_event_id] = 1;
      return jget(BASE + '/functions/v1/golf-api', { 'apikey': ANON, 'Content-Type': 'application/json' }, { action: 'event_get', event_id: e.id })
        .then(function(g){ var c = g && g.course; e.__course = c ? (c.name + (c.city ? ' · ' + c.city : '')) : ''; })
        .catch(function(){ e.__course=''; })
        .then(function(){
          return { kind:'golf', id:e.id, title:e.title, img: e.cover_url || (Array.isArray(e.poster_urls)&&e.poster_urls[0]) || '',
                   date: e.starts_at || '', tz: e.timezone || 'America/Los_Angeles',
                   place: e.__course || '', st: GST[e.status] || '',
                   href: '/golf/event.html?e=' + encodeURIComponent(e.id) };
        });
    });
    return Promise.all(jobs).then(function(cards){ return { cards: cards, mirrorIds: mirrorIds }; });
  });
}
function pubEvents(mirrorIds){
  var q = '/rest/v1/public_events?select=id,title,category,cover_image_url,venue_name,city,venue_timezone'
        + '&review_status=eq.APPROVED&event_status=eq.UPCOMING&order=created_at.desc&limit=300';
  return jget(BASE + q, REST).then(function(rows){
    rows = rows.filter(function(r){ return !mirrorIds[r.id]; });
    var ids = rows.map(function(r){ return r.id; });
    var chunks = [];
    for(var i=0;i<ids.length;i+=60) chunks.push(ids.slice(i,i+60));
    return Promise.all(chunks.map(function(ch){
      var sq = '/rest/v1/event_sessions?select=event_id,start_at,timezone&event_id=in.(' + ch.join(',') + ')&order=start_at.asc&limit=2000';
      return jget(BASE + sq, REST).catch(function(){ return []; });
    })).then(function(parts){
      var byEv = {};
      parts.forEach(function(ss){ ss.forEach(function(s){ (byEv[s.event_id] = byEv[s.event_id] || []).push(s); }); });
      var now = Date.now() - 12*3600*1000;
      return rows.map(function(r){
        var ss = byEv[r.id] || [];
        var pick = null;
        for(var k=0;k<ss.length;k++){ if(new Date(ss[k].start_at).getTime() >= now){ pick = ss[k]; break; } }
        if(!pick && ss.length) pick = ss[ss.length-1];
        var place = r.venue_name ? (r.venue_name + (r.city ? ' · ' + r.city : '')) : (r.city || '');
        return { kind: (r.category === 'BUSINESS' ? 'biz' : 'etc'), id: r.id, title: r.title,
                 img: r.cover_image_url || '', date: pick ? pick.start_at : '', tz: (pick && pick.timezone) || r.venue_timezone || 'America/Los_Angeles',
                 place: place, st: '', href: '/event/' + encodeURIComponent(r.id) + '/' };
      });
    });
  });
}
function filtered(){
  return ALL.filter(function(c){ return FILTER==='all' || c.kind===FILTER; });
}
function paint(){
  var grid = document.getElementById('grid');
  var list = filtered();
  var show = list.slice(0, PER*(PAGE+1));
  if(!list.length){
    grid.innerHTML = '<div class="state"><span class="big">🎫</span>这个分类下暂时没有活动。</div>';
    return;
  }
  var html = show.map(function(c){
    var chip = c.kind==='golf' ? '<span class="chip golf">高尔夫</span>' : (c.kind==='biz' ? '<span class="chip biz">商务</span>' : '<span class="chip etc">其他</span>');
    var ph = c.kind==='golf' ? '⛳' : (c.kind==='biz' ? '💼' : '🎉');
    return '<a class="card" href="'+esc(c.href)+'"><div class="thumb">'
      + (c.img ? '<img src="'+esc(c.img)+'" alt="" loading="lazy"/>' : '<div class="ph ph-'+c.kind+'">'+ph+'</div>')
      + chip + (c.st ? '<span class="st">'+esc(c.st)+'</span>' : '') + '</div>'
      + '<div class="info"><h3>'+esc(c.title)+'</h3>'
      + (c.date ? '<p class="meta">📅 '+esc(fmtDate(c.date, c.tz))+'</p>' : '')
      + (c.place ? '<p class="meta">📍 '+esc(c.place)+'</p>' : '')
      + '</div></a>';
  }).join('');
  if(list.length > show.length) html += '<div class="more"><button type="button" id="moreBtn">查看更多活动（' + (list.length - show.length) + '）</button></div>';
  grid.innerHTML = html;
  var mb = document.getElementById('moreBtn');
  if(mb) mb.onclick = function(){ PAGE++; paint(); };
}
function load(){
  var grid = document.getElementById('grid');
  grid.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  var g = golfEvents().catch(function(){ return { cards: [], mirrorIds: {} }; });
  g.then(function(gr){
    return pubEvents(gr.mirrorIds).catch(function(){ return []; }).then(function(pc){ return gr.cards.concat(pc); });
  }).then(function(cards){
    ALL = cards;
    ALL.sort(function(a,b){
      if(a.date && b.date) return String(a.date).localeCompare(String(b.date));
      if(a.date) return -1; if(b.date) return 1; return 0;
    });
    PAGE = 0; paint();
    if(!ALL.length) grid.innerHTML = '<div class="state"><span class="big">🎫</span>近期活动筹备中，敬请期待。</div>';
  }).catch(function(){
    grid.innerHTML = '<div class="state"><span class="big">🎫</span>活动加载遇到一点问题。<br/><button onclick="load()">重新加载</button></div>';
  });
}
document.getElementById('tabs').addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('.tab') : null; if(!b) return;
  FILTER = b.getAttribute('data-f'); PAGE = 0;
  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i]===b);
  if(ALL.length) paint();
});
var qf = new URLSearchParams(location.search).get('f');
if(qf && ['golf','biz','etc'].indexOf(qf) >= 0){
  FILTER = qf;
  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-f')===qf);
}
load();
</script>
